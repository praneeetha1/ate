: "2", "unit": "oz", "item": "Parmesan cheese, grated"}, {"amount": "1/2", "unit": "tsp", "item": "ground black pepper"}, {"amount": "2", "unit": "", "item": "roma tomato, diced"}, {"amount": "5", "unit": "cup", "item": "baby spinach"}], "steps": ["Cook pasta according to package directions, omitting salt and oil.  Carefully remove 1/2 cup (for 4 servings) of the cooking water for later use.  Drain pasta and set aside.", "Meanwhile, combine bread crumbs, oil and pressed garlic cloves in microwave-safe bowl.  Microwave, uncovered, on high 1-2 minutes or until light golden brown, stirring every 30 seconds.  Stir in parsley; set aside.", "Cut cauliflower into small florets and onion into 1/2-in wedges.  Spritz medium skillet with olive oil.  Heat over medium-high heat until hot, then add cauliflower and onion, and season with salt. Cook 3-4 minutes or until cauliflower is golden brown on all sides, stirring occasionally.", "Stir in remaining 1 tbsp oil, remaining pressed garlic cloves, wine, and pepper flakes; bring to a boil.  Cook 2-3 minutes or until wine is reduced by half.", "Add pasta, reserved cooking water, cheeses, black pepper, and remaining 1tsp salt; mix well.", "Remove skillet from heat, add spinach and tomatoes, stir until spinach wilts.", "Cover and let stand 10 minutes or until spinach is wilted and sauce is thickened, stirring once halfway through.", "Top each serving with bread crumb mixture and additional parmesan cheese."]}, {"name": "Pasta with asparagus and egg", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "3/4", "unit": "lb", "item": "angel hair pasta"}, {"amount": "3", "unit": "tbsp", "item": "unsalted butter"}, {"amount": "1/4", "unit": "cup", "item": "parmesan, grated, about 1/2 oz=1/4 cup"}, {"amount": "1", "unit": "bunch", "item": "thin asparagus (about 1 pound=1 bunch), trimmed to bite-size"}, {"amount": "4", "unit": "", "item": "large eggs"}], "steps": ["Cook pasta. Meanwhile, toss chopped asparagus with oil, salt, pepper, and whatever other seasoning you desire. Roast at 450F for 8 minutes.", "When pasta is done, drain it, reserving some pasta water. Return it to the pot, and add butter, parmesan, and enough pasta water to make a thin sauce. Also add asparagus.", "Fry eggs over easy. Dish the pasta, and top with egg and a little more parmesan."], "timeMinutes": 30}, {"name": "Squash lasagna with fresh basil", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "9", "unit": "", "item": "lasagna noodles, uncooked"}, {"amount": "2", "unit": "cup", "item": "fontina cheese, shredded"}, {"amount": "1/4", "unit": "cup", "item": "Parmesan cheese, grated"}, {"amount": "2", "unit": "", "item": "medium zucchini, thinly sliced"}, {"amount": "2", "unit": "cup", "item": "fresh basil, loosely packed, chopped, plus more for garnish"}, {"amount": "1/2", "unit": "tsp", "item": "nutmeg, freshly grated"}, {"amount": "3", "unit": "tbsp", "item": "olive oil"}, {"amount": "1/2", "unit": "cup", "item": "all-purpose flour"}, {"amount": "3", "unit": "cup", "item": "milk, divided"}, {"amount": "1 1/4", "unit": "tsp", "item": "salt"}, {"amount": "1/2", "unit": "tsp", "item": "ground black pepper"}, {"amount": "2", "unit": "pkg", "item": "12-oz frozen cooked winter squash, thawed"}, {"amount": "2", "unit": "", "item": "tomatoes, diced for garnish, optional"}], "steps": ["Preheat the over to 400F. Cook noodles according to package directions, omitting salt and oil; drain and set aside. Meanwhile combine cheeses in a small bowl; set aside.", "For sauce, heat oil in large saucepan over medium heat 1 minute.", "Add flour; whisk until completely incorporated.", "Gradually add 1 cup of the milk, whisking constantly until smooth.", "Add remaining milk, nutmeg, salt, and black pepper, whisking constantly.", "Bring mixture to a simmer.", "Reduce heat to medium-low; cook 3-4 minutes or until thickened, whisking frequently.", "Add squash and basil; bring to a simmer.", "Remove pan from heat.", "To assemble lasagna, spread 1 cup of the sauce over bottom of 9x13 baking dish.", "Top with three of the lasagna noodles.", "Spread 1 1/4 cups of the sauce over noodles; top with half of the zucchini and about 1/2 cup of the cheese mixture.", "Repeat layers one time, starting with noodles.", "Top with remaining noodles, sauce, and cheese mixture.", "Cover pan with aluminum foil; back 25 minutes.", "Carefully remove foil.", "Continue to bake lasagna, uncovered, 15-17 minutes or until cheese begins to brown and center is hot.", "Remove pan from oven to cooling rack.", "Let stand, uncovered, 20 minutes.", "Top with additional basil and diced tomato, if desired."], "timeMinutes": 65}, {"name": "Creamy Broccoli & Sun-Dried Tomato Orzotto", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "", "item": "medium onion, finely chopped"}, {"amount": "3", "unit": "", "item": "garlic cloves, pressed"}, {"amount": "2", "unit": "tsp", "item": "olive oil"}, {"amount": "1 1/2", "unit": "cup", "item": "uncooked orzo pasta"}, {"amount": "3 3/4", "unit": "cup", "item": "vegetable broth"}, {"amount": "3/4", "unit": "cup", "item": "dry white wine, such as Chardonnay"}, {"amount": "1 8", "unit": "oz", "item": "jar sun-dried tomatoes in oil, drained and patted dry"}, {"amount": "1", "unit": "head", "item": "broccoli"}, {"amount": "2", "unit": "oz", "item": "Parmesan cheese"}, {"amount": "6", "unit": "oz", "item": "mascarpone cheese"}, {"amount": "", "unit": "", "item": "Fresh parsley, chopped (optional)"}], "steps": ["Heat oil in 12\" skillet over medium-high heat.", "Add onion and garlic; cook 30-45 seconds or until fragrant. Stir in orzo, vegetable broth and wine; cook, uncovered, 14-16 minutes or until almost all liquid is absorbed and orzo is tender.", "Remove skillet from heat. Add tomatoes and broccoli. Cover; let stand 5 minutes. Add cheeses; mix well. Add parsley for garnish, if desired."]}, {"name": "Gnocchi", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "5", "unit": "", "item": "large Idaho potatoes"}, {"amount": "2", "unit": "", "item": "eggs"}, {"amount": "3/4", "unit": "cup", "item": "grated Parmesan"}, {"amount": "3 1/2", "unit": "cup", "item": "all-purpose flour"}, {"amount": "1", "unit": "tablespoon", "item": "salt"}], "steps": ["Preheat the oven to 375 or 400 degrees F.", "Bake the potatoes until they are fork tender, about 45 minutes to 1 hour. Check them!", "While the potatoes are still hot peel and pass them through a food mill or ricer. (I find that the food mill works just as well as a ricer and is much easier to handle) onto a sheet tray lined with parchment paper.", "When doing this pay careful attention to keep the potatoes as light and fluffy as possible.", "This will aid in keeping the gnocchi light.", "Refrigerate the potatoes on the sheet tray until cold.", "This is also a very important step.", "If the potatoes are warm while adding flour they will require more flour which will result in a much heavier finished product.", "When the potatoes are absolutely cold, transfer to a clean work surface. Beat together the eggs and cheese and pour onto the potatoes. Season with salt. Cover generously with flour. It should look like snow on the mountains.", "Crumble the potato flour mixture between your fingers. Begin to knead the dough until it is a dry homogeneous mixture. The dough should feel slightly moist, but not tacky. If too tacky, repeat the snow on the mountains stage.", "Form the dough into a large log. Cut slices off the log and begin to roll into long ropes that are about 1-inch in thickness. Cut the ropes into 1/2-inch lengths. Cover generously with flour. Place the gnocchi in a single layer on a sheet tray dusted with flour. DO NOT PILE ON TOP OF EACH OTHER!!", "Use or freeze the gnocchi immediately. If freezing, place tray directly into the freezer. Once frozen, the gnocchi can be stored in plastic bags, in the freezer, indefinitely. When cooking gnocchi they can go directly from the freezer into salted boiling water.", "Note: It is a general practice to take gnocchi out of the water when they float. This is a big mistake. Gnocchi need to be cooked in boiling water until they float and get nice and puffy. Not cooking gnocchi long enough will also result in heavy gnocchi.", "P.S. These are Chef Anne \"Secrets\" to great gnocchi, use them and you will be successful every time.", "Read more at: http://www.foodnetwork.com/recipes/anne-burrell/gnocchi-with-prosciutto-spring-peas-and-chanterelles-recipe/index.html?oc=linkback"], "timeMinutes": 75}, {"name": "Grilled Cheese & Tomato Skillet", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "8", "unit": "slices", "item": "bread, halved"}, {"amount": "3", "unit": "tbsp", "item": "butter, melted"}, {"amount": "4", "unit": "cup", "item": "grape tomatoes, divided"}, {"amount": "3", "unit": "cup", "item": "vegetable broth"}, {"amount": "1", "unit": "", "item": "medium onion, finely chopped"}, {"amount": "1 1/2", "unit": "tbsp", "item": "olive oil"}, {"amount": "3", "unit": "", "item": "garlic cloves, pressed"}, {"amount": "16", "unit": "oz", "item": "uncooked medium shell pasta"}, {"amount": "1/2", "unit": "cup", "item": "heavy whipping cream"}, {"amount": "2", "unit": "tsp", "item": "salt"}, {"amount": "1", "unit": "tsp", "item": "coarsely ground black pepper"}, {"amount": "2", "unit": "cup", "item": "sharp cheddar, shredded and divided"}, {"amount": "", "unit": "", "item": "Fresh parsley, chopped (optional)"}], "steps": ["Brush bread slices with butter. Toast in skillet 3-5 minutes until golden brown, turning once.", "Meanwhile, cut 1/16th (1/4 cup from 4 cups) of the tomatoes into quarters; set aside for garnish. Finely dice remaining tomatoes.", "Add oil, onion, and garlic to skillet; cook over medium-high heat 2\u20133 minutes or until onion is translucent, stirring frequently. Care es.", "Add radish greens and cook until wilted.", "Season with salt and pepper, then add to pasta and stir to combine.", "In skillet, melt 1 tablespoon butter.", "Add shrimp, season with salt and pepper, and cook, stirring occasionally, until opaque throughout, 4 minutes.", "Add shrimp to pasta and toss, adding enough pasta water to create a light sauce that coats pasta."], "timeMinutes": 35}, {"name": "Skillet shrimp and orzo", "category": "Pasta & Noodles", "dietary": [], "ingredients": [{"amount": "5", "unit": "teaspoon", "item": "extra-virgin olive oil"}, {"amount": "6", "unit": "", "item": "garlic cloves, minced"}, {"amount": "3", "unit": "cup", "item": "grape tomatoes, halved"}, {"amount": "", "unit": "", "item": "Coarse salt and ground pepper"}, {"amount": "3/4", "unit": "pound", "item": "orzo"}, {"amount": "3 1/4", "unit": "cup", "item": "low-sodium chicken broth"}, {"amount": "1", "unit": "teaspoon", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "pound", "item": "large shrimp, peeled and deveined"}, {"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "1/4", "unit": "tsp", "item": "black pepper"}, {"amount": "1", "unit": "cup", "item": "fresh basil leaves, torn"}], "steps": ["In a large broilerproof skillet, heat 5 teaspoons oil over medium.", "Add garlic and cook until just beginning to brown, 1 minute.", "Increase heat to high and add tomatoes; season with salt and pepper and cook, stirring occasionally, until softened, 6 minutes.", "Add orzo and broth and bring to a simmer.", "Cover and simmer until liquid is mostly absorbed, 10 to 12 minutes.", "Meanwhile, preheat broiler with oven rack in top position.", "Toss shrimp with 1 teaspoon oil and 1/4 teaspoon each salt and pepper. Remove skillet from heat and place shrimp on top of orzo. Heat broiler. Broil until shrimp are opaque throughout, 4 minutes. Sprinkle with basil and serve."], "timeMinutes": 35}, {"name": "Penne with Butternut Squash and Goat Cheese", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "", "unit": "", "item": "Vegetable oil cooking spray"}, {"amount": "2", "unit": "pound", "item": "butternut or kobucha squash, peeled, seeded and cut into 3/4-inch cubes"}, {"amount": "1", "unit": "", "item": "onion, diced into 1/2-inch pieces"}, {"amount": "", "unit": "", "item": "Olive oil, for drizzling"}, {"amount": "", "unit": "", "item": "Kosher salt and freshly ground black pepper"}, {"amount": "1", "unit": "pound", "item": "penne pasta"}, {"amount": "8", "unit": "oz", "item": "goat cheese, crumbled"}, {"amount": "1", "unit": "cup", "item": "walnuts, coarsely chopped and toasted (see Cook's Note)"}, {"amount": "1", "unit": "", "item": "packed cup fresh basil leaves, chopped"}, {"amount": "1/3", "unit": "cup", "item": "Parmesan, finely grated"}], "steps": ["Put an oven rack in the upper third of the oven. Preheat the oven to 425 degrees F.", "Spray a baking sheet, liberally, with vegetable oil cooking spray. Set aside.", "Mix the squash and onion together and arrange in a single layer on the prepared baking sheet. Drizzle with olive oil and season with salt and pepper, to taste. Bake for to 40 to 45 minutes until the vegetables are golden and cooked through. Remove from the oven and set aside to cool slightly.", "While the squash mixture is cooling, bring a large pot of salted water to a boil over high heat.", "Add the pasta and cook until tender but still firm to the bite, stirring occasionally, about 8 to 10 minutes.", "Drain and reserve about 2 cups of the pasta water.", "Put the pasta, goat cheese and 1 cup of pasta water in a large serving bowl.", "Toss until the cheese has melted and forms a creamy sauce.", "Add the squash and onion mixture, the walnuts and the basil.", "Toss well and season with salt and pepper, to taste.", "Garnish with Parmesan and serve.", "To toast the walnuts, arrange them in a single layer on a baking sheet. Bake in a preheated 350 degree F oven until lightly toasted, abou ot enough that a rosemary leaf sizzles immediately when added to the pan, add the rosemary and walnuts.", "Cook, stirring frequently, 2 to 3 minutes, or until the rosemary is crispy and the walnuts are golden brown.", "Leaving any oil in the pan, transfer the fried rosemary and walnuts to a paper towel-lined plate.", "Immediately season with salt and pepper.", "Add the pasta to the pot of boiling water; cook according to package instructions or until al dente (still slightly firm to the bite). Reserving 1/2 cup of the pasta cooking water, drain thoroughly.", "Cook the kale:\nAdd 2 teaspoons of olive oil, the shallot, and the garlic to the pan; season with salt and pepper.", "Cook on medium-high, stirring occasionally, 2 to 3 minutes, or until softened and fragrant.", "Add the kale and as much of the red pepper flakes as you\u2019d like, depending on how spicy you\u2019d like the dish to be; season with salt and pepper.", "Cook, stirring frequently, 3 to 4 minutes, or until the kale has wilted.", "Add the vinegar (be careful, as the liquid may splatter) and cook, stirring constantly, 30 seconds to 1 minute, or until the liquid has cooked off.", "Add the heavy cream and cook, stirring constantly, 30 seconds to 1 minute, or until thoroughly combined.", "Turn off the heat and season with salt and pepper to taste.", "Add the cooked pasta, butter, and half the reserved pasta cooking water to the pan of cooked kale.", "Cook on medium-high, stirring vigorously, 1 to 2 minutes, or until the pasta is thoroughly coated. (If the pasta seems dry, gradually add the remaining cooking water to achieve your desired consistency.) Turn off the heat and season with salt and pepper to taste.", "Divide the finished pasta between 2 dishes.", "Drizzle with olive oil.", "Top with the fried rosemary and walnuts.", "Garnish with the cheese.", "Enjoy!"], "timeMinutes": 35}, {"name": "Soba Noodle Bento", "category": "Pasta & Noodles", "dietary": [], "ingredients": [{"amount": "3 1/2", "unit": " d or lightly toasted"}, {"amount": "2/3", "unit": "cup", "item": "Monterey Jack cheese, shredded (1 cup \u2248 3 oz)"}, {"amount": "1/2", "unit": "", "item": "avocado, pitted, peeled and thinly sliced"}, {"amount": "1", "unit": "cup", "item": "packed shredded romaine lettuce"}, {"amount": "2", "unit": "tbsp", "item": "pickled jalapeno"}], "steps": ["In a small pot, heat oil over medium. Add onion and garlic and cook until onion is soft and garlic is fragrant, 3 minutes. Add seasoning and cook until fragrant, 1 minute. Add beans, water (using bean water if possible), salt, and pepper, and simmer until beans are heated through, 5 minutes. Mash in pan with wooden spoon.", "Season to taste with salt and pepper if needed. Serve with tortillas, cheese, avocado, lettuce, and jalapenos."], "timeMinutes": 15}, {"name": "Tofu and Sweet Potato Jambalaya", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "14", "unit": "oz", "item": "firm tofu"}, {"amount": "1", "unit": "tablespoon", "item": "olive oil"}, {"amount": "1", "unit": "", "item": "large sweet potato, peeled and cut into 1/2-inch cubes"}, {"amount": "2", "unit": "clove", "item": "garlic, finely chopped"}, {"amount": "2", "unit": "cup", "item": "vegetable broth"}, {"amount": "3/4", "unit": "cup", "item": "uncooked regular long-grain white rice"}, {"amount": "2", "unit": "tablespoon", "item": "Worcestershire sauce"}, {"amount": "1/4", "unit": "teaspoon", "item": "ground red pepper"}, {"amount": "1", "unit": "can", "item": "black beans (15 oz), rinsed and drained"}, {"amount": "12", "unit": "", "item": "medium green onions, sliced"}], "steps": ["Drain tofu; cut into 3/4-inch cubes.", "Carefully press cubes between paper towels to remove as much water as possible.\n2.", "Heat oil in 12-inch skillet over medium heat.", "Cook tofu in oil 6 to 8 minutes, turning frequently, until light golden brown.", "Remove tofu from skillet; set aside.\n3.", "Add sweet potato and garlic to skillet.", "Cook 2 : "pine nuts"}, {"amount": "2", "unit": "cup", "item": "firmly packed basil leaves"}, {"amount": "3", "unit": "clove", "item": "garlic"}, {"amount": "1/2", "unit": "cup", "item": "best quality extra-virgin olive oil"}, {"amount": "3/4", "unit": "cup", "item": "freshly grated Parmesan cheese"}, {"amount": "", "unit": "", "item": "Salt and freshly ground pepper, to taste"}], "steps": ["Place pine nuts in a skillet over medium-low heat. Stir or toss frequently until toasted. Cool before using.", "Place basil, pine nuts, and garlic in food processor or blender. Pulse until finely chopped. With motor running, slowly drizzle in olive oil. Blend a few minutes, stopping occasionally to scrape sides, until smooth.", "Stir in grated Parmesan. Taste for seasoning and add salt and pepper to taste, if desired. Yields about 1 1/4 cup pesto."]}, {"name": "Baked eggs and beans on toast", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1 1/2", "unit": "tbsp", "item": "extra-virgin olive oil, plus more for brushing"}, {"amount": "1/2", "unit": "", "item": "small onion, chopped"}, {"amount": "1", "unit": "tbsp", "item": "tomato paste"}, {"amount": "2", "unit": "tbsp", "item": "apple cider vinegar"}, {"amount": "1", "unit": "tbsp", "item": "honey mustard"}, {"amount": "2", "unit": "tsp", "item": "Worcestershire sauce"}, {"amount": "1/2", "unit": "cup", "item": "water"}, {"amount": "", "unit": "", "item": "Kosher salt and freshly ground pepper"}, {"amount": "2", "unit": "can", "item": "navy beans, 1 undrained; 1 drained and rinsed"}, {"amount": "8", "unit": "", "item": "large eggs"}, {"amount": "8", "unit": "", "item": "thick slices crusty bread"}, {"amount": "2", "unit": "cup", "item": "grape tomatoes, halved"}, {"amount": "1/4", "unit": "cup", "item": "fresh parsley, chopped"}, {"amount": "1/2", "unit": "tbsp", "item": "olive oil"}], "steps": ["Heat olive oil in a large skillet over medium-high heat.", "Add the onion and cook, stirring, until golden, about 5 minutes.", "Add the tomato paste and cook, stirring, 1 more minute.", "Stir in the vinegar, honey mustard, Worcestershire sauce, water, and salt and pepper to taste.", "Bring to a simmer, then add the beans, plus the liquid from one of the cans.", "Cook until the beans are soft, about 5 more minutes.", "Make indentations in the bean mixture and crack an egg into each. Sprinkle with salt and pepper, then cover and cook until the egg whites are set, 3 minutes or so. (Whites should still be slightly \"jiggly\" when you remove from heat, as they'll continue cooking for a bit and you want the yolks runny.)", "Meanwhile, make toast. Butter it when it comes out. (Or make skillet toast with butter over high heat, 1 minute per side or until browned.)", "Toss the tomatoes, parsley and remaining olive oil, and salt and pepper to taste in a bowl. Serve the beans and eggs topped with tomato salad, and toast on the side."]}, {"name": "Roasted cauliflower and white beans", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1 1/2", "unit": "cup", "item": "cauliflower florets"}, {"amount": "1", "unit": "tsp", "item": "extra-virgin olive oil"}, {"amount": "", "unit": "", "item": "Salt and pepper"}, {"amount": "1/4", "unit": "cup", "item": "panko"}, {"amount": "1", "unit": "tbsp", "item": "Parmesan, finely grated"}, {"amount": "1 1/4", "unit": "tsp", "item": "fresh rosemary, finely chopped"}, {"amount": "1/2", "unit": "cup", "item": "cannellini beans, rinsed and drained"}, {"amount": "1", "unit": "tsp", "item": "lemon zest"}, {"amount": "1/4", "unit": "tsp", "item": "red-pepper flakes"}], "steps": ["Preheat oven to 450F. On a rimmed baking sheet, toss cauliflower with 1/2 of the oil. Season with salt and pepper. Roast for 15-20 minutes. In a small bowl, combine remaining oil, panko, cheese, and rosemary.", "Remove sheet from oven. Add beans, lemon zest, and red-pepper flakes to cauliflower, sprinkle with panko mixture and roast until panko is golde ount": "1", "unit": "cup", "item": "uncooked basmati rice"}, {"amount": "1", "unit": "", "item": "medium onion, chopped"}, {"amount": "1", "unit": "", "item": "serrano pepper, chopped"}, {"amount": "1", "unit": "", "item": "small sweet potato, peeled and diced small"}, {"amount": "2", "unit": "tbsp", "item": "olive oil"}, {"amount": "2", "unit": "can", "item": "chickpeas, drained and rinsed"}, {"amount": "2", "unit": "tbsp", "item": "yellow curry paste"}, {"amount": "4", "unit": "", "item": "garlic cloves, pressed"}, {"amount": "1 1/2", "unit": "tbsp", "item": "ginger"}, {"amount": "2", "unit": "can", "item": "lite coconut milk"}, {"amount": "1/2", "unit": "", "item": "medium head cauliflower, cut into small florets"}, {"amount": "2", "unit": "tbsp", "item": "lemon juice"}, {"amount": "1", "unit": "cup", "item": "frozen peas"}, {"amount": "1 3/4", "unit": "tsp", "item": "salt"}], "steps": ["Cook the rice.", "Heat oil in a large saucepan over medium heat. Add onion and serrano; cook 3-4 minutes or until onion is softened.", "Add potato, chickpeas, curry powder, garlic, and ginger. Cook and stir 3-4 minutes or until fragrant.", "Stir in coconut milk and cauliflower and bring to a simmer. Reduce heat to medium low; cover and cook 8-9 minutes or until potato is tender, stirring frequently.", "Add lemon juice, peas, and salt to pan; simmer 4-5 minutes or until cauliflower is tender. Serve curry with rice."], "timeMinutes": 40}, {"name": "Chiles Rellenos", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "5", "unit": "", "item": "plum tomatoes, cored and coarsely chopped"}, {"amount": "1", "unit": "", "item": "garlic clove, minced"}, {"amount": "1/3", "unit": "cup", "item": "white onion, chopped"}, {"amount": "1", "unit": "tablespoon", "item": "olive oil"}, {"amount": "", "unit": "", "item": "Salt and freshly ground black pepper"}, {"amount": "1 1/2", "unit": "cup", "item": "Monterrey Jack cheese"}, {"amount": "1", "unit": "tablespoon", "item": "dried oregano"}, {"amount": "6", "unit": "", "item": "poblano chili peppers, charred, seeded, and deveined *see Cook's Note"}, {"amount": "3", "unit": "", "item": "egg whites, at room temperature"}, {"amount": "1", "unit": "", "item": "egg yolk, at room temperature"}, {"amount": "", "unit": "", "item": "All-purpose flour, for dredging"}, {"amount": "", "unit": "", "item": "Vegetable oil, for frying"}], "steps": ["Sauce: Put the tomatoes, garlic and onion in a blender. Blend until smooth. In a medium saute pan, heat the oil over medium heat. Add the sauce and simmer for 5 minutes. Season with salt and pepper, to taste.", "Chile rellenos: Mix the cheese and oregano in a small bowl.", "Cut a slit through 1 side of the charred chiles and fill each chile with 1/4 cup of the cheese mixture.", "Close with toothpicks to hold the filling in place.", "In a medium bowl, using an electric hand mixer, beat the egg whites on high speed until soft peaks form.", "Add the egg yolk and continue to beat for about 1 minute.", "In a large heavy-bottomed saucepan, pour in enough oil to fill the pan about a third of the way.", "Heat over medium heat until a deep-frying thermometer inserted in the oil reaches 375 degrees F. (If you don't have a thermometer a cube of bread will brown in about 3 minutes.) Dredge the filled chiles in flour until fully covered.", "Shake off any excess flour, then dip the chiles into the egg mixture, until well coated.", "Fry until golden brown and drain on paper towels.", "Arrange the chiles on a serving platter, spoon the sauce on top and serve.", "Notes\nTo char the chiles (or any fresh chile): Put the chiles over a gas flame or underneath the broiler and cook until they are blackened on all sides. Enclose them in a plastic bag and let stand for 10 minutes to steam, which will make them easier to peel. Peel, stem, and seed the chiles. Once peeled, the chiles may be chopped, sliced or stuffed."], "timeMinutes": 65}, {"name": "Indian Chickpea Wrap", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "tbsp", "item": "ginger, peeled"}, {"amount": "1", "unit": "", "item": "serrano chile pepper, halved, seeded and finely chopped"}, {"amount": "1/2", "unit": "", "item": "small onion, finely chopped"}, {"amount": "1/2", "unit": "teaspoon", "item": "ground cumin"}, {"amount": "", "unit": "", "item": "salt"}, {"amount": "1/2", "unit": "cup", "item": "low-fat plain greek yogurt"}, {"amount": "2", "unit": "teaspoon", "item": "fresh lime juice"}, {"amount": "1/3", "unit": "cup", "item": "fresh cilantro, chopped"}, {"amount": "1", "unit": "tablespoon", "item": "vegetable oil"}, {"amount": "2", "unit": "cup", "item": "chickpeas"}, {"amount": "2", "unit": "", "item": "medium carrots, shredded"}, {"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "1/2", "unit": "cup", "item": "water"}, {"amount": "4", "unit": "pieces", "item": "naan bread, warmed"}], "steps": ["Mix the yogurt, lime juice, cilantro and a pinch of salt in a bowl. Cover and chill until ready to use.", "Heat the vegetable oil in a large skillet over medium-high heat. Combine the ginger, chile, onion, cumin, and heavy pinch of salt, then add to the hot oil and cook, stirring, until most of the liquid has evaporated and the mixture is slightly toasted, about 5 minutes.", "Stir in the chickpeas, carrots, salt and water and continue to cook, stirring, until the sauce is thick and the chickpea is heated through, about 2 more minutes. While cooking, lightly mash the chickpeas so they won't roll around when served.  Season with additional salt if necessary.", "Divide the chickpea filling among the naan bread. Drizzle with some of the yogurt sauce and roll up. Serve with chips."], "timeMinutes": 25}, {"name": "French-Onion Stuffed Potatoes", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "", "item": "large onion, thinly sliced"}, {"amount": "2", "unit": "tbsp", "item": "olive oil"}, {"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "1/4", "unit": "cup", "item": "beef broth"}, {"amount": "3/4", "unit": "cup", "item": "gruyere, shredded"}, {"amount": "4", "unit": "", "item": "russet potatoes"}], "steps": ["Bake potatoes at 400\u00b0 for 1 hour.  Cook onion with olive oil and salt until caramelized, about 30 minutes.", "Scoop flesh out of the potatoes and mash with the onion, beef broth, and 2/3 of the gruyere.  Stuff into the skins, top with more cheese, and broil to melt."], "timeMinutes": 60}, {"name": "Asparagus and lemon risotto", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "5", "unit": "cup", "item": "vegetable stock, preferably homemade"}, {"amount": "1/4", "unit": "cup", "item": "olive oil"}, {"amount": "1", "unit": "", "item": "small onion, finely chopped"}, {"amount": "1", "unit": "cup", "item": "Arborio or Carnaroli rice"}, {"amount": "1/2", "unit": "cup", "item": "dry white wine"}, {"amount": "1", "unit": "bunch", "item": "asparagus, trimmed"}, {"amount": "1", "unit": "cup", "item": "frozen peas, thawed"}, {"amount": "1", "unit": "teaspoon", "item": "lemon zest, grated plus more for garnish"}, {"amount": "2", "unit": "tablespoon", "item": "lemon juice"}, {"amount": "1/2", "unit": "cup", "item": "fresh parsley, chopped"}, {"amount": "1/2", "unit": "cup", "item": "parmesan, finely grated plus more for serving"}, {"amount": "", "unit": "", "item": "Coarse salt and freshly ground pepper"}], "steps": ["Heat 2 tablespoons oil over medium heat in another saucepan. Cook onion, stirring frequently, until soft, 6 to 7 minutes. Add rice, cook, stirring, until edges are translucent, 2 to 3 minutes. Add wine; cook, stirring, just until evaporated.", "Add stock; cook about 20 minutes, stirring occasionally, until almost absorbed.", "Meanwhile, roast the asparagus at 400F for 5 minutes, then let cool and chop to bite-size. Add asparagus and peas to the risotto about 1 minute before risotto is done.", "Remove from heat; stir in lemon zest and juice, parsley, cheese, and remaining 2 tablespoons oil. Season with salt and pepper. Serve immediately with additional cheese and lemon zest."]}, {"name": "Veggie Pizza", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "", "item": "pizza crust"}, {"amount": "1 1/2", "unit": "cup", "item": "mozzarella (low-moisture)"}, {"amount": "2", "unit": "tsp", "item": "Italian seasoning"}, {"amount": "1/4", "unit": "", "item": "white onion, sliced"}, {"amount": "2", "unit": "", "item": "large cremini mushrooms"}, {"amount": "1/2", "unit": "", "item": "tomato, sliced"}, {"amount": "1/2", "unit": "", "item": "zucchini, sliced"}, {"amount": "1/4", "unit": "cup", "item": "parmesan, grated"}, {"amount": "2", "unit": "clove", "item": "garlic"}, {"amount": "2", "unit": "tbsp", "item": "olive oil"}], "steps": ["Preheat oven to 450\u00b0.", "Mix oil and garlic together in small bowl.  Brush onto pizza crust, then bake for 5 minutes, or until garlic is fragrant.", "Mix together cheese and italian seasoning.  Sprinkle on crust.  Top with veggies, then finish with parmesan.  Bake for an additional 7-10 minutes, until cheese is melted."]}, {"name": "Slow-Cooker Greek Stuffed Peppers", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "", "item": "large bell peppers"}, {"amount": "1", "unit": "can", "item": "cannellini beans, rinsed and drained"}, {"amount": "4", "unit": "oz", "item": "crumbled feta"}, {"amount": "1/2", "unit": "cup", "item": "couscous"}, {"amount": "4", "unit": "", "item": "green onions, white and green parts separated, thinly sliced"}, {"amount": "1", "unit": "", "item": "garlic clove, minced"}, {"amount": "1", "unit": "teaspoon", "item": "dried oregano"}, {"amount": "", "unit": "", "item": "Coarse salt and freshly ground pepper"}, {"amount": "", "unit": "", "item": "Lemon wedges, for serving"}], "steps": ["Slice a very thin layer from the base of each bell pepper so they sit flat. Slice off tops just below stem. Discard stems; chop tops, and place in a medium bowl. Remove ribs and seeds from peppers.", "Add beans, feta, couscous, scallion whites, garlic, and oregano to bowl. Season with salt and pepper and toss to combine. Stuff peppers with bean mixture; place upright in slow cooker. Cover; cook on high, 4 hours.", "Sprinkle peppers with scallion greens; serve with lemon wedges.", "---", "To make in the oven: Preheat oven to 350 degrees. In step 2, use a 5-quart Dutch oven or ovenproof pot with a tight-fitting lid; add 1 cup water. Cover; bake until peppers are tender, about 1 hour. Proceed with step 3."], "timeMinutes": 260}, {"name": "Mediterranean Patio Pizza", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "lb", "item": "refrigerated pizza dough"}, {"amount": "", "unit": "", "item": "Olive oil"}, {"amount": "1", "unit": "", "item": "garlic clove, pressed"}, {"amount": "2 14", "unit": "oz", "item": "can artichoke hearts in water, drained, divided"}, {"amount": "4", "unit": "ounce", "item": "cream cheese, softened"}, {"amount": "4", "unit": "ounce", "item": "feta cheese, crumbled, divided"}, {"amount": "1/2", "unit": "teaspoon", "item": "dried oregano"}, {"amount": "2", "unit": "tablespoon", "item": "pine nuts, toasted (optional)"}, {"amount": "2", "unit": "", "item": "plum tomatoes, seeded and chopped"}, {"amount": "1/3", "unit": "cup", "item": "black olives, pitted and sliced"}, {"amount": "1/3", "unit": "cup", "item": "cucumber, sliced and quartered"}, {"amount": "1/4", "unit": "", "item": "small red onion, sliced into thin wedges"}, {"amount": "2", "unit": "tsp", "item": "olive oil"}, {"amount": "1", "unit": "tsp", "item": "red wine vinegar"}, {"amount": "1/4", "unit": "tsp", "item": "dijon mustard"}, {"amount": "", "unit": "", "item": "salt and pepper"}], "steps": ["Preheat oven to 375\u00b0F. Roll out dough.  Lightly spray dough with olive oil, then add garlic.  Bake 14-16 minutes or until golden brown; cool completely.", "For cheese spread, finely chop enough artichoke hearts to make 1/4 cup. Combine with cream cheese, half of the feta cheese and oregano in bowl; mix well. Spread mixture evenly over crust.", "For toppers, quarter remaining artichoke hearts. Arrange them and all other vegetables over cream cheese mixture. Sprinkle with remaining feta cheese and pine nuts.  Drizzle with salad dressing just before serving."]}, {"name": "All-day minestrone (slow cooker)", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "tbsp", "item": "olive oil"}, {"amount": "1", "unit": "", "item": "medium yellow onion, minced"}, {"amount": "1", "unit": "stalk", "item": "celery, chopped"}, {"amount": "1", "unit": "", "item": "carrot, chopped"}, {"amount": "2", "unit": "clove", "item": "garlic, minced"}, {"amount": "4", "unit": "oz", "item": "green beans, ends trimmed and cut into 1-inch pieces"}, {"amount": "1", "unit": "can", "item": "chickpeas, drained and rinsed"}, {"amount": "1 14.5", "unit": "oz", "item": "can diced tomatoes, left undrained"}, {"amount": "1", "unit": "", "item": "medium zucchini"}, {"amount": "6", "unit": "cup", "item": "vegetable stock"}, {"amount": "", "unit": "", "item": "Salt and black pepper"}, {"amount": "1/2", "unit": "cup", "item": "dried ditalini"}, {"amount": "1/4", "unit": "cup", "item": "pesto"}], "steps": ["Pour the oil in the bottom of a 4-6 quart slow cooker.  Add the onion, celery, carrot, and garlic,  cover, and cook on High while you assemble the remaining ingredients.", "After they've been prepped, add the green beans, chickpeas, tomatoes, zucchini, and stock to the slow cooker and season with salt and pepper.  Cover and cook on Low for 7 to 8 hours.", "If using raw ditalini, about an hour before you're ready to serve, add it to the slow cooker and cover.", "Just before serving, stir in the pesto and already-cooked pasta, if using."], "timeMinutes": 440}, {"name": "Guacamole baked potatoes", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "", "item": "russet potatoes, scrubbed clean"}, {"amount": "2", "unit": "", "item": "avocados"}, {"amount": "1", "unit": "tbsp", "item": "lime juice"}, {"amount": "1", "unit": "tbsp", "item": "red onion, diced"}, {"amount": "1", "unit": "tbsp", "item": "cilantro, chopped"}, {"amount": "1/2", "unit": "tsp", "item": "jalapeno, minced"}, {"amount": "", "unit": "", "item": "salt"}, {"amount": "1", "unit": "", "item": "roma tomato, chopped"}], "steps": ["Preheat oven to 400F. Pierce potatoes all over with fork. Bake potatoes for 1 hour. Meanwhile, mash the avocados, lime juice, red onion, cilantro, jalapeno, and salt. Spoon onto baked potatoes. Top with tomato."], "timeMinutes": 75}, {"name": "Samosa baked potatoes", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "", "item": "russet potatoes, scrubbed clean"}, {"amount": "", "unit": "", "item": "olive oil"}, {"amount": "1", "unit": "", "item": "yellow onion, chopped"}, {"amount": "1", "unit": "tbsp", "item": "curry powder"}, {"amount": "1", "unit": "tbsp", "item": "ginger, minced"}, {"amount": "1", "unit": "tsp", "item": "mustard seeds"}, {"amount": "", "unit": "", "item": "salt"}, {"amount": "", "unit": "", "item": "pepper"}, {"amount": "1", "unit": "cup", "item": "frozen peas"}, {"amount": "4", "unit": "tbsp", "item": "yogurt"}, {"amount": "1/4", "unit": "cup", "item": "cilantro, chopped"}], "steps": ["Preheat oven to 400F. Pierce potatoes all over with fork. Place directly on oven rack and bake for 1 hour. Meanwhile, cook onion, curry powder, ginger, mustard seeds, salt, and pepper in olive oil until lightly browned; one or two minutes before they're done, add the frozen peas to defrost and warm them.", "When potatoes are done, remove and let cool for a few minutes. Scoop out their flesh, mash with onion mixture, and stuff back into the skins. Top with yogurt and cilantro."], "timeMinutes": 75}, {"name": "Pinto bean and poblano tacos", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "6", "unit": "", "item": "fresh poblano chili peppers, (about 1/4 pound each)"}, {"amount": "1", "unit": "teaspoon", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "", "item": "medium onion, halved and thinly sliced"}, {"amount": "1", "unit": "can", "item": "pinto beans, drained and rinsed"}, {"amount": "1/4", "unit": "cup", "item": "vegetable stock"}, {"amount": "1", "unit": "teaspoon", "item": "salt"}, {"amount": "1/4", "unit": "cup", "item": "fromage blanc, or plain nonfat yogurt"}, {"amount": "8", "unit": "", "item": "small tortillas, warmed"}, {"amount": "", "unit": "", "item": "Lime wedges, for serving"}, {"amount": "", "unit": "", "item": "Cilantro, for garnish"}], "steps": ["Preheat broiler, with the rack 6 inches from the heat source.", "Place chiles on a baking sheet.", "Broil, flipping once, until charred, 10 to 15 minutes.", "Transfer to a heatproof bowl, and cover with plastic wrap.", "Let stand 15 minutes.", "Remove skins and seeds, and discard.", "Cut chiles into 1/2-inch-thick strips, and set aside.\n2.", "Heat oil in a large nonstick skillet over medium heat.", "Add onion.", "Cook, stirring often, until onion is translucent and pale golden, 10 to 12 minutes.", "Stir in beans, stock, and salt.", "Using a heatproof rubber spatula, fold in chiles; cook until chiles are warmed though, 3 to 5 minutes.\n3.", "Remove from heat; stir in fromage blanc.", "Spoon into the warm tortillas.", "Serve with lime, and garnish with cilantro."], "timeMinutes": 33}, {"name": "Muttar paneer", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/2", "unit": "cup", "item": "vegetable oil"}, {"amount": "8", "unit": "ounce", "item": "paneer, cut into 1/2-inch cubes"}, {"amount": "1", "unit": "", "item": "onion, halved"}, {"amount": "2", "unit": "clove", "item": "garlic, roughly chopped"}, {"amount": "1", "unit": "tbsp", "item": "ginger, roughly chopped"}, {"amount": "", "unit": "", "item": "salt"}, {"amount": "1", "unit": "teaspoon", "item": "turmeric"}, {"amount": "1", "unit": "teaspoon", "item": "garam masala"}, {"amount": "20", "unit": "ounce", "item": "frozen peas"}, {"amount": "1", "unit": "teaspoon", "item": "tomato puree"}, {"amount": "1", "unit": "cup", "item": "vegetable stock"}], "steps": ["Heat the oil a large skillet and add the paneer cubes, in 2 batches, and fry until they are golden. Remove the golden cubes to a double thickness of kitchen towel. (It is possible to dry fry the paneer cubes in the pan with no oil, to avoid the oil splashing you. Then continue with the recipe below.)", "Pour all but about 2 tablespoons of the oil out of the pan. Put the onion, garlic cloves, and ginger into a food processor and blitz to a coarse pulp. Fry gently for about 5 minutes with a sprinkling of salt. Stir in the garam masala and turmeric and cook for another 2 minutes before adding the still frozen peas.", "Dissolve the tomato puree in the vegetable stock and pour over the contents of the pan.", "Stir again and turn the heat down to low, cover with foil or a lid and cook for 15 minutes, tasting to check that the peas are tender.", "You can cook muttar paneer up to this stage, if you like, uncovering and then reheating gently with the diced, oil-crisped cheese, or proceed directly now.", "In which case, take off the foil and add the paneer cubes to warm them through before serving."], "timeMinutes": 40}, {"name": "Tofu Parmesan", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "8", "unit": "serving", "item": "marinara sauce"}, {"amount": "4", "unit": "tbsp", "item": "flour"}, {"amount": "1", "unit": "", "item": "large egg"}, {"amount": "1", "unit": "cup", "item": "breadcrumbs"}, {"amount": "1/2", "unit": "teaspoon", "item": "dried Italian seasoning"}, {"amount": "14", "unit": "oz", "item": "firm tofu, drained and sliced into thick planks"}, {"amount": "2 1/2", "unit": "tablespoon", "item": "extra-virgin olive oil, plus more for drizzling"}, {"amount": "1/4", "unit": "cup", "item": "part-skim mozzarella cheese, shredded"}, {"amount": "1/3", "unit": "cup", "item": "parmesan cheese"}, {"amount": "8", "unit": "cup", "item": "baby spinach"}, {"amount": "4", "unit": "slices", "item": "Italian bread"}], "steps": ["Make marinara sauce, reducing it well.", "Season the tofu with salt. Sprinkle the flour on a plate; beat the egg on another; mix breadcrumbs and Italian seasoning on a third. Coat the tofu in flour, then egg, then breadcrumbs. Fry, spending ~2min on each side.", "Move the tofu to a broiler pan. Top with marinara, then cheese, and broil for 3-4 minutes, until cheese is bubbly and browning.", "Meanwhile, pan-toast the bread in butter, then sprinkle with garlic salt. Wilt the spinach in another pan, lightly seasoning it.", "When everything's finished, plate the spinach with the tofu on top, and serve with garlic bread."], "timeMinutes": 35}, {"name": "Squash and bean burritos", "category": "Vegetarian", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/2", "unit": "cup", "item": "brown rice"}, {"amount": "2", "unit": "clove", "item": "garlic, 1 smashed, 1 minced"}, {"amount": "", "unit": "", "item": "Kosher salt and freshly ground pepper"}, {"amount": "1/2", "unit": "pound", "item": "frozen diced butternut squash, thawed"}, {"amount": "1 15", "unit": "oz", "item": "can black beans"}, {"amount": "1", "unit": "cup", "item": "grape tomatoes"}, {"amount": "1/2", "unit": "cup", "item": "fresh cilantro"}, {"amount": "1/4", "unit": "cup", "item": "pickled jalapeno peppers, plus 2 tablespoons pickling liquid"}, {"amount": "4", "unit": "", "item": "tortillas, warmed"}, {"amount": "1/2", "unit": "cup", "item": "cheddar cheese, shredded"}, {"amount": "1", "unit": "", "item": "avocado, sliced"}, {"amount": "", "unit": "", "item": "Plain low-fat yogurt or sour cream, for serving (optional)"}], "steps": ["Heat a medium skillet over high heat. Add the rice and smashed garlic and cook, stirring, until fragrant, 2 to 3 minutes. Add 1 cup water, season with salt and pepper and bring to a boil. Add the squash and reduce the heat to low; cover and simmer, undisturbed, about 25 minutes; remove from the heat.", "Meanwhile, make the bean salsa: Drain and rinse the beans, quarter the tomatoes and chop the cilantro and jalapenos. Toss with the pickling liquid and minced garlic in a bowl. Season with salt and pepper.", "Stir the rice mixture and spoon it down the center of each tortilla, then top with half of the bean salsa and sprinkle with the cheese. Fold in the sides and roll up. Slice in half and serve with avocado, the remaining bean salsa and yogurt, if desired.", "Read more at: http://www.foodnetwork.com/recipes/food-network-kitchens/chicken-and-bean-burritos-recipe.html?oc=linkback"], "timeMinutes": 40}, {"name": "Guacamole", "category": "Snack & Appetizer", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "", "item": "ripe avocados"}, {"amount": "2", "unit": "", "item": "roma tomatoes, diced fine"}, {"amount": "1/2", "unit": "", "item": "red onion, minced"}, {"amount": "1/2", "unit": "", "item": "handful cilantro, minced"}, {"amount": "2", "unit": "clove", "item": "garlic, minced"}, {"amount": "1", "unit": "", "item": "lime, juiced"}, {"amount": "", "unit": "", "item": "Pinch of sea salt"}, {"amount": "1", "unit": "", "item": "jalapeno, seeded and minced fine"}], "steps": ["Place all ingredients in a bowl with a flat bottom and mash it with a potato masher.  Alternatively, you can mix everything briefly in a food processor.\n2. Stir well and keep refrigerated. This dish will brown on the areas exposed to air within a few hours, so serve it shortly after making it or just stir again before serving."]}, {"name": "The Original Chex Party Mix", "category": "Snack & Appetizer", "dietary": ["vegetarian"], "ingredients": [{"amount": "3", "unit": "cup", "item": "Corn Chex\u00ae cereal"}, {"amount": "3", "unit": "cup", "item": "Rice Chex\u00ae cereal"}, {"amount": "3", "unit": "cup", "item": "Wheat Chex\u00ae cereal"}, {"amount": "1", "unit": "cup", "item": "mixed nuts"}, {"amount": "1", "unit": "cup", "item": "bite-size pretzels"}, {"amount": "1", "unit": "cup", "item": "garlic-flavor bite-size bagel chips or regular-size bagel chips, broken into 1-inch pieces"}, {"amount": "6", "unit": "tablespoon", "item": "butter or margarine"}, {"amount": "2", "unit": "tablespoon", "item": "Worcestershire sauce"}, {"amount": "1 1/2", "unit": "teaspoon", "item": "seasoned salt"}, {"amount": "3/4", "unit": "teaspoon", "item": "garlic powder"}, {"amount": "1/2", "unit": "teaspoon", "item": "onion powder"}], "steps": ["Heat oven to 250.", "Place butter in large roasting pan and melt in the oven.", "Mix together cereals, nuts, pretzels and bagel chips in a large bowl.", "Remove pan from oven and mix seasonings into the melted butter.", "Add cereal mix and stir well to coat with seasoned butter.", "Place in the oven and bake for 1 hour, stirring every 15 minutes.", "Spread mix out to cool before storing."]}, {"name": "Roasted salsa", "category": "Snack & Appetizer", "dietary": ["vegetarian"], "ingredients": [{"amount": "1 1/2", "unit": "lb", "item": "tomatoes"}, {"amount": "1", "unit": "", "item": "medium white onion, halved"}, {"amount": "3", "unit": "", "item": "jalapenos"}, {"amount": "3", "unit": "", "item": "garlic cloves, unpeeled"}, {"amount": "3", "unit": "tbsp", "item": "fresh lime juice"}, {"amount": "", "unit": "", "item": "salt and freshly ground pepper"}, {"amount": "1/4", "unit": "cup", "item": "fresh cilantro, chopped"}], "steps": ["Heat broiler, with rack in top position. Place tomatoes, onion halves, jalapenos, and garlic in a single layer on a rimmed baking sheet.", "Broil until vegetables are blistered and slightly softened, rotating sheet and flipping vegetables frequently, 6 to 8 minutes (garlic may need to be removed earlier if it is browning too quickly.)", "Discard garlic skins. In a food processor, pulse garlic and vegetables until coarsely pureed. Add lime juice, season with salt and pepper, and pulse to combine.", "Transfer salsa to a bowl and stir in cilantro.", "Yields 3 cups. Refrigerate up to 3 days or freeze up to 3 months.", "For green salsa, use 1 1/2 lbs tomatillos and omit lime juice."], "timeMinutes": 23}, {"name": "Kalitsounia Kritis: Sweet Cheese Pastries from Crete", "category": "Snack & Appetizer", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/2", "unit": "cup", "item": "olive oil"}, {"amount": "1/2", "unit": "cup", "item": "sugar"}, {"amount": "1/2", "unit": "cup", "item": "unflavored strained yogurt"}, {"amount": "2", "unit": "", "item": "eggs, beaten with a fork"}, {"amount": "1", "unit": "teaspoon", "item": "baking powder"}, {"amount": "2 3/4", "unit": "cup", "item": "all-purpose flour"}, {"amount": "1/4", "unit": "cup", "item": "brandy"}, {"amount": "1 2/3", "unit": "pound", "item": "fresh soft myzithra cheese, (or mascarpone or ricotta)"}, {"amount": "1/2", "unit": "teaspoon", "item": "ground cinnamon"}, {"amount": "2", "unit": "tablespoon", "item": "sugar"}, {"amount": "1", "unit": "", "item": "egg yolk"}, {"amount": "1", "unit": "teaspoon", "item": "grated orange peel"}, {"amount": "2", "unit": "tablespoon", "item": "all-purpose flour"}, {"amount": "1", "unit": "", "item": "egg, beaten (for glaze)"}, {"amount": "", "unit": "", "item": "ground cinnamon (for baked pastries)"}, {"amount": "", "unit": "", "item": "confectioner's sugar or honey (for fried pastries)"}], "steps": ["Prepare the dough", "In a large bowl:", "Whisk the dry ingredients together (sugar, baking powder, flour).", "Add the oil, mixing with a spoon or hands.", "Stir in the strained yogurt and eggs and mix with spoon until the dough begins to stiffen, adding the brandy to soften the dough as needed.", "Knead the dough in the bowl for approximately 10 minutes until smooth, and set aside to rest.", "Prepare the filling", "In a separate bowl, mix the cheese, cinnamon, sugar, egg yolk, orange peel, and flour together until well blended.", "To bake", "Preheat the oven to 350\u00b0F (180\u00b0C). Lightly grease a baking sheet.", "Make the pastry", "On a floured surface with a rolling pin, roll a piece of dough out to a thickness of about 1/8th of an inch. Using a 3-4 inch cutter or saucer as a guide, cut out circles. (Alternatively, take a piece of dough the size of an unshelled walnut and roll it out to a circle about 3-4 inches across.)", "Place a spoonful of the cheese mixture into the center of the circle and spread out close to the edges. Raise the rim of the dough up around the cheese and, with wet fingers, pinch the edges to pull the dough in around the cheese, leaving the center open so the cheese shows.", "Repeat using all the dough and filling. Place the kalitsounia on the baking sheet and brush lightly with beaten egg to glaze. Bake at 350\u00b0F (180\u00b0C) for approximately 20 minutes until lightly browned (see photo). Sprinkle lightly with cinnamon.", "Allow to cool on the baking sheet. Kalitsounia will keep well, covered, in the refrigerator.", "To fry", "Place a teaspoonful of cheese mix into the center of the circle, fold the circle over into a half-moon shape. With wet fingers, crimp the edges to close securely. Preheat 1 cup of olive oil over medium heat and fry until golden on both sides. Drain on paper towels. Sprinkle with confectioner's sugar or drizzle with honey.", "Yield: 30-36 pieces"]}, {"name": "Avocado feta dip", "category": "Snack & Appetizer", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/2", "unit": "", "item": "red onion, diced"}, {"amount": "1", "unit": "", "item": "jalapeno, seeded and diced"}, {"amount": "", "unit": "", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "", "item": "avocado, diced"}, {"amount": "1", "unit": "4", "unit": "teaspoon", "item": "sesame seeds"}, {"amount": "4", "unit": "servings", "item": "Sushi Rice"}, {"amount": "2", "unit": "teaspoon", "item": "sesame oil"}, {"amount": "3", "unit": "", "item": "green onions, chopped"}, {"amount": "1", "unit": "", "item": "avocado, pitted, peeled, and cut into 1/2-inch cubes"}, {"amount": "1", "unit": "", "item": "English cucumber, cut into matchstick-sized strips"}, {"amount": "1/4", "unit": "cup", "item": "sliced pickled ginger"}], "steps": ["To make the sauce, combine the wasabi powder and water in a saucepan and let bloom for 5 minutes. Add 3/4 cup ponzu, the sake and grated ginger and bring to a boil over high heat. Reduce the heat to medium-low and simmer until the sauce is reduced by half, about 10 minutes.", "Meanwhile, place the fish and asparagus in a large baking dish. Pour the remaining ponzu sauce and the oil over the fish and asparagus and turn to coat evenly. Let stand for 10 minutes.", "In a small frying pan, toast the sesame seeds over medium heat, shaking the pan frequently, until lightly colored, 3 to 4 minutes.", "Immediately pour onto a plate to cool.", "Place a grill pan over medium heat until hot.", "Lift the asparagus from the marinade, place in the pan and cook, turning occasionally, until tender-crisp, about 3 minutes.", "Transfer the asparagus to a plate and cover with aluminum foil, shiny side down, to keep warm.", "Lift the fish from the marinade and place in the grill pan.", "Cook, turning once, until it turns opaque and just begins to flake, 2 to 3 minutes on each side.", "To serve, divide the rice among 4 bowls. Top with a piece of fish and some asparagus. Pour 1/4 cup of the sauce over the fish in each bowl. Garnish each serving with the sesame oil, green onions, avocado, cucumber, pickled ginger and sesame seeds."]}, {"name": "Brussels sprouts with maple and cayenne", "category": "Side Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "lb", "item": "brussels sprouts, trimmed and halved lengthwise"}, {"amount": "1", "unit": "tbsp", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "tsp", "item": "extra-virgin olive oil"}, {"amount": "", "unit": "", "item": "coarse salt"}, {"amount": "1", "unit": "tbsp", "item": "maple syrup"}, {"amount": "1/8", "unit": "tsp", "item": "cayenne pepper"}], "steps": ["Preheat oven to 400F.", "On a rimmed baking sheet, toss brussels sprouts with olive oil and salt.", "Roast until brussels sprouts are browned in spots and tender when pierced with a knife, 15 to 20 minutes, stirring halfway through.", "Meanwhile, in a small bowl, combine maple syrup and cayenne pepper.", "Drizzle brussels sprouts with maple syrup mixture, stir to coat and roast 1 minute."], "timeMinutes": 30}, {"name": "Pickled red onions", "category": "Side Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "3/4", "unit": "cup", "item": "lime juice"}, {"amount": "1/4", "unit": "cup", "item": "red wine vinegar"}, {"amount": "1/4", "unit": "cup", "item": "sugar"}, {"amount": "1", "unit": "tbsp", "item": "salt"}, {"amount": "1", "unit": "", "item": "red onion, thinly sliced"}], "steps": ["Bring all ingredients except red onion to a boil in a small saucepan. Remove from heat and let cool, 5 minutes. Toss with red onion in a bowl; cover and chill at least 4 hours, stirring occasionally."], "timeMinutes": 10}, {"name": "Baked Beans", "category": "Side Dish", "dietary": [], "ingredients": [{"amount": "1", "unit": "pound", "item": "bacon, chopped"}, {"amount": "1", "unit": "", "item": "medium yellow onion, chopped"}, {"amount": "2", "unit": "", "item": "jalapenos, chopped"}, {"amount": "1/4", "unit": "cup", "item": "tomato paste"}, {"amount": "1/4", "unit": "cup", "item": "dark brown sugar"}, {"amount": "1/4", "unit": "cup", "item": "molasses"}, {"amount": "1", "unit": "pound", "item": "dry Great Northern beans, sorted and rinsed"}, {"amount": "1", "unit": "quart", "item": "vegetable broth"}, {"amount": "1/4", "unit": "tsp", "item": "cayenne pepper"}, {"amount": "1", "unit": "tsp", "item": "pepper"}, {"amount": "2", "unit": "tsp", "item": "salt"}], "steps": ["Heat the oven to 250\u00b0.", "Place a cast-iron Dutch oven over medium heat and add the bacon, onion, and jalapenos, stirring until the fat has rendered from the bacon and the onion is softened, about 5 minutes.  Stir in the tomato paste, brown sugar, and molasses.", "Add the beans to the Dutch oven, along with the broth, and bring to a boil over high heat.  Add the cayenne, black pepper, and salt.", "Give them a stir and cover the pot.  Place the pot in the oven and bake for 5 to 7 hours, or until the beans are tender.", "----", "Crock pot instructions:", "Preheat crock pot insert on low while prepping ingredients. Heat a cast-iron Dutch oven over medium heat and cook bacon, onion, and jalapeno as directed above. Pour into crock pot. Add remaining ingredients, stir well, and cook for 7 hours on low or until the beans are tender."], "timeMinutes": 380}, {"name": "Scalloped Yukon Gold and Sweet Potato Gratin", "category": "Side Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "1 1/2", "unit": "pound", "item": "medium Yukon Gold potatoes"}, {"amount": "1 1/2", "unit": "pound", "item": "medium red-skinned sweet potatoes"}, {"amount": "2", "unit": "cup", "item": "heavy whipping cream"}, {"amount": "1/4", "unit": "cup", "item": "butter"}, {"amount": "2", "unit": "", "item": "garlic cloves, minced"}, {"amount": "1", "unit": "tbsp", "item": "fresh parsley, minced"}, {"amount": "1", "unit": "tbsp", "item": "fresh rosemary, minced"}, {"amount": "1", "unit": "tbsp", "item": "fresh sage, minced"}, {"amount": "1", "unit": "tbsp", "item": "fresh thyme, minced"}, {"amount": "1 1/2", "unit": "tsp", "item": "salt"}, {"amount": "3/4", "unit": "tsp", "item": "pepper"}, {"amount": "5", "unit": "ounce", "item": "Gruyere, coarsely grated"}], "steps": ["Fill large bowl with cold water.  Working with 1 potato at a time, peel, then cut into 1/8-inch-thick rounds and place in bowl with water.", "Combine cream, butter, and garlic in medium saucepan; bring to simmer.  Remove from heat.", "Mix all herbs, salt, and pepper in small bowl.", "Butter 13\u00d79\u00d72-inch glass baking dish.", "Drain potatoes, then pat dry with kitchen towels.", "Transfer half of potatoes to prepared baking dish.", "Use hands to distribute and spread evenly.", "Sprinkle with half of herb mixture, then half of cheese.", "Repeat with remaining supplies.", "Pour cream mixture over gratin, pressing lightly to submerge potato mixture as much as possible.  (All of this can be done up to 6 hours ahead: cover with plastic wrap and chill.", "Remove plastic wrap before baking.)", "Preheat oven to 400\u00b0F.  Cover gratin tightly with foil.  Bake 30 minutes.  Uncover, and bake until top of gratin is golden and most of liquid is absorbed, about 25 minutes longer.  Let stand 10 minutes; serve."], "timeMinutes": 80}, {"name": "Shrimp fried rice", "category": "Side Dish", "dietary": [], "ingredients": [{"amount": "8", "unit": "ounce", "item": "small raw shrimp, shelled and deveined"}, {"amount": "1/2", "unit": "teaspoon", "item": "kosher salt"}, {"amount": "", "unit": "", "item": "freshly ground black pepper"}, {"amount": "1/2", "unit": "teaspoon", "item": "cornstarch"}, {"amount": "2", "unit": "tablespoon", "item": "cooking oil, divided"}, {"amount": "3", "unit": "", "item": "eggs, beaten"}, {"amount": "2", "unit": "", "item": "green onions, minced"}, {"amount": "4", "unit": "cup", "item": "leftover rice, grains separated well"}, {"amount": "3/4", "unit": "cup", "item": "frozen peas and carrots, defrosted"}, {"amount": "1", "unit": "tablespoon", "item": "soy sauce, (use gluten-free soy sauce if you are making a gluten-free version)"}, {"amount": "1", "unit": "teaspoon", "item": "sesame oil"}], "steps": ["1 In a bowl, toss the shrimp with the salt, pepper and cornstarch. Let marinate for 10 minutes at room temperature. Heat a wok or large saut\u00e9 pan on high heat. When the pan is hot enough for a bead of water to instantly sizzle and evaporate, add just 1 tablespoon of the cooking oil and swirl to coat pan.", "2 Add the shrimp, quickly spreading out around the cooking surface area so that they are not overlapping. Let fry, untouched for 30 seconds. Flip over and let the other side fry for 30 seconds, or until about 80% cooked through. Remove the shrimp from the pan onto a plate, leaving as much oil in the pan as possible.", "3 Turn the heat to medium, let the pan heat up again. Add the eggs, stirring in a quick motion to break up and scramble the eggs. When the eggs are almost cooked through (they should still be slightly runny in the middle), dish out of the pan into the same plate as the cooked shrimp.", "4 Use paper towels to wipe the same wok or saut\u00e9 pan clean and return to high heat with the remaining 1 tablespoon of cooking oil, swirling to coat.", "When the oil is very hot, add the green onions and fry until fragrant, about 15 seconds.", "Add in the rice and stir well to mix in the green onions throughout.", "Spread the rice all around the wok surface area and let the rice heat up, untouched until you hear the bottoms of the grains sizzle, about 1-2 minutes.", "Use the spatula to toss the rice, again spreading the rice out over the surface of wok.", "5 Drizzle the soy sauce all around the rice and toss. Add the peas and carrots, the cooked eggs, shrimp and sesame oil, tossing to mix the rice evenly with all of the ingredients. Let everything heat back up again, until the rice grains are so hot they practically dance! Taste and add an additional 1 teaspoon of soy sauce if needed."], "timeMinutes": 20}, {"name": "Couscous stuffed bellpeppers with basil sauce", "category": "Side Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "item": "low-sodium chicken broth"}, {"amount": "2", "unit": "teaspoon", "item": "ground cumin"}, {"amount": "3/4", "unit": "cup", " hredded coconut"}, {"amount": "3/4", "unit": "cup", "item": "panko breadcrumbs"}, {"amount": "2", "unit": "tablespoon", "item": "cilantro, chopped"}], "steps": ["Preheat the oven to 425\u00b0. Line a rimmed baking sheet with foil and set a wire rack on top; coat with cooking spray.", "Combine 1 cup water, the coconut water, and rice in a medium saucepan and bring to a boil. Reduce the heat to medium low; cover and simmer 8 minutes. Remove from the heat; add the carrots, red onion, lime zest, half the lime juice, salt, and pepper (do not stir). Cover and let sit 10 minutes, then fluff with a fork to combine.", "Meanwhile, season the shrimp with salt and pepper.", "Beat the egg and 2 tablespoons water in a bowl.", "Combine the coconut and panko in another bowl.", "Dip the shrimp in the egg mixture, then the coconut panko mixture, gently pressing to adhere; transfer to the prepared rack.", "Bake until the shrimp are cooked through, about 10 minutes, then turn on the broiler and broil the shrimp until golden brown, 1 to 2 minutes.", "Add the cilantro to the rice mixture and toss, then top with shrimp and remaining lime juice."], "timeMinutes": 30}, {"name": "Southwestern brown rice bowl", "category": "Side Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "cup", "item": "uncooked brown rice"}, {"amount": "1", "unit": "", "item": "shallot, roughly chopped"}, {"amount": "2", "unit": "cup", "item": "cilantro leaves, tightly packed and tough stems removed"}, {"amount": "1", "unit": "clove", "item": "garlic"}, {"amount": "1/2", "unit": "tsp", "item": "red pepper flakes"}, {"amount": "1/2", "unit": "cup", "item": "olive oil"}, {"amount": "2", "unit": "tbsp", "item": "red wine vinegar"}, {"amount": "1", "unit": "tsp", "item": "salt"}, {"amount": "", "unit": "", "item": "black beans"}, {"amount": "6", "unit": "servings", "item": "guacamole"}, {"amount": "", "unit": "", "item": "pico de gallo (recipe below)"}, {"amount": "", "unit": "", "item": "shredded amount": "8", "unit": "ounce", "item": "asparagus, sliced 1/4-inch thick on the bias"}], "steps": ["Prepare couscous: Place couscous, lime zest, and oil in a medium, heatproof bowl; toss to combine. Set aside.", "Bring water to a boil. Add salt and asparagus; cook for 2 minutes. Pour over couscous, and cover tightly with plastic wrap. Let stand for 5 minutes. Uncover, and fluff couscous with a fork.", "Meanwhile, cook salmon: Preheat broiler with rack set 4 inches away from heat. In a small bowl, stir together hoisin and honey; set aside.", "Spray a baking sheet or broiler pan with cooking spray.", "Place salmon on sheet, skin-side down.", "Squeeze juice of half a lime evenly over salmon; season with salt and pepper.", "Place under broiler, and cook for 5 minutes.", "Remove from oven, and drizzle each fillet with 2 teaspoons hoisin mixture.", "Return to broiler, and cook until glaze is bubbling and salmon is cooked through, 2 to 3 minutes.", "Divide couscous evenly among 4 plates.", "Top each with salmon, and garnish with scallions and lime wedges.", "Serve immediately."], "timeMinutes": 17}, {"name": "Carrot kinpira", "category": "Side Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "", "item": "medium carrots, cut into matchsticks"}, {"amount": "1", "unit": "tbsp", "item": "dark sesame oil"}, {"amount": "1/8", "unit": "tsp", "item": "red pepper flakes (or shichimi togarashi)"}, {"amount": "1", "unit": "tbsp", "item": "soy sauce"}, {"amount": "1", "unit": "tsp", "item": "sesame seeds"}], "steps": ["Heat up a frying pan or wok with the sesame oil. Add the carrots and toss around until crisp-tender, about 4 to 5 minutes depending on how skinny the matchsticks are. Add the red pepper flakes and toss some more. Add soy sauce, toss toss. Add the sesame seeds near the end.", "This does keep in the refrigerator for a couple of days."], "timeMinutes": 19}, {"name": "Sweet pepper and onion confit", "category": "Side Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "", "item": "medium onions, thinly sliced"}, {"amount": "4", "unit": "", "item": "large sweet peppers (mixing red/yellow/green), thinly sliced"}, {"amount": "1", "unit": "", "item": "fennel bulb (optional), thinly sliced"}, {"amount": "2", "unit": "clove", "item": "garlic, thinly sliced"}, {"amount": "1/2", "unit": "tsp", "item": "salt"}, {"amount": "2", "unit": "tbsp", "item": "olive oil"}], "steps": ["Heat up a large pan or heavy pot. Put in the oil and the garlic. Add the vegetables. Sprinkle with some salt (the salt will help the vegetables exude moisture).", "Cook over a medium low heat, stirring sometimes, for at least 10 minutes, up to about 30 minutes. The longer you cook it the the more intense and sweet and brown it gets. The shorter cooking time will yield a still crispy and nice vegetable saut\u00e9 mix.", "It keeps well covered in the refrigerator for about a week. You can freeze it too.", "When you use it, you can add your cuisine-specific herb and flavorings if you like, though it\u2019s tasty as it is.", "Variation: Add a thinly sliced fennel bulb for a slightly aniseedy version.", "Just a few ideas for use:", "Mixed with pasta\nHeat up and add some cold rice; stir-fry for a quick vegetable fried rice. (No added oil needed since there\u2019s enough in the confit)\nAs an omelette filling - great for a Spanish omelette or tortilla\nWrap with rice paper\nOn a sandwich (e.g. feta or fresh goats cheese, the confit, and some arugula on a crusty roll)\nJust tucked into a corner of your bento box!"], "timeMinutes": 50}, {"name": "Steakhouse steaks", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "tablespoon", "item": "coarsely cracked black peppercorns"}, {"amount": "1", "unit": "tablespoon", "item": "fleur de sel"}, {"amount": "2", "unit": "tablespoon", "item": "vegetable oil"}, {"amount": "2", "unit": "", "item": "(10-ounce) filet mignon"}, {"amount": "2", "unit": "tablespoon", "item": "unsalted butter, at room temperature, optional"}, {"amount": "2", "unit": "servings", "item": "Roquefort Cheese Sauce"}], "steps": ["Preheat the oven to 400 degrees F.", "Heat a large, well-seasoned cast iron skillet over high heat until very hot, 5 to 7 minutes.", "Meanwhile, pat the steaks dry with a paper towel and brush them lightly with vegetable oil. Combine the fleur de sel and cracked pepper on a plate and roll the steaks in the mixture, pressing lightly to evenly coat all sides.", "When the skillet is ready, add the steaks and sear them evenly on all sides for about 2 minutes per side, for a total of 10 minutes.", "Top each steak with a tablespoon of butter, if using, and place the skillet in the oven. Cook the steaks until they reach 120 degrees F for rare or 125 degrees F for medium-rare on an instant-read thermometer. (To test the steaks, insert the thermometer sideways to be sure you're actually testing the middle of the steak.)", "Remove the steaks to a serving platter, cover tightly with aluminum foil and allow to rest at room temperature for 10 minutes. Serve hot with [Roquefort Cheese Sauce](http://www.xanthir.com/recipes/showrecipe.php?id=62) on the side."]}, {"name": "Vegetarian Steamed Dumplings", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/2", "unit": "pound", "item": "firm tofu"}, {"amount": "1/2", "unit": "cup", "item": "carrots, coarsely grated"}, {"amount": "1/2", "unit": "cup", "item": "Napa cabbage, shredded"}, {"amount": "2", "unit": "tablespoon", "item": "red bell pepper, finely chopped"}, {"amount": "2", "unit": "tablespoon", "item": "green onions, finely chopped"}, {"amount": "2", "unit": "teaspoon", "item": "fresh ginger, finely minced"}, {"amount": "1", "unit": "tablespoon", "item": "cilantro, chopped"}, {"amount": "1", "unit": "tablespoon", "item": "soy sauce"}, {"amount": "1", "unit": "tablespoon", "item": "hoisin sauce"}, {"amount": "2", "unit": "teaspoon", "item": "sesame oil"}, {"amount": "1", "unit": "", "item": "egg, lightly beaten"}, {"amount": "1", "unit": "teaspoon", "item": "kosher salt"}, {"amount": "1/4", "unit": "teaspoon", "item": "freshly ground black pepper"}, {"amount": "", "unit": "", "item": "Bowl of water, plus additional water for steamer"}, {"amount": "40", "unit": "", "item": "small wonton wrappers"}, {"amount": "", "unit": "", "item": "Non-stick vegetable spray, for the steamer"}, {"amount": "1 1/2", "unit": "tablespoon", "item": "soy sauce"}, {"amount": "1", "unit": "tablespoon", "item": "seasoned rice vinegar"}, {"amount": "1", "unit": "teaspoon", "item": "sesame oil"}, {"amount": "1/2", "unit": "teaspoon", "item": "sriracha"}], "steps": ["Preheat the oven to 200 degrees F.", "Cut the tofu in half horizontally and lay between layers of paper towels.", "Place on a plate, top with another plate, and place a weight on top (a 14-ounce can of vegetables works well).", "Let stand 20 minutes.", "After 20 minutes, cut the tofu into 1/4-inch cubes and place in a large mixing bowl.", "Add the carrots, cabbage, red pepper, scallions, ginger, cilantro, soy sauce, hoisin, sesame oil, egg, salt, and pepper.", "Lightly stir to combine.", "To form the dumplings, remove 1 wonton wrapper from the package, covering the others with a damp cloth. Brush the edges of the wrapper lightly with water. Place 1/2 rounded teaspoon of the tofu mixture in the center of the wrapper. Shape as desired. Set on a sheet pan and cover with a damp cloth. Repeat procedure until all of the filling is gone.", "Using a steaming apparatus of your choice, bring 1/4 to 1/2-inch of water to a simmer over medium heat.", "Spray the steamer's surface lightly with the non-stick vegetable spray to prevent sticking.", "Place as many dumplings as will fit into a steamer, without touching each other.", "Cover and steam for 10 to 12 minutes over medium heat.", "Remove the dumplings from the steamer to a heatproof platter and place in oven to keep warm.", "Repeat until all dumplings are cooked.", "To make dipping sauce, whisk together ingredients in a small bowl."]}, {"name": "Emeril's strawberry lemonade", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "cup", "item": "water"}, {"amount": "1", "unit": "cup", "item": "sugar"}, {"amount": "1", "unit": "cup", "item": "fresh lemon juice, (about 6 lemons=1 cup juice)"}, {"amount": "1", "unit": "", "item": "lemon, sliced for serving"}, {"amount": "1", "unit": "pound", "item": "strawberries, hulled and halved (about  cups)"}, {"amount": "16", "unit": "oz", "item": "seltzer, chilled"}, {"amount": "", "unit": "", "item": "mint, for serving"}], "steps": ["In a medium saucepan, bring water and sugar to a boil over medium-high. Reduce to a simmer and cook, stirring occasionally, until sugar dissolves, 2 minutes. Transfer to a pitcher and refrigerated until cool, about 45 minutes. Add lemon juice and stir to combine.", "In a blender, puree strawberries until smooth. Pour through a fine-mesh sieve into a pitcher with lemon syrup, pressing on solid. Stir well to combine.", "To serve, stir in seltzer and divide among ice-filled glasses. Trop with lemon slices and mint."], "timeMinutes": 12}, {"name": "Simple syrup", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "item": "sugar"}, {"amount": "1", "unit": "cup", "item": "water"}], "steps": ["Bring sugar and water to a boil in a small saucepan over high heat. Cook, stirring, until sugar dissolves, Let cool. Yields 1 cup.", "Storage: Can be refrigerated up to 1 month."], "timeMinutes": 30}, {"name": "Hot and nutty whiskey sours", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "3/4", "unit": "cup", "item": "Nocello, or other walnut-flavored liquer"}, {"amount": "1 1/2", "unit": "cup", "item": "whiskey or bourbon, such as Maker's Mark"}, {"amount": "3/4", "unit": "serving", "item": "simple syrup"}, {"amount": "1/4", "unit": "cup", "item": "fresh lemon juice, from 2 lemons"}, {"amount": "4", "unit": "", "item": "cinnamon sticks"}], "steps": ["Bring Nocello, whiskey, simple syrup, and lemon juice to a simmer in a medium saucepan. Divide among 4 mugs, and garnish each with a cinnamon stick."], "timeMinutes": 35}, {"name": "Blood orange cocktails", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "1 1/2", "unit": "cup", "item": "fresh blood orange juice, from 7-8 blood oranges, chilled"}, {"amount": "6", "unit": "tablespoon", "item": "Solerno or other blood orange liqueur"}], "steps": ["Combine blood orange juice and liqueur in a large pitcher. Refrigerate for at least 30 minutes. Pour into test tubes (indigo.com) or small glasses.", "Make ahead: Cocktails can be refrigerated in pitcher overnight. Stir before using."], "timeMinutes": 10}, {"name": "Red sangria", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "", "item": "bottle dry red wine, 750mL"}, {"amount": "1/4", "unit": "cup", "item": "brandy"}, {"amount": "1/4", "unit": "cup", "item": "orange liqueur"}, {"amount": "2", "unit": "tbsp", "item": "sugar"}, {"amount": "2", "unit": "", "item": "sliced oranges"}, {"amount": "1", "unit": "", "item": "sliced green apple"}, {"amount": "1 1/2", "unit": "cup", "item": "seltzer"}], "steps": ["Mix the wine, liqueur, and sugar in a pictcher, stirring to dissolve the sugar, then add the fruit.\n2. Refrigerate at least 1 hour and up to 1 day.\n3. Add the seltzer just before serving."], "timeMinutes": 5}, {"name": "White sangria", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "", "item": "bottle 750mL dry white wine"}, {"amount": "1/4", "unit": "cup", "item": "light rum"}, {"amount": "3", "unit": "tbsp", "item": "elderflower liqueur"}, {"amount": "2", "unit": "tbsp", "item": "sugar"}, {"amount": "2", "unit": "", "item": "nectarines, sliced"}, {"amount": "2", "unit": "", "item": "plums, sliced"}, {"amount": "1", "u

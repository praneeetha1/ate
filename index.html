<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeToCook</title>
  <link rel="manifest" href="/ate/manifest.json">
  <meta name="theme-color" content="#C2885A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ate.">
  <link rel="apple-touch-icon" href="/ate/icons/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:     #FDF6E3;
      --paper:     #FAF0D7;
      --card:      #FFFDF7;
      --warm-tan:  #E8D5B0;
      --border:    #D9C99A;
      --accent:    #C2885A;
      --accent-dk: #A0673B;
      --text:      #3D2B1F;
      --muted:     #7A6047;
      --heart:     #C0392B;
      --shadow:    rgba(100, 70, 30, 0.12);
      --nav-h:     62px;
    }

    body {
      background: var(--cream);
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180,150,90,0.06) 28px);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      padding-bottom: var(--nav-h);
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--paper);
      border-bottom: 2px solid var(--border);
      padding: 18px 20px 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent-dk);
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .logo span { font-style: italic; font-weight: 400; color: var(--accent); }
    .tagline {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--paper);
      border-top: 1.5px solid var(--border);
      display: flex;
      z-index: 300;
      box-shadow: 0 -2px 12px var(--shadow);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.18s;
      padding: 6px 0 8px;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 1.35rem; line-height: 1; }
    .nav-label {
      font-family: 'Lato', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Tab views ── */
    .tab-view { display: none; min-height: calc(100vh - 120px - var(--nav-h)); }
    .tab-view.active { display: block; }

    /* ── Section page header (Saved, etc.) ── */
    .section-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 12px;
    }
    .section-page-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text);
    }

    /* ── Category tag colors ── */
    .tag { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 10px; border-radius: 12px; }
    .tag-Breakfast        { background: #FDE9C5; color: #8B5C00; }
    .tag-Dessert          { background: #F9D8E0; color: #8B2040; }
    .tag-Main-Dish        { background: #D5EBD8; color: #2A6035; }
    .tag-Side-Dish        { background: #D8EDF5; color: #1A5470; }
    .tag-Soup--Stew       { background: #F5E2CB; color: #7A3D10; }
    .tag-Salad            { background: #DFF2DA; color: #2A5E30; }
    .tag-Quick-Meal       { background: #EDE2F5; color: #5A2A80; }
    .tag-Vegetarian       { background: #D8F0E5; color: #1A6040; }
    .tag-Snack--Appetizer { background: #FFF0C5; color: #7A5A00; }
    .tag-Drink            { background: #D8E8FF; color: #1A3A80; }

    /* ── Home: category sections ── */
    .cat-section { margin-bottom: 8px; }
    .cat-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 18px 20px 10px;
    }
    .cat-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }
    .cat-count {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .cat-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 0 20px 16px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .cat-row::-webkit-scrollbar { display: none; }
    .cat-row .card {
      flex: 0 0 240px;
      scroll-snap-align: start;
    }
    .cat-section-divider {
      height: 1px;
      background: var(--warm-tan);
      margin: 0 20px;
      opacity: 0.6;
    }

    /* ── Recipe card ── */
    .card {
      background: var(--card);
      border: 1.5px solid var(--warm-tan);
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.22s, border-color 0.22s, transform 0.18s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .card:hover {
      box-shadow: 0 8px 24px var(--shadow);
      border-color: var(--accent);
      transform: translateY(-3px);
    }
    .card-header {
      padding: 16px 16px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      user-select: none;
    }
    .card-header-text { flex: 1; min-width: 0; }
    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .card-time { font-size: 0.7rem; color: var(--muted); }
    .open-hint {
      font-size: 0.7rem;
      color: var(--muted);
      padding: 8px 16px 12px;
      border-top: 1px dashed var(--warm-tan);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .card:hover .open-hint { opacity: 1; }
    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--warm-tan);
      transition: color 0.2s, transform 0.15s;
      padding: 2px 3px;
      flex-shrink: 0;
    }
    .heart-btn:hover { transform: scale(1.2); color: #e8a0a0; }
    .heart-btn.loved { color: var(--heart); }

    /* ── Grid (search results, saved grid) ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 8px 20px 20px;
    }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--muted);
    }

    /* ── Saved: layout toggle ── */
    .layout-toggle { display: flex; gap: 4px; }
    .layout-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      width: 32px; height: 32px;
      font-size: 1.1rem;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .layout-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── List layout ── */
    .list-view { padding: 0 0 12px; }
    .list-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(200, 180, 130, 0.3);
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item:hover { background: var(--paper); }
    .list-item-text { flex: 1; min-width: 0; }
    .list-item-name {
      font-family: 'Playfair Display', serif;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-item-meta { display: flex; align-items: center; gap: 8px; }
    .list-item-time { font-size: 0.72rem; color: var(--muted); }
    .list-item-arrow { font-size: 1.4rem; color: var(--border); flex-shrink: 0; }
    .list-item-heart {
      background: none; border: none; font-size: 1.1rem;
      color: var(--warm-tan); cursor: pointer;
      transition: color 0.18s, transform 0.15s;
      flex-shrink: 0; padding: 2px 4px;
    }
    .list-item-heart:hover { transform: scale(1.2); color: #e8a0a0; }
    .list-item-heart.loved { color: var(--heart); }

    /* ── Search tab ── */
    .search-page-header {
      padding: 16px 20px 12px;
      background: var(--cream);
      position: sticky;
      top: 64px;
      z-index: 90;
      border-bottom: 1px solid var(--warm-tan);
    }
    .search-input-wrap { position: relative; margin-bottom: 12px; }
    .search-input {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 40px 11px 16px;
      font-family: 'Lato', sans-serif;
      font-size: 0.95rem;
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border-color 0.18s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .search-input-icon {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
      pointer-events: none;
    }
    .search-mode-pills {
      display: flex;
      gap: 8px;
    }
    .mode-pill {
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-family: 'Lato', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .mode-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Ingredient picker (in Search tab) ── */
    .ing-picker {
      padding: 14px 20px 12px;
      background: var(--paper);
      border-bottom: 1px solid var(--warm-tan);
    }
    .ing-input-row { display: flex; gap: 8px; position: relative; }
    .ing-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      font-family: 'Lato', sans-serif;
      font-size: 0.9rem;
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border-color 0.18s;
    }
    .ing-input:focus { border-color: var(--accent); }
    .ing-input::placeholder { color: var(--muted); }
    .ing-find-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-family: 'Lato', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s;
      white-space: nowrap;
    }
    .ing-find-btn:hover { background: var(--accent-dk); }
    .ing-find-btn:disabled { opacity: 0.4; cursor: default; }
    .ing-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px var(--shadow);
      max-height: 180px;
      overflow-y: auto;
      z-index: 200;
    }
    .ing-dropdown.open { display: block; }
    .ing-suggestion {
      padding: 9px 14px;
      font-size: 0.88rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(200,180,130,0.2);
      transition: background 0.12s;
    }
    .ing-suggestion:last-child { border-bottom: none; }
    .ing-suggestion:hover { background: var(--paper); }
    .ing-suggestion em { color: var(--accent-dk); font-style: normal; font-weight: 700; }
    .ing-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .ing-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--warm-tan);
      color: var(--accent-dk);
      border-radius: 20px;
      padding: 4px 10px 4px 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .ing-pill-remove {
      background: none; border: none; cursor: pointer;
      font-size: 0.85rem; color: var(--muted); padding: 0;
      transition: color 0.15s;
    }
    .ing-pill-remove:hover { color: var(--heart); }
    .match-badge {
      font-size: 0.72rem;
      color: var(--accent-dk);
      background: var(--paper);
      border-top: 1px dashed var(--border);
      padding: 6px 16px;
      font-weight: 700;
    }

    /* ── Modal overlay ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(60, 35, 15, 0.55);
      backdrop-filter: blur(3px);
      z-index: 500;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(60,35,15,0.35);
      width: 100%;
      max-width: 640px;
      margin: auto;
      animation: modalIn 0.25s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-top {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--warm-tan);
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .modal-title-block { flex: 1; }
    .modal-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: 10px;
    }
    .modal-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .modal-time { font-size: 0.78rem; color: var(--muted); }
    .modal-time::before { content: "\23F1  "; }
    .modal-actions { display: flex; align-items: center; gap: 6px; }
    .modal-heart {
      background: none; border: none;
      font-size: 1.5rem;
      color: var(--warm-tan);
      cursor: pointer;
      transition: color 0.2s, transform 0.15s;
      padding: 4px;
    }
    .modal-heart:hover { transform: scale(1.15); color: #e8a0a0; }
    .modal-heart.loved { color: var(--heart); }
    .modal-close {
      background: var(--paper);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 1rem;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .modal-close:hover { background: var(--warm-tan); color: var(--text); }
    .modal-body { padding: 20px 20px 24px; }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-dk);
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border);
    }
    .ingredients-list { list-style: none; margin-bottom: 20px; }
    .ingredient-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(200,180,130,0.25);
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .ingredient-item:last-child { border-bottom: none; }
    .ingredient-item.checked { opacity: 0.4; }
    .ingredient-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px; height: 15px;
      flex-shrink: 0; margin-top: 1px; cursor: pointer;
    }
    .ingredient-amount { color: var(--accent-dk); font-weight: 700; min-width: 60px; flex-shrink: 0; }
    .ingredient-item-name { color: var(--text); }
    .steps-list { list-style: none; }
    .step-item {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 0.88rem;
      line-height: 1.6;
    }
    .step-num {
      background: var(--accent);
      color: #fff;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700;
      flex-shrink: 0; margin-top: 1px;
    }

    /* ── Profile ── */
    .profile-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 12px;
    }
    .profile-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--warm-tan);
      font-size: 2.5rem;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--border);
    }
    .profile-username {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text);
    }
    .profile-sub { font-size: 0.82rem; color: var(--muted); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .logo { font-size: 1.7rem; }
      .grid { grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 12px 16px; }
      .cat-row .card { flex: 0 0 200px; }
    }
    @media (max-width: 400px) {
      .grid { grid-template-columns: 1fr; }
    }

  
    /* ── Home filter bar ── */
    .home-filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px 10px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--warm-tan);
      background: var(--cream);
      position: sticky;
      top: 64px;
      z-index: 80;
    }
    .home-filter-bar::-webkit-scrollbar { display: none; }
    .filter-pill {
      flex-shrink: 0;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-family: 'Lato', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 5px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .filter-pill:hover   { border-color: var(--accent); color: var(--accent-dk); }
    .filter-pill.active  { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-pill.veg     { border-color: #5a9e5a; color: #2a6035; }
    .filter-pill.veg.active { background: #4a8e4a; border-color: #4a8e4a; color: #fff; }
    .filter-pill-divider { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
    .surprise-btn {
      flex-shrink: 0;
      margin-left: auto;
      background: var(--paper);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-family: 'Lato', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-dk);
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .surprise-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .cat-empty-hidden { display: none; }

    </style>
</head>
<body>

<header>
  <div class="logo">ate<span>.</span></div>
  <div class="tagline">Your cozy recipe companion</div>
</header>

<!-- Home tab -->
<div class="tab-view active" id="tabHome" data-tab="home">
  <div class="home-filter-bar" id="homeFilterBar">
    <button class="filter-pill active" data-diet="">All</button>
    <button class="filter-pill veg"   data-diet="vegetarian">&#127807; Vegetarian</button>
    <div class="filter-pill-divider"></div>
    <button class="filter-pill" data-time="">Any time</button>
    <button class="filter-pill" data-time="30">&#9201; Under 30 min</button>
    <button class="filter-pill" data-time="60">&#9201; Under 1 hr</button>
    <button class="surprise-btn" id="surpriseBtn">&#127922; Surprise me</button>
  </div>
  <div id="homeContent"></div>
</div>

<!-- Search tab -->
<div class="tab-view" id="tabSearch" data-tab="search">
  <div class="search-page-header">
    <div class="search-input-wrap">

arm berries and maple syrup in a saucepan\n2. Pour over pancakes/dessert as desired"], "timeMinutes": 5}, {"name": "Schnitzel", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "2 5.5", "unit": "oz", "item": "pork escalopes"}, {"amount": "", "unit": "", "item": "Salt and pepper"}, {"amount": "", "unit": "", "item": "Flour"}, {"amount": "1", "unit": "", "item": "large egg, beaten"}, {"amount": "1 1/2", "unit": "cup", "item": "breadcrumbs"}, {"amount": "", "unit": "", "item": "olive oil"}, {"amount": "10", "unit": "", "item": "cornichons, optional for garnish, drained and cut in to matchsticks"}, {"amount": "1", "unit": "bunch", "item": "watercress, washed and dried"}, {"amount": "1", "unit": "", "item": "lemon, optional for serving"}], "steps": ["To prepare your meat, put the escalopes on to a chopping board, put a piece of wax paper on top and bat the meat with the bottom of a saucepan to flatten in a little - you want to get it to about 1/4 inch thick.", "To breadcrumb your meat, get yourself four large plates and lay them out in a line in the front of you.", "From left to right, you want to have your slat and pepper in one, flour in the second, beaten egg in the third and your fine breadcrumbs in the fourth.", "It's very simple...season the pieces of meat and dip them into the flour, shaking off any excess, then put them into the egg, dripping off any excess, and into the breadcrumbs, patting them over both sides and pressing down quite firmly.", "Gently shake off any excess and put the meat on a board or clean plate ready to be cooked.", "Heat a heavy frying pan, add a couple of good glugs of olive oil and, when it's good and hot, put both pieces of pork into the pan.", "Cook for 2 minutes or so, then carefully start to shake and agitate the pan to cover them in the hot oil.", "Turn the pork over and continue to cook for a couple of minutes until both sides are crisp and golden brown.", "Remove to a tray line with paper towels and season with salt and pepper.", "Put a schnitzel on to each of your serving plates.", "Put a little pile of cornichon matchsticks and some watercress leaves on top and serve with a big lob of apple sauce, a squeeze of lemon juice and a drizzle of extra virgin olive oil."], "timeMinutes": 25}, {"name": "Oregano Marinated Chicken", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "4", "unit": "", "item": "(6 to 7-ounce) boneless skinless chicken breasts"}, {"amount": "10", "unit": "", "item": "grinds black pepper"}, {"amount": "1/2", "unit": "tsp", "item": "salt"}, {"amount": "2", "unit": "tablespoon", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "teaspoon", "item": "dried oregano"}, {"amount": "1", "unit": "", "item": "lemon, juiced"}], "steps": ["To marinate the chicken: In a non-reactive dish, combine the lemon juice, olive oil, oregano, salt, and pepper and mix together. Add the chicken breasts to the dish and rub both sides in the mixture. Cover the dish with plastic wrap and let marinate in the refrigerator for at least 30 minutes and up to 4 hours.", "To cook the chicken: Heat a nonstick skillet or grill pan over high heat. Add the chicken breasts and cook, turning once, until well browned, about 4 to 5 minutes on each side or until cooked through. Let the chicken rest on a cutting board for a few minutes before slicing it into thin strips."], "timeMinutes": 45}, {"name": "Marinara Sauce", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "clove", "item": "garlic, minced"}, {"amount": "2", "unit": "tbsp", "item": "extra-virgin olive oil"}, {"amount": "2", "unit": "tsp", "item": "italian seasoning"}, {"amount": "1 15", "unit": "oz", "item": "can crushed Italian tomatoes"}, {"amount": "", "unit": "", "item": "Salt and freshly ground pepper"}], "steps": ["In a large frying pan over medium heat, saute the garlic in the olive oil until fragrant, about 1 minute. Stir in the red pepper flakes, basil, oregano, xture.", "Pulse until mixture holds together when pressed between 2 fingers (dough should not be wet or sticky).", "If dough is too dry, add more water, 1 tablespoon at a time, and pulse.", "Shape dough into 1 large disk or 2 small disks, and wrap in plastic wrap. Refrigerate until firm, at least 1 hour. Dough can be refrigerated overnight or frozen for up to 3 months.", "To make pastry leaves for garnishing: roll out dough to a 1/4-inch thickness on a lightly floured surface and cut out leaves using floured leaf-shaped cookie cutters. Bake on a parchment-lined baking sheet at 350F, rotating sheet halfway throuh, until pale gold, about 12 minutes."], "timeMinutes": 15}, {"name": "Homemade beef stock", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "8", "unit": "sprig", "item": "fresh flat-leaf parsley"}, {"amount": "6", "unit": "sprig", "item": "fresh thyme (or 3/4 tsp dried thyme)"}, {"amount": "4", "unit": "sprig", "item": "fresh rosemary (or 2 tsp dried rosemary)"}, {"amount": "2", "unit": "", "item": "dried bay leaves"}, {"amount": "1", "unit": "tablespoon", "item": "whole black peppercorns"}, {"amount": "1", "unit": "pound", "item": "beef-stew meat, cubed"}, {"amount": "5", "unit": "pound", "item": "veal bones, sawed into smaller pieces"}, {"amount": "1", "unit": "", "item": "large onion, peel on, quartered"}, {"amount": "2", "unit": "", "item": "large carrots, cut into thirds"}, {"amount": "2", "unit": "stalk", "item": "celery, cut into thirds"}, {"amount": "2", "unit": "cup", "item": "dry red wine"}], "steps": ["Heat the oven to 450 degrees.", "Make a bouquet garni by wrapping parsley, thyme, rosemary, bay leaves, and peppercorns in a piece of cheesecloth.", "Tie with kitchen twine, and set aside.", "Arrange meat, veal bones, onion, carrots, and celery in an even layer in a heavy roasting pan.", "Roast, turning every 20 minutes, until the vegetables and the bones are deep brown, about 1 1/2 hours.", "Transfer the meat, bones, and vegetables to a large stockpot, and set aside.", "Pour off the fat from the roasting pan, and discard.", "Place the pan over high heat on the stove.", "Add wine, and use a wooden spoon to scrape up the brown bits; boil until the wine has reduced by half, about 5 minutes.", "Pour all of the liquid into the stockpot.", "Add 6 quarts of cold water to the stockpot, or more if needed to cover bones.", "Do not add less water.", "Bring to a boil, then reduce to a very gentle simmer.", "Add the reserved bouquet garni.", "Liquid should just bubble up to surface.", "Skim the foam from the surface, and discard.", "Simmer over the lowest possible heat for 3 hours; a skin will form on the surface of the liquid; skim off with a slotted spoon, and discard.", "Repeat as needed.", "Add water if at any time the level drops below the bones.", "Strain the stock through a fine sieve into a large bowl.", "Discard the solids.", "Transfer the bowl to an ice bath, and let cool to room temperature.", "Transfer to airtight containers.", "Refrigerate for at least 8 hours, or overnight.", "Stock may be refrigerated for 3 days or frozen for 4 months.", "If storing, leave fat layer intact to seal the stock.", "Before using, remove the fat that has collected on the surface."]}, {"name": "Chervil cream", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "", "unit": "", "item": "Coarse salt"}, {"amount": "4", "unit": "cup", "item": "loosely packed fresh chervil, with stems (about 4 bunches)"}, {"amount": "1/3", "unit": "cup", "item": "cold heavy cream"}], "steps": ["Prepare an ice-water bath; set aside. Bring a medium pot of water to a boil; stir in 1 tablespoon salt. Add chervil. Return to a boil; cook until bright green, about 30 seconds. Using a slotted spoon, immediately transfer to ice-water bath. Drain, and chop coarsely.", "Process chervil with 1/4 cup cold water in a food processor until very finely chopped. Pour through a fine-mesh sieve; discard liquid. Whip cream in a ace strawberries into glasses and spoon over the sauce."]}, {"name": "John Thorne's Pecan Pie", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "3", "unit": "", "item": "eggs"}, {"amount": "4", "unit": "tbsp", "item": "butter"}, {"amount": "2", "unit": "tbsp", "item": "dark rum"}, {"amount": "2/3", "unit": "cup", "item": "golden syrup"}, {"amount": "1", "unit": "cup", "item": "dark brown sugar, well-packed"}, {"amount": "2", "unit": "cup", "item": "pecans, chopped"}, {"amount": "9", "unit": "", "item": "-inch unbaked pie shell"}], "steps": ["Preheat oven to 350F. In a large saucepan, heat the brown sugar, golden syrup and butter to the boiling point. Stirring constantly and scraping back any foam that clings to the side of the pan, let this mixture boil for about 1 minute. Remove from the heat and let cool while, in a separate bowl, you beat the eggs until creamy.", "When the boiled syrup has cooled, beat in the eggs, salt and pecans. Pour into the unbaked pie shell and bake for about 50 minutes.", "Notes:", "* A little cream (about 1/4 to 1/2 cup) mixed into a pecan pie filling before baking gives it a richer, lighter texture.", "* For a sweeter, lighter pie: add more sugar and use fewer pecans; for a denser, less sweet pie: add more pecans and use less sugar.", "* The buttery flavour and the lard-induced flakiness of a butter and lard crust make it the perfect one for a perfect pecan pie. And a Southern pecan pie authority I know suggests that you roll out the dough a little thicker than usual; a thick, richly shortened crust provides an appetizing balance to the sweetness of the filling."]}, {"name": "Godiva Angel Pie", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "", "item": "(1 oz.) squares Godiva cooking chocolate or 4 oz. Baker's German sweet chocolate"}, {"amount": "1/2", "unit": "tsp", "item": "vanilla"}, {"amount": "1", "unit": "cup", ions"}], "steps": ["Preheat the oven to 400 degrees halfway through onion cooking.", "Slice the onions and saute in 4 tablespoons butter over medium-low heat; the longer you cook them - as long as 35 minutes - the sweeter they will be.  Sprinkle in crushed red pepper.", "Melt the remaining 4 tablespoons butter.  Mix with the crushed crackers, then press the mixture into the bottom and sides of a glass pie plate to form a crust.  Prebake crust for 10 minutes.", "Lightly beat the eggs and milk together in a small bowl.", "Spoon the onions into the crust, then pour the egg mixture over them.  Sprinkle with Parmesan.", "Bake for 30-40 minutes until set and golden."]}, {"name": "Godiva Dark Chocolate Cheesecake", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "2 1/2", "unit": "cup", "item": "cream cheese, room temperature"}, {"amount": "1/2", "unit": "cup", "item": "sugar"}, {"amount": "1 3/4", "unit": "tablespoon", "item": "cocoa powder"}, {"amount": "5", "unit": "tablespoon", "item": "Godiva 85% Dark Chocolate Callets"}, {"amount": "2", "unit": "", "item": "eggs"}, {"amount": "2", "unit": "", "item": "egg yolks"}, {"amount": "1 3/4", "unit": "tablespoon", "item": "cr\u00e8me faiche"}], "steps": ["In a food processor with a blade attachment, cream the cheese until smooth and then add in sugar.", "Pulse a couple times to incorporate sugar and cocoa powder.", "Add in eggs and yolks pulsing a couple times again and scrape down to ensure all is smooth and uniform.", "With machine running, pour in melted Godiva Chocolate in a steady stream until all in, and finish by pulsing in the cr\u00e8me fraiche.", "Pour batter into a 10\" x 10\" baking pan and bake at 325 for 30, minutes or until custard is set and a toothpick inserted in center can be removed cleanly.", "The top may caramelize or brown slightly, which is not an issue.", "Once set, remove from oven and allow cheesecake to cool completely.", "Wrap the pan with plastic and reserve in cooler to set and chill completely.", "Once the cheesecake is cold and firm, remove it from the pan and place in a mixer bowl with a paddle attachment.", "Beat the cake for a few moments to soften and smooth out the custard.", "Place smoothed custard into a piping bag with a plain tip and pipe into the bottom of a plastic lined half cylinder mold.", "Tap the mold to ensure the custard is solid and then flatten out to top.", "Freeze the mold to harden the custard for unmolding.", "Once the cake can be unmolded, remove from the pan and cut into 1\u00bd\" sections.", "Brush some tempered Godiva Dark Chocolate onto a strip of acetate and, while it is still fluid, smooth over the top of the molded cheesecake.", "Once the chocolate has cooled and completely crystallized, remove the acetate, revealing a shiny and textured chocolate finish."]}, {"name": "Hot Cocoa", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "3/4", "unit": "cup", "item": "sugar"}, {"amount": "1/2", "unit": "cup", "item": "unsweetened cocoa powder"}, {"amount": "1", "unit": "tsp", "item": "vanilla extract"}, {"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "4", "unit": "cup", "item": "milk"}, {"amount": "4", "unit": "oz", "item": "chocolate, chopped fine"}], "steps": ["Prepare mix ahead of time. One serving is 1/4 cup mix per cup of milk.", "Bring milk to a simmer in a saucepan over medium heat. Whisk cocoa/sugar mix into the milk. Add the chopped chocolate and reduce heat to low and simmer, stirring, until the chocolate melts and the cocoa is thick, about 2 minutes. Divide among mugs and garnish each with homemade marshmallows or whipped cream."], "timeMinutes": 5}, {"name": "Greek yogurt with homemade honeycomb", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "600", "unit": "ml", "item": "Greek yogurt"}, {"amount": "100", "unit": "g", "item": "blueberries"}, {"amount": "100", "unit": "g", "item": "raspberries"}, {"amount": "2", "unit": "tsp", "item": "caster sugar"}, {"amount": "", "unit": "", "item": "Lavender essence, suitable for culinary use"}, {"amount": "", "unit": "", "item": "Dried lavender flowers, suitable for culinary use"}, {"amount": "75", "unit": "g", "item": "clear honey"}, {"amount": "140", "unit": "g", "item": "liquid glucose"}, {"amount": "400", "unit": "g", "item": "sugar"}, {"amount": "5", "unit": "tbsp", "item": "water"}, {"amount": "2", "unit": "tbsp", "item": "baking powder"}], "steps": ["For the honeycomb: Line a shallow baking tray with parchment paper.", "Place the honey, liquid glucose, water and sugar in a large heavy-based saucepan and heat gently, stirring occasionally until the sugar dissolves.", "Increase the heat and cook until the mixture starts to turn a light golden colour.", "Mix in the baking soda.", "The mixture will erupt into a foaming mass.", "Pour immediately into the prepared baking tray.", "Leave to cool, then place in the fridge to set. This takes approx 6-10 mins. Break up with the end of a rolling pin and store in an airtight jar if not using immediately.", "Using a blender, blitz the raspberries and blueberries together with little caster sugar until smooth. Add a drop of lavender essence. Strain the mixture through a sieve to create a fresh coulis. Taste to check consistency and flavour, add a spoonful of water or sugar as necessary.", "Lightly mix almost all of the honeycomb through the yoghurt. Spoon into individual serving glasses and pour the coulis on top. Garnish with lavender flowers and a sprinkling of the remaining honeycomb. Serve immediately."]}, {"name": "Cherry-lime cups", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "7", "unit": "tbsp", "item": "unsalted butter, cold and cut into pieces, plus more for pan"}, {"amount": "1 1/3", "unit": "cup", "item": "all-purpose flour, spooned and leveled"}, {"amount": "1/4", "unit": "cup", "item": "sugar"}, {"amount": "1/2", "unit": "tsp", "item": "coarse salt"}, {"amount": "2", "unit": "", "item": "egg yolks"}, {"amount": "1/2", "unit": "tsp", "item": "vanilla extract"}, {"amount": "2", "unit": "", "item": "eggs, lightly beaten"}, {"amount": "3", "unit": "tbsp", "item": "all-purpose flour"}, {"amount": "2/3", "unit": "cup", "item": "sugar"}, {"amount": "5", "unit": "tbsp", "item": "fresh lime juice"}, {"amount": "1/4", "unit": "tsp", "item": "coarse salt"}, {"amount": "9", "unit": "", "item": "cherries, halved and pitted"}], "steps": ["Make crust: preheat oven to 350. Lightly butter six standard muffin cups. In a food processor, process butter, flour, sugar, and salt until mixture resembles coarse meal. Add yolks and vanilla and process until dough comes together when pressed (dough will be crumbly).", "Divide dough into 6 pieces.", "Roll each into a ball and place in a muffin cup, pressing evenly into bottom and up sides.", "Place a paper cupcake liner into each muffin cup over dough and fill with pie weights or dried beans.", "Bake until edges are dry, 15 minutes.", "Carefully remove liners and weights; bake until crusts are dry and barely golden, 5 to 7 minutes.", "Meanwhile, make filling: in a medium bowl, whisk together eggs, flour, sugar, lime juice, and salt. Place 3 cherry halves into each crust and divide filling among each. Bake until filling is set, about 25 minutes. With the tip of a knife or small offset spatula, remove cups from pan. Let cool completely on a wire rack.", "To store, refrigerate in an airtight container, up to 1 day."]}, {"name": "Strawberries and cream bars", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "lb", "item": "strawberries, hulled, halved if large (6 cups)"}, {"amount": "1 1/2", "unit": "cup", "item": "sugar"}, {"amount": "", "unit": "", "item": "coarse salt"}, {"amount": "7", "unit": "", "item": "egg whites"}, {"amount": "2/3", "unit": "cup", "item": "cold heavy cream"}, {"amount": "1", "unit": "tsp", "item": "vanilla extract"}], "steps": ["In a blender, combine strawberries, 3/4 cup sugar, and a pinch of salt and puree until smooth. Pour into a 9x13 baking dish. Transfer to freezer and scrape with a fork every 30 minutes until mixture is thick and slushy, 2 hours. Smooth top with rubber spatula.", "In a large bowl, using and electric mixer, beat egg whites on high until foamy.", "With mixer on medium, gradually add 3/4 cup sugar.", "Increase speed to high and beat until stiff, glossy peaks form, 3 minutes.", "In another medium bowl, beat cream and vanilla on high until stiff peaks form, 1 to 2 minutes.", "With rubber spatula, gently fold whipped cream into egg white mixture.", "Pour over strawberry mixture and smooth top with rubber spatula.", "Freeze until firm, about 4 hours (or, covered, up to 3 days), before cutting into 12 squares."], "timeMinutes": 25}, {"name": "Frozen chocolate mousse trifles", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "cup", "item": "chocolate angel food cake, crumbled (5 oz)"}, {"amount": "1", "unit": "tbsp", "item": "brandy (optional)"}, {"amount": "4", "unit": "", "item": "egg whites"}, {"amount": "1/2", "unit": "cup", "item": "sugar"}, {"amount": "1/3", "unit": "cup", "item": "unsweetened cocoa powder, sifted"}, {"amount": "1/2", "unit": "cup", "item": "heavy cream, cold"}, {"amount": "1/2", "unit": "oz", "item": "bittersweet chocolate"}], "steps": ["In a medium bowl, toss together cake and brandy, if desired. In another medium bowl, using and electric mixer, beat egg whites on high until foamy. With mixer on medium, gradually add sugar. Increase speed to high and beat until stiff, glossy peaks form, 2 minutes. With a rubber spatula, gently fold cocoa powder into egg white mixture.", "In another medium bowl, beat cream on high until stiff peaks form, 3 minutes. Gently fold whipped cream into egg white mixture.", "Fill each of four small glasses with 1/4 cup cake and top with heaping 1/4 cup mousse. Repeat to make a second layer with remaining cake and mousse. Freeze until firm, 3 hours (or up to overnight). Let sit 10 minutes at room temperature, then finely grate chocolate over tops to serve."], "timeMinutes": 25}, {"name": "Frozen lemon souffle", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "item": "granulated sugar"}, {"amount": "1", "unit": "tbsp", "item": "lemon zest, grated"}, {"amount": "3/4", "unit": "cup", "item": "lemon juice"}, {"amount": "8", "unit": "", "item": "large eggs, whites and yolks separated"}, {"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "2/3", "unit": "cup", "item": "heavy cream, cold"}, {"amount": "1 1/2", "unit": "cup", "item": "raspberries, about 6 oz"}, {"amount": "", "unit": "", "item": "confectioners' sugar, for dusting"}], "steps": ["Wrap outside of a 3.5-cup souffle mold or four 6-ounce ramekins with parchment, extending 2 to 3 inches above rim (it should fit snugly). Secure with tape, set aside.", "In a medium saucepan, whisk together granulated sugar, lemon zest and juice, egg yolks, and salt over medium-high.", "Cook, whisking constantly, until mixture is thick enough to coat the back of a spoon and small bubbles form around edge of pan, about 5 minutes (do not boil).", "Immediately remove from heat while continuing to whisk.", "Pour through a fine-mesh sieve into a heatproof bowl, pressing on lemon curd with a rubber spatula.", "Place plastic wrap directly against surface of curd and refrigerate until cool, about 30 minutes (or up to overnight).", "In a large bowl, using an electric mixer, beat egg whites on high until stiff peaks form, 2 minutes.", "Gently fold egg whites into cooled lemon curd.", "In the same large bowl, beat cream on high until stiff peaks form, 1 to 2 minutes.", "Gently fold whipped cream into lemon curd mixture.", "Pour into mold and freeze until firm, 6 hours (or up to overnight).", "To serve, remove parchment, top with raspberries and dust with confectioners' sugar."], "timeMinutes": 25}, {"name": "Coconut lime semifreddo", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "1 13.5", "unit": "oz", "item": "can unsweetened coconut milk"}, {"amount": "1 14", "unit": "oz", "item": "can sweetened condensed milk"}, {"amount": "1", "unit": "tbsp", "item": "lime zest, grated"}, {"amount": "1/4", "unit": "tsp", "item": "coarse salt"}, {"amount": "1 1/2", "unit": "cup", "item": "heavy cream, cold"}, {"amount": "1/2", "unit": "cup", "item": "sweetened shredded coconut, toasted"}, {"amount": "1/2", "unit": "", "item": "ripe mango, thinly sliced"}], "steps": ["Line a 4.5x8.5-inch loaf pan with parchment, leaving a 4-inch overhang on all sides.", "Prepare a large bowl of ice water.", "In a medium saucepan, combine coconut milk and condensed milk and bring to a boil over  high.", "Reduce heat and cook at a rapid simmer, stirring frequently until thickened, 10 minutes.", "Remove from heat and stir in lime zest and salt.", "Place saucepan in bowl of ice water and stir until mixture is cool, 4 minutes.", "In a large bowl, using an electric mixer, beat cream on high until stiff peaks from, 2 minutes.", "Gently fold whipped cream into coconut milk mixture.", "Pour into loaf pan; evenly sprinkle coconut over top.", "Freeze until firm, 6 hours (or covered, up to 3 days).", "Let sit 20 minutes at room temperature.", "Invert onto a serving platter; peel away parchment.", "Layer mango on top and serve."], "timeMinutes": 30}, {"name": "Sweet cherry granita", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "lb", "item": "cherries, stemmed and pitted, or 3 bags (12 oz each) frozen cherries, thawed"}, {"amount": "1/2", "unit": "cup", "item": "sugar"}, {"amount": "1", "unit": "tbsp", "item": "lemon juice"}, {"amount": "3/4", "unit": "cup", "item": "almond-flavored liqueur, such as Disaronno (optional)"}, {"amount": "", "unit": "", "item": "whipped cream or mascarpone cheese (optional), for serving"}], "steps": ["In a blender, puree cherries, sugar, and lemon juice until sugar is dissolved and mixture is smooth. Pour into an 8-inch square baking dish. Freeze 6 hours, scraping with fork every hour (mixture should be icy and fluffy).", "To serve, pour 1 tablespoon liqueur into each of 12 small bowls or glasses. Top with 1/2 cup granita and a small dollop of whipped cream, if desired. Serve immediately."], "timeMinutes": 10}, {"name": "Raspberry-lemon thumbprint cookies", "category": "Dessert", "dietary": [], "ingredients": [{"amount": "1/2", "unit": "cup", "item": "raspberry jam or jelly"}, {"amount": "1", "unit": "tablespoon", "item": "Chambord or kirsch"}, {"amount": "2 1/4", "unit": "cup", "item": "all-purpose flour"}, {"amount": "1", "unit": "teaspoon", "item": "baking powder"}, {"amount": "1/4", "unit": "teaspoon", "item": "salt"}, {"amount": "1", "unit": "cup", "item": "butter, at room temperature"}, {"amount": "2/3", "unit": "cup", "item": "sugar"}, {"amount": "2", "unit": "", "item": "egg yolks"}, {"amount": "1", "unit": "tablespoon", "item": "lemon zest"}, {"amount": "1", "unit": "tablespoon", "item": "lemon juice"}, {"amount": "1", "unit": "teaspoon", "item": "pure vanilla extract"}], "steps": ["Preheat the oven to 350 degrees F. Lightly butter 2 large baking sheets.", "In a small bowl, combine the jam and Chambord. Stir to combine.", "In a medium bowl, combine the flour, baking powder, and salt and whisk to blend.", "In a large bowl using an electric mixer, beat the butter and sugar until light and creamy. Beat in the egg yolks, lemon zest, lemon juice and vanilla. Add the flour mixture in 2 additions and beat just until moist clumps form. Gather the dough together into a ball.", "Pinch off the dough to form 1-inch balls. Place on the prepared baking sheets, spacing 1-inch apart. Use your floured index finger or 1/2 teaspoon measuring spoon to create depressions in the center of each ball. Fill each indentation with nearly 1/2 teaspoon of the jam mixture. Bake until golden brown, about 20 minutes.", "Transfer the cookies to wire racks to cool completely.", "Yield: 2 dozen"]}, {"name": "Pumpkin mousse", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "", "item": "envelope unflavored powdered gelatin"}, {"amount": "1/4", "unit": "cup", "item": "cold water"}, {"amount": "5/8", "unit": "cup", "item": "canned unsweetened pumpkin puree, 1/2 cup plus 2 tbsp"}, {"amount": "4", "unit": "", "item": "large eggs, separated"}, {"amount": "3/8", "unit": "cup", "item": "maple syrup, 1/4 cup plus 2 tbsp"}, {"amount": "1/2", "unit": "tsp", "item": "pure vanilla extract"}, {"amount": "1/2", "unit": "tsp", "item": "ground ginger"}, {"amount": "1/2", "unit": "tsp", "item": "ground allspice"}, {"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "", "unit": "", "item": "Pinch of freshly ground white pepper"}, {"amount": "2", "unit": "tbsp", "item": "dark rum"}, {"amount": "1/4", "unit": "cup", "item": "sugar"}, {"amount": "1", "unit": "cup", "item": "heavy cream"}, {"amount": "", "unit": "", "item": "Sweetened whipped cream, for serving (optional)"}, {"amount": "", "unit": "", "item": "Pastry leaves for garnish (optional; see Pate Brisee recipe)"}], "steps": ["In a small saucepan, sprinkle gelatin over the cold water, and let soften 5 minutes. Cook softened gelatin over medium heat, swirling pan, just until gelatin is dissolved; do not let boil. Let cool completely.", "Place pumpkin puree in a large bowl. Stir in softened gelatin, then add egg yolks, maple syrup, nutmeg, vanilla, ginger, allspice, salt, white pepper, and rum. Whisk until fully blended.", "With an electric mixer on medium speed, whisk egg whites and the sugar to soft peaks. Gently fold egg-white mixture into pumpkin mixture to combine. Whip heavy cream on medium high to stiff peaks, then gently but thoroughly fold into pumpkin mixture.", "Divide mousse among 8 to 10 glasses; refrigerate until set, at least 2 hours, or up to 1 day, covered with plastic wrap. If desired, top each with a dollop of sweetened whipped cream and a pastry leaf before serving.", "Food safety note: the eggs in this recipe are not cooked"]}, {"name": "Salted caramel six layer chocolate cake", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "", "unit": "", "item": "Unsalted butter, room temperature, for pans"}, {"amount": "3", "unit": "cup", "item": "all-purpose flour, plus more for pans"}, {"amount": "3", "unit": "cup", "item": "granulated sugar"}, {"amount": "1 1/2", "unit": "cup", "item": "unsweetened Dutch-process cocoa powder"}, {"amount": "1", "unit": "tbsp", "item": "baking soda"}, {"amount": "1 1/2", "unit": "tsp", "item": "baking powder"}, {"amount": "", "unit": "", "item": "Salt"}, {"amount": "4", "unit": "", "item": "large eggs 1 1/2 cups buttermilk"}, {"amount": "1 1/2", "unit": "cup", "item": "warm water"}, {"amount": "5/8", "unit": "cup", "item": "safflower oil, 1/2 cup plus 2 tbsp"}, {"amount": "2", "unit": "tsp", "item": "pure vanilla extract"}, {"amount": "4", "unit": "cup", "item": "granulated sugar"}, {"amount": "1/4", "unit": "cup", "item": "light corn syrup"}, {"amount": "1/4", "unit": "cup", "item": "water"}, {"amount": "2", "unit": "cup", "item": "heavy cream"}, {"amount": "", "unit": "", "item": "Salt"}, {"amount": "2", "unit": "stick", "item": "unsalted butter, cold, cut into tablespoons"}, {"amount": "3/8", "unit": "cup", "item": "Dutch-process cocoa powder, 1/4 cup plus 2 tbsp"}, {"amount": "3/8", "unit": "cup", "item": "warm water"}, {"amount": "2", "unit": "stick", "item": "unsalted butter, room temperature"}, {"amount": "1/2", "unit": "cup", "item": "confectioners' sugar"}, {"amount": "", "unit": "", "item": "Salt"}, {"amount": "1", "unit": "lb", "item": "semisweet chocolate, chopped, melted, and cooled"}, {"amount": "", "unit": "", "item": "Flaked sea salt, such as Maldon, for garnish"}], "steps": ["Preheat oven to 350F.", "Make the cake: butter three 9-inch round cake pans, and dust with flour, tapping out excess.", "Sift flour, granulated sugar, cocoa, baking soda, baking powder, and 1 1/2 teaspoons salt into the bowl of a mixer.", "Beat on low speed until just combined.", "Raise speed to medium and add eggs, buttermilk, warm water, oil, and vanilla.", "Beat until smooth, about 3 minutes.", "Divide batter among pans. Bake until cakes are set and a toothpick inserted into the center of each comes out clean, about 35 minutes. Let cool in pans set on a wire rack for 15 minutes. Turn out cakes onto racks and let cool completely.", "Make the caramel: Combine granulated sugar, corn syrup, and water in a medium saucepan over high heat.", "Cook, without stirring, until mixture is dark amber, about 14 minutes.", "Remove from heat, and carefully pour in cream (mixture will bubble violently); stir until smooth.", "Return to heat, and cook until a candy thermometer reaches 238F, about 2 minutes.", "Pour caramel into a medium bowl, stir in 1 teaspoon coarse salt, and let cool slightly, about 15 minutes.", "Stir in butter, 1 tablespoon at a time.", "Let cool completely.", "Meanwhile, make the frosting: whisk together cocoa and warm water in a bowl until cocoa dissolves.", "Beat butter, confections' sugar, and a generous pinch of coarse salt in a clean bowl with a mixer on medium speed until pale and fluffy.", "Gradually beat in melted chocolate and then cocoa mixture until combined.", "Let stand for 30 minutes before using.", "Trim tops of cakes using a serrated knife to creat a level surface. Cut each in half horizontally to form 2 layers. Transfer 1 layer to a serving platter and spread 3/4 cup caramel over top. Top with another cake layer, and repeat with remaining caramel and cake layers, leaving top uncovered. Refrigerate until set, about 1 hour.", "Frost top and sides of cake in a swirling motion. Sprinkle with sea salt.", "Make ahead: Caramel can be refrigerated for up to 3 days. Bring to room temperature before using. Cake layers can be refrigerated for up to 3 days (they actually taste better when refrigerated and have a better texture for stacking).", "Storage: Frosted cake can be refrigerated for up to 3 days."], "timeMinutes": 80}, {"name": "Hazelnut pastry dough", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "1 3/4", "unit": "cup", "item": "all-purpose flour"}, {"amount": "1/2", "unit": "cup", "item": "toasted skinned hazelnuts, ground"}, {"amount": "", "unit": "", "item": "Salt"}, {"amount": "2", "unit": "stick", "item": "unsalted butter, cut into pieces"}, {"amount": "1/4", "unit": "cup", "item": "ice water"}], "steps": ["Pulse flour, hazelnuts, and 1/4 teaspoon salt in a food processor until combined.", "Add butter, and pulse until mixture resembles coarse meal, about 10 seconds.", "Drizzle 1/4 cup ice water evenly over mixture and pulse until it just begins to hold together (dough should not be wet or sticky).", "If dough is too dry, add more water, 1 tablespoon at a time, and pulse.", "Divide dough in half, and shape each half into a rectangle. Wrap in plastic wrap. Refrigerate until firm, about 1 hour. Let stand for 10 minutes before rolling.", "Make ahead: Dough can be refrigerated overnight or frozen for up to 3 months. Let chilled dough stand at room temperature for 10 minutes and fozen dough thaw before using."], "timeMinutes": 20}, {"name": "Cherry couscous pudding", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "item": "skim milk"}, {"amount": "1", "unit": "cup", "item": "almond milk"}, {"amount": "1/4", "unit": "cup", "item": "sugar"}, {"amount": "1/4", "unit": "tsp", "item": "almond extract"}, {"amount": "", "unit": "", "item": "salt"}, {"amount": "3/4", "unit": "cup", "item": "whole-wheat couscous"}, {"amount": "1/2", "unit": "cup", "item": "dried cherries"}, {"amount": "1", "unit": "stick", "item": "cinnamon"}, {"amount": "1/4", "unit": "cup", "item": "sliced almonds, toasted"}, {"amount": "", "unit": "", "item": "honey"}], "steps": ["Bring milks, sugar, almond extract, and a pinch of salt to a boil in a saucepan over medium heat. Add couscous, dried cherries and cinnamon stick; cover and cook 2 minutes. Remove from the heat and let sit, covered, 8 minutes. Fluff with a fork, remove the cinnamon stick and divide among bowls. Top with toasted almond slices and honey, if desired."], "timeMinutes": 7}, {"name": "Chocolate chestnut mousse", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "8", "unit": "oz", "item": "semisweet chocolate, chopped"}, {"amount": "3/4", "unit": "cup", "item": "chestnut puree, found in the baking aisle"}, {"amount": "1/4", "unit": "tsp", "item": "almond extract"}, {"amount": "", "unit": "", "item": "Pinch of salt"}, {"amount": "1 1/8", "unit": "cup", "item": "confectioners' sugar"}, {"amount": "2", "unit": "cup", "item": "heavy cream"}], "steps": ["Put the chocolate in a microwave-safe bowl; microwave in 30-second intervals, stirring, until melted, about 2 minutes. Blend the chestnut puree, almond extract, salt and 1 cup confectioners' sugar in a food processor until smooth. Transfer to a bowl and fold in half of the melted chocolate.", "Beat the cream and the remaining 2 tablespoons confectioners' sugar with a mixer until soft peaks form. Reserve 1/2 cup for topping. Fold one-quarter of the remaining whipped cream into the chestnut mixture, then fold in the rest. Chill up to 8 hours.", "Divide the mousse among dessert glasses. Top with the reserved whipped cream. Remelt the remaining chocolate in the microwave, if necessary, then drizzle on top."], "timeMinutes": 25}, {"name": "Melomakarona - Honey Cookies with Walnuts", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "item": "olive oil"}, {"amount": "1", "unit": "cup", "item": "vegetable oil"}, {"amount": "3/4", "unit": "cup", "item": "sugar"}, {"amount": "1", "unit": "", "item": "orange, zested"}, {"amount": "3/4", "unit": "cup", "item": "orange juice"}, {"amount": "1/4", "unit": "cup", "item": "brandy"}, {"amount": "2", "unit": "tsp", "item": "baking powder"}, {"amount": "1", "unit": "tsp", "item": "baking soda"}, {"amount": "", "unit": "", "item": "Pinch of salt"}, {"amount": "7 1/2", "unit": "cup", "item": "all-purpose flour"}, {"amount": "3/4", "unit": "cup", "item": "walnuts, ground coarsely"}, {"amount": "", "unit": "", "item": "Ground cinnamon for sprinkling"}, {"amount": "1", "unit": "cup", "item": "honey"}, {"amount": "1", "unit": "cup", "item": "sugar"}, {"amount": "1 1/2", "unit": "cup", "item": "water"}, {"amount": "1", "unit": "", "item": "cinnamon stick"}, {"amount": "4", "unit": "", "item": "whole cloves"}, {"amount": "1", "unit": "piece", "item": "lemon rind, 2-inch"}, {"amount": "1", "unit": "tsp", "item": "lemon juice"}], "steps": ["Preheat the oven to 350 degrees.", "In a small bowl, using your fingers, combine the orange zest with the sugar \u2013 rubbing the grains as if you were playing with sand to release the orange oils into the sugar.\nUsing an electric mixer, beat the oil with the orange sugar until well mixed. In a separate bowl, sift the flour with the baking powder, baking soda and salt.", "Add the orange juice and brandy to mixer and mix well.", "Slowly incorporate the flour cup by cup until the mixture forms a dough that is not too loose but not quite firm either. It will be dense and wet but not sticky. Once the flour is incorporated fully stop mixing.", "To roll cookies, pinch a portion of dough off about the size of a walnut. Shape in your palms into a smooth oblong shape, almost like a small egg. Place on an ungreased cookie sheet. Shape and roll cookies until the sheet is filled.", "Press the tines of a large fork in a crosshatch pattern in the center of each cookie. This will flatten them slightly in the center. The cookies should resemble lightly flattened ovals when they go in the oven.", "Bake in a preheated 350-degree oven for 25 \u2013 30 minutes until lightly browned. (The cookies will darken when submerged in syrup.)", "While the cookies are baking, prepare the syrup.", "In a saucepan, combine the honey, sugar, water, cinnamon, cloves, and lemon rind. Bring the mixture to a boil then lower the heat and simmer uncovered for about 10 to 15 minutes. Remove the cinnamon, cloves, and lemon rind and stir in lemon juice.", "Place the ground walnuts in a shallow plate or bowl next to the stove top. When the cookies come out of the oven and while they are still very warm, carefully float the cookies in the syrup and allow the cookies to absorb syrup on both sides.", "Using a fork or small spatula, remove the cookie from the syrup and place on a platter or plate. Press ground walnuts lightly into the tops of the cookies (syrup will help it adhere) and sprinkle lightly with ground cinnamon.", "Do not refrigerate Melomakarona as they will harden. Store in an airtight container at room temperature."]}, {"name": "Gluten-free chocolate chips cookies", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "item": "butter"}, {"amount": "1", "unit": "cup", "item": "brown sugar, firmly packed"}, {"amount": "1/2", "unit": "cup", "item": "granulated sugar"}, {"amount": "2", "unit": "teaspoon", "item": "gluten-free vanilla extract"}, {"amount": "1", "unit": "teaspoon", "item": "salt"}, {"amount": "2", "unit": "", "item": "large eggs"}, {"amount": "2 1/3", "unit": "cup", "item": "King Arthur Gluten-Free Multi-Purpose Flour"}, {"amount": "1", "unit": "teaspoon", "item": "xanthan gum"}, {"amount": "1", "unit": "teaspoon", "item": "baking powder"}, {"amount": "1", "unit": "teaspoon", "item": "baking soda"}, {"amount": "2", "unit": "cup", "item": "chocolate chips"}, {"amount": "1 1/2", "unit": "cup", "item": "chopped nuts, optional"}], "steps": ["Beat the butter, sugars, vanilla and salt till fluffy.", "Beat in the eggs one at a time, being sure to scrape down the sides and bottom of the bowl midway through to make sure everything is well combined.", "Whisk together the flour or flour blend, xanthan gum, baking powder, and baking soda.", "Beat the dry ingredients into the butter mixture, then blend in the chocolate chips and nuts. Again, scrape the bottom and sides of the bowl to be sure everything is well blended.", "Cover the bowl and refrigerate for 1 hour, or for up to 2 days.", "Preheat the oven to 350\u00b0F. Lightly grease a couple of baking sheets, or line with parchment.", "Scoop tablespoon-sized balls of dough onto the prepared baking sheets; a tablespoon cookie scoop works well here. Leave space between the cookies so they can spread.", "Bake the cookies for 9 to 11 minutes, until golden brown. Remove from the oven and let rest on the baking sheets for 5 minutes, to set, before transferring to racks to cool completely. Or allow them to cool right on the baking sheets.", "Yield: 3 dozen cookies"], "timeMinutes": 28}, {"name": "Homemade candy canes", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "3", "unit": "cup", "item": "sugar"}, {"amount": "1", "unit": "cup", "item": "corn syrup"}, {"amount": "1/3", "unit": "cup", "item": "water"}, {"amount": "1/2", "unit": "tsp", "item": "cream of tartar"}, {"amount": "1/8", "unit": "tsp", "item": "kosher salt"}, {"amount": "", "unit": "", "item": "Vegetable oil"}, {"amount": "2", "unit": "tsp", "item": "peppermint oil, (ideally not extract, but ok to use if that\u2019s all you have)"}, {"amount": "1", "unit": "tsp", "item": "vanilla extract"}, {"amount": "1/3", "unit": "", "item": "bottle red food coloring"}], "steps": ["Preheat the oven to 200 degrees. Oil two large baking sheets, a bench scraper, and kitchen shears or a sharp knife. Lay a piece of parchment paper or a Silpat on the counter where the canes can dry. Move one of the baking sheets to the warm oven.", "Meanwhile, in a straight-sided deep saucepan off heat, combine the sugar, corn syrup, water, cream of tartar, and salt and stir them together well.", "Clip a candy thermometer to the side of the pot and move it onto medium-high heat.", "Without stirring, let the syrup come up to 305 degrees.", "Using a pastry brush or a paint brush dedicated to culinary use, wash down any stray sugar crystals from the side of the pot.", "Ready the peppermint oil, food coloring, measuring spoons, and vegetable oil.", "Glove thyself with either heat-retardant gloves or snug mittens covered with disposable gloves.", "Once the syrup has reached temperature, pour it out onto the room temperature baking sheet.", "Drizzle the peppermint oil on top, and using the bench scraper, scrape the hot candy up from the bottom and fold it over onto itself to stir it through.", "Once it has cooled slightly, mix in the vanilla as well.", "Note that the peppermint scent in the air will be strong.", "Continuously scrape up and stir the syrup to cool it until it becomes a pliable dough. Cut the dough in half and move one piece to the baking sheet inside the warm oven. (First, we\u2019ll \u201cpull\u201d the white half of the candy cane. Then we\u2019ll color the red half.)", "Quickly oil your gloved hands, as it\u2019s now time to pull the candy.", "Scrape up the candy dough into one piece and, working as quickly and as continuously as you can, pull it out into a rope, double it over onto itself, and twist it together.", "Pull it, double it, and twist it again.", "Keep on going this way at a quick clip, and you\u2019ll notice that the candy will start to take on a ribbon-y sheen.", "This is how the candy will turn white, so keep going until the color is pure.", "Embrace the upper body workout.", "Note that anytime the candy becomes too stiff, simply warm it up again in the oven to soften.", "Don\u2019t let the candy get too hard.", "When it\u2019s reached a nice white color, place it onto its baking sheet and move it to the warm oven.", "Re-oil your bench scraper.", "Take out the second tray of candy dough and pour on the red food coloring -- about a third of one of those tiny bottles for a good rich color.", "Use your scraper fold the candy onto itself to incorporate the color completely.", "Note that this side of the candy cane does not need to be pulled.", "Move both candy cane trays to the oven and let them warm through for about 5 minutes until pliant.", "Once warm and squishy enough to work with, take both pieces of candy from the oven and roll them into logs as long as the baking sheet. Cut each log into four equal pieces. Hang on to one red piece and one white piece, moving the rest of the candy back into the oven to keep warm.", "On the countertop, line the red and white logs alongside one another and begin to twist from one end, stretching as you go, making the candy canes as thin or as thick as you like.", "Use your oiled shears or knife to cut the length of each cane.", "Shape the hook of the cane, and press down on the ends to taper.", "Set the canes aside to cool. (Know, of course, that you could also cut into sticks, rounds, or individual peppermint sucking candy).", "Admire the individual quality of your handiwork.", "Repeat this process with the remaining 3/4 of the candy, one piece of each color at a time.", "Allow candy to cool until completely hard; about 15 minutes. Wrap each cane in plastic wrap to keep it from sticking. Store in an airtight jar for several months."]}, {"name": "Pecan Pie", "category": "Dessert", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "tbsp", "item": "butter"}, {"amount": "1", "unit": "tbsp", "item": "flour"}, {"amount": "1", "unit": "tbsp", "item": "corn starch"}, {"amount": "1", "unit": "cup", "item": "sugar"}, {"amount": "1", "unit": "cup", "item": "cane syrup, (Lyle's Golden Syrup or Steen's Cane Syrup)"}, {"amount": "2", "unit": "tsp", "item": "vanilla"}, {"amount": "2", "unit": "", "item": "eggs"}, {"amount": "1", "unit": "cup", "item": "chop utes.", "Add the milk, sour cream, egg yolk and 1/2 cup flour; beat with the paddle attachment on medium speed until combined.", "Gradually beat in the remaining 1 1/4 cups flour, scraping the bowl as needed, to form a wet dough, about4 minutes.", "Increase the speed to medium high; add the whole egg, sugar, salt and vanilla and beat until creamy, 3 to 4 minutes.", "Add the butter, 1 tablespoon at a time; beat until incorporated.", "The dough will be very wet.", "Brush a large bowl with butter; transfer the dough to the bowl and cover with plastic wrap. Let rise in a warm place until nearly doubled in size, about 1 hour, 30 minutes. Stir the dough to punch it down; cover and refrigerate until firm, at least 3 hours or up to overnight.", "Generously dust a sheet of parchment paper with flour. Pat the dough into a square on the parchment, then roll into an 11-by-15-inch rectangle. Transfer the dough and parchment to a baking sheet and brush off the excess flour. Cover and chill until firm enough to shape, 1 to 2 hours.", "Meanwhile, make the filling: Pulse the almonds and sugar in a food processor until fine. Add the butter, egg, rum, vanilla, cinnamon, orange zest and almond extract; pulse until smooth. Cover and chill 1 hour.", "Make the streusel: Mash the confectioners' sugar, flour and butter in a bowl with a fork to make clumps. Cover and chill until ready to use.", "Butter an 8 1/2-by-4 1/2-inch loaf pan.", "Spread the almond filling over the dough, leaving a 1-inch border; sprinkle with the chocolate.", "Starting from a short side, use the parchment to tightly roll up the dough, brushing off the excess flour.", "Pinch the ends of the roll, then twist several times.", "Fold the twist in half so the ends meet.", "Twist the folded dough again and place in the pan.", "Cover with buttered parchment; let rise in a warm place until puffy, about 2 hours.", "***If desired, make up to this point 1 day in advance. Cover with buttered parchment, then wrap in plastic and re "", "item": "eggs, slightly beaten"}, {"amount": "2", "unit": "tablespoon", "item": "finely grated Parmesan, plus extra for garnish"}, {"amount": "", "unit": "", "item": "Salt and freshly ground black pepper"}], "steps": ["Bring a saucepan of salted water it a boil, reduce the heat, and maintain a simmer.", "In a bowl, stir all the ingredients together (eggs, flour, milk, salt, baking powder, and nutmeg).", "Place a colander over the pan, pour about1/4 of the batter into the colander, and press through the holes with a plastic spatula into the hot water.", "When the spatzle starts to float to the surface, cover the pan and keep covered until the spatzle appears to swell and is fluffy.", "Remove the dumplings and repeat the procedure with the remaining batter.", "In a medium saute pan, add butter, and melt over medium heat until butter turns a light brown. Add garlic and cook until it becomes lightly colored. Add spaetzle to the pan to heat through. Add parsley, cheese, salt and pepper, to taste."]}, {"name": "Stove top mac and cheese", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "", "unit": "", "item": "Fresh black pepper"}, {"amount": "1", "unit": "teaspoon", "item": "kosher salt"}, {"amount": "1/2", "unit": "teaspoon", "item": "hot sauce"}, {"amount": "4", "unit": "ounce", "item": "evaporated milk"}, {"amount": "2", "unit": "", "item": "eggs"}, {"amount": "4", "unit": "tablespoon", "item": "butter"}, {"amount": "1/2", "unit": "pound", "item": "elbow macaroni"}, {"amount": "1/4", "unit": "teaspoon", "item": "dry mustard"}, {"amount": "10", "unit": "ounce", "item": "sharp cheddar, shredded"}], "steps": ["In a large pot of boiling, salted water cook the pasta to al dente and drain. Return to the pot and melt in the butter. Toss to coat.", "Whisk together the eggs, milk, hot sauce, salt, pepper, and mustard. Stir into the pasta and add the cheese. Over low heat continue to stir for 3 minutes or until creamy.", "(This recipe originally called for 6oz milk.  It is reduced as an experiment.)"]}, {"name": "Handmade Pasta", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "item": "all-purpose flour"}, {"amount": "1/2", "unit": "cup", "item": "semolina"}, {"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "2", "unit": "", "item": "eggs, at room temperature"}, {"amount": "2", "unit": "tsp", "item": "extra-virgin olive oil"}], "steps": ["Sift flour and semolina into a medium bow.", "Mix in salt.", "Add eggs and olive oil, and beginning in the center, mix with two fingers in a circular motion until flour is combined with eggs.", "Do not overmix.", "Remove dough from bowl and gather into a ball.", "On a lightly-floured board, knead gently with the heels of your hands, folding dough over onto itself until it forms a smooth mass.", "Pat into a ball, flatten slightly, wrap in waxed paper or plastic wrap, and refrigerate for 30 minutes or as long as overnight.", "Work on a lightly floured surface.", "Keep the dough lightly dusted with flour.", "Roll dough into a sheet about 1/16-inch thick.", "Gently roll dough up into a cylinder.", "With a slicing knife, cut crosswise in 1/4-inch slices.", "Dust dough with semolina and unwrap noodles.", "Cover with a tea towel until ready to cook.  (The past may be made an hour ahead of time or frozen for up to 1 month.", "Defrost in refrigerator.)  Fresh pasta will cook, in boiling salted water, in about 2-3 minutes."]}, {"name": "Straw and Hay Fettuccine Tangle", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "serving", "item": "asparagus pesto"}, {"amount": "1/4", "unit": "cup", "item": "toasted pine nuts"}, {"amount": "4", "unit": "tbsp", "item": "parmesan, grated"}, {"amount": "12", "unit": "oz", "item": "dried pasta"}], "steps": ["http://www.xanthir.com/recipes/showrecipe.php?id=id436 Asparagus pesto can be made in large batches ahead of time, and frozen in servings.", "Bring a large pot of water to a rolling boil.", "Meanwhile, make asparagus pesto.", "Salt the pasta water well and cook the pasta until just tender. Drain and toss immediately with the asparagus pesto (1/4 cup per serving), stirring in more afterward depending on how heavily coated you like your pasta. Serve sprinkled with the remaining toasted pine nuts, a dusting of Parmesan, and a quick drizzle of extra-virgin olive oil."], "timeMinutes": 30}, {"name": "Pesto Orzo with Peas", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "oz", "item": "pancetta, diced"}, {"amount": "12", "unit": "oz", "item": "frozen peas"}, {"amount": "1", "unit": "cup", "item": "water"}, {"amount": "4", "unit": "servings", "item": "pesto"}, {"amount": "1", "unit": "cup", "item": "orzo, uncooked"}, {"amount": "2", "unit": "tbsp", "item": "Parmesan, grated"}], "steps": ["Cook pancetta in a skilled with olive oil until crisp.  Remove with slotted spoon.", "Meanwhile, bring 1 quart of water to a boil. Add 1 tbsp salt and orzo. Cook about 5 minutes or until al dente.", "Add frozen peas and water to the skillet; simmer until tender (about 5 minutes). Drain and return to skillet.", "Stir in pesto, orzo, pancetta, and parmesan, and heat through."]}, {"name": "Spinach lasagna with mushroom ragu", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "oz", "item": "dried porcini mushrooms"}, {"amount": "2", "unit": "tbsp", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "", "item": "medium onion, chopped"}, {"amount": "1", "unit": "", "item": "large carrot, finely chopped"}, {"amount": "1", "unit": "stalk", "item": "celery, finely chopped"}, {"amount": "4", "unit": "clove", "item": "garlic, chopped"}, {"amount": "2", "unit": "tbsp", "item": "tomato paste"}, {"amount": "2", "unit": "", "item": "portobello mushroom cap, chopped"}, {"amount": "1 1/2", "unit": "lb", "item": "shiitake mushrooms, stems removed, chopped"}, {"amount": "", "unit": "", "item": "Kosher salt and freshly ground pepper"}, {"amount": "2 28", "unit": "oz", "item": "cans whole San Marzano tomatoes, crushed by hand"}, {"amount": "3", "unit": "", "item": "bay leaves"}, {"amount": "1/4", "unit": "cup", "item": "fresh parsley, chopped"}, {"amount": "3", "unit": "oz", "item": "parmesan cheese, grated"}, {"amount": "1 1/2", "unit": "lb", "item": "part-skim mozzarella cheese, shredded"}, {"amount": "8", "unit": "oz", "item": "asiago cheese, shredded"}, {"amount": "2", "unit": "lb", "item": "ricotta cheese"}, {"amount": "2", "unit": "", "item": "large eggs, lightly beaten"}, {"amount": "1", "unit": "lb", "item": "frozen chopped spinach, thawed and squeezed dry"}, {"amount": "1/4", "unit": "tsp", "item": "nutmeg, freshly grated"}, {"amount": "12", "unit": "oz", "item": "dried lasagna noodles"}], "steps": ["Make the ragu: Soak the porcini mushrooms in 1 cup hot water until soft, about 15 minutes. Strain through a fine-mesh sieve over a bowl. Chop; reserve the liquid.", "Meanwhile, heat the olive oil in a pot over medium heat. Add the onion, carrot and celery and cook until soft, 5 minutes. Stir in the garlic and tomato paste and cook, stirring, 2 more minutes. Add the portobello and shiitake mushrooms, 1 teaspoon salt and 1/2 teaspoon pepper; cook, stirring until the mushrooms are soft, 5 more minutes.", "Add the porcini mushrooms, cook 2 minutes.", "Add the reserved porcini liquid, bring to a boil and cook until reduced slightly, about 3 minutes.", "Add the tomatoes and their juice, 2 cups water and the bay leaves; bring to a boil, stirring occasionally.", "Reduce the heat to medium low, add the parsley and 1 teaspoon salt and simmer, stirring a few times, until thick, about 1 hour, 30 minutes.", "Discard the bay leaves. (you can make the ragu up to 1 day ahead; let cool, then cover and chill.", "Reheat before using.)", "Make the lasagna filling: Mix the parmesan, mozzarella and asiago; set 1 1/2 cups of the cheese mixture aside. Combine the remaining cheese mixture in a large bowl with the ricotta, eggs, spinach, nutmeg and 1/2 teaspoon salt.", "Preheat the oven to 375F. Bring a pot of water to a boil and add a generous amount of salt. Add the noodles and cook as the label directs. Drain and rinse under cold water; shake off the excess water.", "Spread 1 cup of the ragu in a 9-by-13-inch baking dish.", "Add a layer of noodles, then half of the spinach mixture and 2 cups ragu.", "Repeat with another layer of noodles, spinach mixture and ragu.", "Top with the remaining noodles and ragu and sprinkle with the reserved cheese.", "Cover with foil, place on a baking sheet and bake 50 minutes.", "Uncover and bake until golden, about 25 more minutes.", "Let rest before serving."], "timeMinutes": 212}, {"name": "Three cheese macaroni", "category": "Pasta & Noodles", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "stick", "item": "unsalted butter, plus more for pie plates"}, {"amount": "1", "unit": "cup", "item": "panko breadcrumbs"}, {"amount": "5", "unit": "cup", "item": "whole milk"}, {"amount": "1/2", "unit": "cup", "item": "all-purpose flour"}, {"amount": "10", "unit": "oz", "item": "sharp cheddar cheese, about 4 cups grated"}, {"amount": "4", "unit": "oz", "item": "Gruyere cheese, about 1 1/2 cups grated"}, {"amount": "4", "unit": "oz", "item": "fontina cheese, about 1 1/2 cups grated"}, {"amount": "", "unit": "", "item": "Salt and freshly ground black pepper"}, {"amount": "1/4", "unit": "tsp", "item": "nutmeg, freshly grated"}, {"amount": "1/4", "unit": "tsp", "item": "paprika"}, {"amount": "1/4", "unit": "tsp", "item": "cayenne pepper"}, {"amount": "1", "unit": "lb", "item": "elbow macaroni"}], "steps": ["Preheat oven to 375F.", "Butter 10 mini (1 cup) pie plates or a 9x13-inch baking dish.", "Melt 2 tbsp butter in a small saucepan over medium heat.", "Add breadcrumbs, and toast, stirring occasionally, until golden brown,

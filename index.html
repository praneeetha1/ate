it": "teaspoon", "item": "kosher salt"}], "steps": ["Separate the eggs and store the whites for another purpose.", "Beat the yolks with the sugar and nutmeg in a large mixing bowl until the mixture lightens in color and falls off the whisk in a solid \"ribbon.\"", "Combine dairy, booze and salt in a second bowl or pitcher and then slowly beat into the egg mixture.", "Move to a large glass jar (or a couple of smaller ones) and store in the fridge for a minimum of 2 weeks.", "A month would be better, and two better still.", "In fact, there's nothing that says you couldn't age it a year, but I've just never been able to wait that long. (And yes, you can also drink it right away.)", "Makes ~3L/24cups for the full recipe. 18-20 \"servings\" fit a growler well."]}, {"name": "Mulled cranberry apple cider", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "cup", "item": "cranberry juice blend or cranberry cocktail"}, {"amount": "4", "unit": "cup", "item": "apple cider or apple juice"}, {"amount": "1", "unit": "", "item": "orange, peeled and cut peel in large strips"}, {"amount": "1", "unit": "", "item": "-inch piece of ginger, peeled and sliced"}, {"amount": "2", "unit": "", "item": "(3-inch) cinnamon sticks"}, {"amount": "4", "unit": "", "item": "whole allspice berries"}, {"amount": "4", "unit": "", "item": "whole cloves"}, {"amount": "", "unit": "", "item": "Honey or brown sugar"}], "steps": ["Place all ingredients in a large pot and bring to a boil. Reduce heat and simmer, partially covered, for 30 minutes. Strain and serve warm.", "Notes on juices and sweeteners: \n\u2022 I prefer to use an unsweetened cranberry juice blend and unsweetened apple cider/juice and to sweeten the drink with honey (or not at all).", "Whether you sweeten it will depend on personal preference and the juices you use.", "If using sweetener, start with a couple tablespoons and increase as desired. \n\u2022 If using pure unsweetened cranberry juice (instead of a juice blend), reduce the amount to 2 cups and increase the apple cider/juice to 6 cups."], "timeMinutes": 40}, {"name": "Malted hot cocoa", "category": "Drink", "dietary": ["vegetarian"], "ingredients": [{"amount": "42", "unit": "oz", "item": "superfine or granulated sugar"}, {"amount": "12", "unit": "oz", "item": "malted milk powder"}, {"amount": "12", "unit": "oz", "item": "cocoa powder"}, {"amount": "2", "unit": "tbsp", "item": "espresso powder"}, {"amount": "2", "unit": "tbsp", "item": "vanilla powder"}, {"amount": "1 1/2", "unit": "tsp", "item": "salt"}], "steps": ["Mix all ingredients by sifting or whisking together in a large bowl until evenly incorporated. Store at room temperature in an airtight container.", "Each serving is 1/4 cup mix in 1 cup hot milk."]}, {"name": "Apple-Brie Panini", "category": "Quick Meal", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "tbsp", "item": "Dijon mustard"}, {"amount": "1", "unit": "", "item": "Baguette roll"}, {"amount": "2", "unit": "oz", "item": "brie cheese, sliced"}, {"amount": "1/4", "unit": "", "item": "green apple, thinly sliced"}, {"amount": "2", "unit": "tablespoon", "item": "unsalted butter"}], "steps": ["Preheat a skillet with 1 tablespoon butter (or oil) on medium-low.", "Spread Dijon mustard on the inside of a split piece of baguette. Fill with the brie and apple slices.", "Add sandwich to skillet, the press a heavy pan on top to weigh it down. Cook until golden and crisp, 3 to 4 minutes per side. Add more butter to the skillet, if needed, for second side."]}, {"name": "Triple Grilled Cheese", "category": "Quick Meal", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "cup", "item": "shredded muenster cheese (about 4 oz)"}, {"amount": "1", "unit": "cup", "item": "shredded mozzarella cheese (about 4 oz)"}, {"amount": "1/2", "unit": "cup", "item": "grated Parmesan cheese (about 1 oz)"}, {"amount": "8", "unit": "slices", "item": "thick sandwich bread"}, {"amount": "2", "unit": "tablespoon", "item": "unsalted butter"}], "steps": ["Combine all three cheeses in a bowl.", "Divide evenly among 4 bread slices and top with the remaining bread.", "Heat 1 tablespoon butter in a large skillet or griddle over medium heat.", "Cook the sandwiches in batches, adding the remaining butter as needed, until the cheese melts and the bread is golden, 3-4 minutes per side.", "Serve the sandwiches with the soup."], "timeMinutes": 18}, {"name": "Baja fish tacos", "category": "Quick Meal", "dietary": ["vegetarian"], "ingredients": [{"amount": "", "unit": "", "item": "Vegetable oil, for frying"}, {"amount": "1/4", "unit": "", "item": "red cabbage, thinly sliced (about 1 1/2 cups)"}, {"amount": "1/2", "unit": "cup", "item": "fresh cilantro, roughly chopped"}, {"amount": "1", "unit": "", "item": "lime, juiced, plus wedges for serving"}, {"amount": "2", "unit": "tablespoon", "item": "honey or agave nectar"}, {"amount": "1/2", "unit": "cup", "item": "mayonnaise"}, {"amount": "", "unit": "", "item": "Kosher salt"}, {"amount": "12", "unit": "", "item": "corn tortillas"}, {"amount": "3/4", "unit": "cup", "item": "all-purpose flour"}, {"amount": "1/2", "unit": "teaspoon", "item": "chili powder"}, {"amount": "", "unit": "", "item": "Freshly ground pepper"}, {"amount": "1 1/4", "unit": "pound", "item": "skinless halibut fillet, cut into 2-by-1/2-inch pieces"}, {"amount": "1", "unit": "", "item": "avocado"}, {"amount": "1/2", "unit": "cup", "item": "fresh salsa"}], "steps": ["Heat about 3 inches vegetable oil in a medium pot over medium-low heat until a deep-fry thermometer registers 375 degrees F. Meanwhile, toss the cabbage, cilantro, lime juice, honey and mayonnaise in a bowl. Season the slaw with salt.", "Warm the tortillas in a skillet over medium-low heat or wrap in a damp cloth and microwave 25 seconds. Wrap in a towel to keep warm.", "Mix the flour, chili powder, and salt and pepper to taste in a shallow bowl. Dredge the fish in the flour mixture, then fry in batches until golden and just cooked through, 2 to 3 minutes. Transfer with a slotted spoon to a paper-towel-lined plate to drain. Season with salt.", "Halve, pit and slice the avocado. Fill the tortillas with the fish, avocado, slaw and salsa. Serve with lime wedges.", "Read more at: http://www.foodnetwork.com/recipes/food-network-kitchens/baja-fish-tacos-recipe.html?oc=linkback"], "timeMinutes": 20}, {"name": "Mini hamburger bento (Select a mini burger recipe too)", "category": "Quick Meal", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "serving", "item": "mini burger recipe"}, {"amount": "1 2", "unit": "", "item": "-inch length of carrot, sliced into 1/4 inch rounds"}, {"amount": "1/2", "unit": "oz", "item": "cheese"}, {"amount": "1/2", "unit": "", "item": "medium red onion, very thinly sliced"}, {"amount": "", "unit": "", "item": "salt"}, {"amount": "1/4", "unit": "cup", "item": "parsley, loosely packed, finely chopped"}, {"amount": "", "unit": "", "item": "black pepper"}, {"amount": "1", "unit": "tsp", "item": "rice vinegar"}, {"amount": "1", "unit": "pinch", "item": "sugar"}, {"amount": "1/4", "unit": "cup", "item": "snow peas"}, {"amount": "1", "unit": "cup", "item": "cooked short-grain white rice"}, {"amount": "", "unit": "", "item": "sesame salt, for sprinkling"}], "steps": ["Make or reheat mini burgers, pack into bento box to cool.\n2.", "For carrots: cut out decorative flowers with a small bento cutter.", "Boil in salted water for 5 minutes or until the carrot slices are tender.", "Let cool before adding to the bento box.\n3.", "For cheese (optional): cut out decorative flowers from sliced cheese.", "Alternatively, cut into small cubes.\n4.", "For red onion salad: sprinkle the onion with a pinch of salt and massage the salt well into the onion with your hands.", "Squeeze the onion to expel as much moisture as possible.", "In a bowl, mix the onion, parsley, vinegar, and sugar.", "Season with pepper to taste.", "Pack into a cupcake liner or bento divider cup.\n5.", "For snow peas: Blanch in boiling water for a few minutes until crisp-tender.", "Drain and cool rapidly under running water.", "Drain well before adding to bento box.\n6.", "For rice: Pack rice into the bento box and sprinkle with the sesame salt."]}, {"name": "Fresh salmon mini burgers", "category": "Quick Meal", "dietary": [], "ingredients": [{"amount": "1", "unit": "lb", "item": "salmon filet, boneless/skinless, chopped up in food processor"}, {"amount": "1/3", "unit": "cup", "item": "dried bread crumbs"}, {"amount": "2", "unit": "tbsp", "item": "whole milk"}, {"amount": "3", "unit": "tbsp", "item": "green onion, finely chopped"}, {"amount": "1", "unit": "", "item": "egg"}, {"amount": "2", "unit": "tbsp", "item": "fresh dill, chopped"}, {"amount": "2", "unit": "tbsp", "item": "cream cheese"}, {"amount": "1", "unit": "tbsp", "item": "butter"}, {"amount": "1", "unit": "tbsp", "item": "vegetable oil"}], "steps": ["Mix all ingredients except butter and oil very well with your hands until everything sticks together. Form into mini burger patties. Fry on both sides in a mixture of butter and vegetable oil over medium heat until just cooked through."], "timeMinutes": 23}, {"name": "Pizza dough", "category": "Quick Meal", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "cup", "item": "lukewarm water"}, {"amount": "1", "unit": "tablespoon", "item": "sugar"}, {"amount": "1", "unit": "tablespoon", "item": "active dry yeast or instant yeast; or 1 packet active dry yeast"}, {"amount": "1", "unit": "tablespoon", "item": "salt"}, {"amount": "2", "unit": "tablespoon", "item": "olive oil, optional"}, {"amount": "1 1/2", "unit": "cup", "item": "semolina"}, {"amount": "4", "unit": "", "item": "to 4 1/2 cups Italian-style flour"}, {"amount": "1", "unit": "teaspoon", "item": "baking soda"}, {"amount": "2", "unit": "tablespoon", "item": "Pizza Dough Flavor, optional"}, {"amount": "2", "unit": "tablespoon", "item": "dough improver, optional"}], "steps": ["Dissolve the sugar, yeast, and salt in the lukewarm water (and olive oil, if you're using it).", "Add the flour and Pizza Dough Flavor, starting with 5 1/2 cups flour and adding more as necessary to make a soft, smooth dough.", "Knead the dough (with your hands, a mixer, or your bread machine set on the dough cycle) until it's smooth and elastic, about 7 to 10 minutes.", "Place the dough in a lightly greased bowl or other container, cover it, and let it rise for 1 to 2 hours, whatever fits your schedule.", "Gently deflate the dough, and divide it into four pieces.", "Use a rolling pin to roll each piece, on a lightly greased surface, into a circle to fit a 12\" pizza pan.", "Let the dough rest several times to relax it and make it more cooperative.", "If you prefer a more artisan look to your crust, with scattered random air pockets throughout, hand-stretch the dough to size.", "Again, letting it rest periodically makes the job easier.", "Place the rounds on pizza pans; on baking sheets; or, if you have a pizza stone in your oven, on parchment.", "Preheat your oven to 450\u00b0F. While it's heating, get out your toppings, which you've prepared ahead.", "Brush each crust with a bit of olive oil; spread pizza or spaghetti sauce lightly over the surface, and let your guests add their favorite toppings. Sprinkle the top with grated cheese.\nBake the pizzas for 15 to 20 minutes, until they're golden brown, the toppings are hot and bubbly, and the cheese is melted. Remove the pizzas from the oven.", "Immediately transfer pizzas to a cooling rack, so their bottoms don't get soggy. After about 10 minutes (to allow the toppings to set), slice and serve; a pair of scissors is a great cutting tool.", "Yield: 4 12\" pizzas, 6 to 8 servings each.\nTo freeze: After dividing dough in step 5, wrap ball of dough in plastic wrap and freeze. Allow to defrost in refrigerator and then set out at room temperature for about 30 minutes before shaping crust."], "timeMinutes": 25}, {"name": "Quick pickled red onion", "category": "Quick Meal", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "", "item": "large red onion, thinly sliced"}, {"amount": "4", "unit": "", "item": "limes, juiced"}, {"amount": "1", "unit": "", "item": "small orange, juiced"}, {"amount": "1", "unit": "tbsp", "item": "apple cider vinegar"}, {"amount": "3/4", "unit": "tsp", "item": "salt"}], "steps": ["Do not use metal or plastic", "To a glass jar or bowl, add your onion slices.", "With a lemon/lime juice squeezer, squeeze as much juice out of your citrus fruits overtop of the onions.\nAdd your apple cider vinegar, salt and any extra add-ins you like to the onions.", "If using a bowl, carefully toss everything together to coat. If using a jar, seal the jar and give it a few good shakes to distribute the juice and salt evenly.", "Place the jar in the fridge to sit for at least 30 minutes before using. You can still taste and adjust the salt to preference once they are ready to eat."], "timeMinutes": 5}, {"name": "Pizza sauce from tomato paste", "category": "Quick Meal", "dietary": ["vegetarian"], "ingredients": [{"amount": "1 6", "unit": "oz", "item": "can tomato paste (6oz can is about 2/3 cup)"}, {"amount": "1/2", "unit": "cup", "item": "water"}, {"amount": "1", "unit": "tsp", "item": "dried oregano, crushed"}, {"amount": "1", "unit": "tsp", "item": "dried basil, crushed"}, {"amount": "1/2", "unit": "tsp", "item": "garlic powder"}, {"amount": "1/2", "unit": "tsp", "item": "onion powder"}, {"amount": "1/2", "unit": "tsp", "item": "sugar"}, {"amount": "1/2", "unit": "tsp", "item": "salt"}, {"amount": "1/4", "unit": "tsp", "item": "freshly ground black pepper"}], "steps": ["Makes enough for 1 full size pizza (1 lb. dough)", "Combine all ingredients in a small bowl; mix well. Set aside about 15 minutes for flavors to develop."], "timeMinutes": 5}, {"name": "Asparagus pesto", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "bunch", "item": "asparagus, trimmed and halved crosswise"}, {"amount": "2", "unit": "cup", "item": "baby spinach leaves"}, {"amount": "2", "unit": "clove", "item": "garlic"}, {"amount": "1", "unit": "cup", "item": "parmesan cheese, freshly grated"}, {"amount": "3/4", "unit": "cup", "item": "pine nuts, toasted"}, {"amount": "1/4", "unit": "cup", "item": "extra-virgin olive oil, plus more for topping"}, {"amount": "1/2", "unit": "", "item": "lemon, juiced"}, {"amount": "1/2", "unit": "teaspoon", "item": "salt"}], "steps": ["Bring a medium pot of water to a boil.", "To make the asparagus puree, salt the asparagus water and drop the spears into the pot.", "Cook for 2 or 3 minutes, or until the spears are bright green and barely tender.", "Drain and transfer to a food processor (preferably) or a blender.", "Add the spinach, garlic, Parmesan, and the pine nuts.", "Puree and, with the motor running, drizzle in the olive oil until a paste forms.", "It should be the loose consistency of a pesto; if too thick, thin it with a bit of the pasta water.", "Add the lemon juice and salt, then taste and adjust the seasonings."], "timeMinutes": 12}, {"name": "Adult Lunchable with Veggies, Egg, and Boursin", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "serving", "item": "water crackers"}, {"amount": "1/3", "unit": "", "item": "medium cucumber, sliced on the bias"}, {"amount": "1/3", "unit": "cup", "item": "grape tomatoes"}, {"amount": "1", "unit": "", "item": "egg, hard cooked and peeled"}, {"amount": "1/4", "unit": "package", "item": "Boursin cheese"}, {"amount": "1", "unit": "cup", "item": "fresh fruit"}], "steps": ["Pack all ingredients in small containers or a segmented lunch box. Enjoy!"], "timeMinutes": 5}, {"name": "Seitan and three-color pepper stir-fry bento", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/2", "unit": "tbsp", "item": "olive oil"}, {"amount": "3", "unit": "tbsp", "item": "green onion, roughly chopped"}, {"amount": "2", "unit": "tsp", "item": "fresh ginger, peeled and finely chopped"}, {"amount": "1/3", "unit": "", "item": "medium red bell pepper, cut into 1/2-inch chunks"}, {"amount": "1/3", "unit": "", "item": "medium green bell pepper, cut into 1/2-inch chunks"}, {"amount": "1/3", "unit": "", "item": "medium yellow bell pepper, cut into 1/2-inch chunks"}, {"amount": "", "unit": "", "item": "salt"}, {"amount": "2", "unit": "oz", "item": "seitan, cut into 1/2-inch chunks"}, {"amount": "", "unit": "", "item": "black pepper, to taste"}, {"amount": "1/2", "unit": "tbsp", "item": "soy sauce"}, {"amount": "", "unit": "", "item": "lettuce leaves (to use as bento dividers), washed and dried"}, {"amount": "1", "unit": "", "item": "large green cabbage leaf"}, {"amount": "1 2", "unit": "", "item": "-inch length English cucumber, sliced into thin rounds"}, {"amount": "1/2", "unit": "tsp", "item": "sea salt"}, {"amount": "1", "unit": "tbsp", "item": "lemon juice"}, {"amount": "4", "unit": "", "item": "florets broccoli"}, {"amount": "4", "unit": "", "item": "cherry tomatoes"}, {"amount": "1", "unit": "cup", "item": "cooked sushi rice"}], "steps": ["For Seitan:", "Heat the oil in a frying pan over medium heat.", "Add the green onion and ginger and stir-fry for 1-2 minutes until the oil is fragrant.", "Turn the heat up to the highest setting and add the peppers to the pan.", "Stir-fry with a spatula or long chopsticks.", "Sprinkle in some salt--this draws out moisture from the vegetables and cooks them a bit faster.", "Continue stir-frying for 4-5 minutes, until the peppers are cooked.", "Push the vegetables to the sides of the pan, and add the seitan to the exposed bottom. Leave for a couple of minutes, then turn over to cook the other side. Stir everything together, and add black pepper and soy sauce.", "For instant cabbage and cucumber pickles:", "cut out the tough vein of the cabbage leaf, and slice the rest into strips. Sprinkle the cabbage and cucumber with the salt and massage well with your hands until the vegetables go limp. Let rest for at least 5 minutes. Add a squeeze of lemon juice.", "Squeeze out any excess moisture before packing into a bento box. I like to put the pickles in a bento divider cup or cupcake liner to prevent the flavors from mingling with other flavors in the box.", "For Blanched Broccoli:", "Put just enough water in a small pan to cover the broccoli. Bring the water to a boil, add a pinch of salt, and put in the broccoli florets. Boil for 2-3 minutes, drain the water, and run cold tap water over the broccoli to cool quickly and fix the bright green color. Drain well. Use broccoli and cherry tomatoes to fill in gaps in the bento box."], "timeMinutes": 27}, {"name": "Tamagoyaki Bento", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "", "item": "large eggs"}, {"amount": "1/2", "unit": "tbsp", "item": "sugar"}, {"amount": "1/2", "unit": "tsp", "item": "mirin"}, {"amount": "1", "unit": "pinch", "item": "salt"}, {"amount": "1/4", "unit": "tsp", "item": "soy sauce"}, {"amount": "", "unit": "", "item": "vegetable oil, for frying"}, {"amount": "", "unit": "", "item": "fresh parsley (for garnish)"}, {"amount": "1/2", "unit": "", "item": "small carrot, medium diced"}, {"amount": "1/4", "unit": "cup", "item": "fresh green beans"}, {"amount": "1", "unit": "cup", "item": "cooked sushi rice"}, {"amount": "", "unit": "", "item": "sesame oil"}, {"amount": "1", "unit": "clove", "item": "garlic, diced small"}, {"amount": "2", "unit": "oz", "item": "baby spinach"}, {"amount": "", "unit": "", "item": "salt and pepper, to taste"}], "steps": ["For Basic Tamagoyaki:", "Mix together all of the tamagoyaki ingredients, except for the oil, until the egg yolk and white are amalgamated but not frothy.", "Heat up the frying pan over medium-high heat. Pour in some oil and tilt the pan to spread it around. Take a small wad of paper towel and rub it around the pan to soak up any excess oil. Put the oil soaked wad on a small plate next to the stove.", "Use cooking chopsticks or a fork to draw a little of the egg mixture along the bottom of the pan. If the egg cooks immediately, the pan is hot enough and ready to go. If the egg browns too fast, cool the pan down by putting the bottom of the pan on a moistened kitchen towel, and lower the heat a little.", "Pour a thin layer of the egg mixture into the hot pan. Tilt the pan to spread it around the bottom. Pierce any large bubbles that form with the chopsticks or fork.", "As soon as the egg starts to set, start rolling it to one side of the pan. Flip one end over with the chopsticks or fork and keep flipping until you have a skinny roll. If you can't roll the egg, you can just push it along to one side until you have a skinny little omelette.", "Leaving the first roll at one side of the pan, rub the oil-soaked wad of paper towel firmly along the bottom of the pan. This adds just enough lubrication while also cleaning up any stray bits of egg.", "Add a little more of the egg mixture to the pan, tilting the pan around to spread it. Life the first roll up a little so that the uncooked egg runs beneath it.", "Puncture any large air bubbles that form, as before. As soon as this layer starts to set on top, roll it around the cooked egg roll to the opposite side of the pan. As before, if the egg is browning too fast, place the pan on a moistened towel for a few seconds.", "Repeat the preceding three steps until the egg mixture is all used up. The thinner the layers, the more delicately textured the tamagoyaki will be. Try to do a minimum of 4-5 layers.", "When the tamagoyaki is done, turn seam-side down into the pan and press briefly to seal it. Flip the egg out onto a sushi mat or paper towel.", "Roll the sushi mat or towel around the tamagoyaki, forming a rectangular shape. Leave to cool.", "Cut into even slices before packing. Garnish with parsley.", "Don't despair if your tamagoyaki doesn't quite look perfect. It will still taste great! Leftovers can be refrigerated, tightly wrapped, for a day or two.", "----", "For Vegetables:", "Place veggies into a heat proof bowl with a large pinch of salt.", "Add just enough boiling water to cover. Let stand for 5 minutes or until carrots have softened slightly.", "Drain and cool before packing into bento.\n----", "For Rice:", "Pack rice into bento box and sprinkle with sesame seeds or furikake.", "----", "For Garlic Sauteed Spinach:", "Heat the oil in a pan over medium-high heat. Add the garlic and cook for 30s-1m, until fragrant and infusing the oil.", "Add the spinach and stir-fry rapidly. It will shrink down in mass in no time. When done, turn off heat, season with salt, pepper, and let cool.", "Pack into a bento cup for serving.", "-------", "To instead prepare as a rice bowl (when you're eating it fresh rather than prepping a bento for later), just put the rice serving in a bowl. Fry the eggs, to a soft/gooey yolk, and put on top of rice. Dice the veggies after boiling, add to the spinach during cooking, and put the whole mixture on top of the eggs.", "If you want a little more kick, add togarashi to the eggs, and/or drizzle some sriracha or other chili sauce on top of the bowl when done."], "timeMinutes": 30}, {"name": "Fried Shrimp Bento", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "3", "unit": "", "item": "large shrimp (16/20 count fresh or defrosted), shelled and deveined, tails left on"}, {"amount": "", "unit": "", "item": "Salt"}, {"amount": "", "unit": "", "item": "Pepper"}, {"amount": "2", "unit": "tbsp", "item": "potato starch"}, {"amount": "1", "unit": "", "item": "egg, beaten"}, {"amount": "3", "unit": "tbsp", "item": "panko bread crumbs"}, {"amount": "", "unit": "", "item": "vegetable oil, for frying"}, {"amount": "", "unit": "", "item": "Dipping sauce (tartar/sriracha mayo/ketchup/tonkatsu/sweet chili/ranch/etc)"}, {"amount": "1", "unit": "serving", "item": "carrot and celeriac salad"}, {"amount": "3", "unit": "", "item": "broccoli florets"}, {"amount": "1/2", "unit": "tbsp", "item": "grainy mustard"}, {"amount": "1/2", "unit": "tsp", "item": "lemon juice"}, {"amount": "", "unit": "", "item": "pinch sugar"}, {"amount": "1", "unit": "cup", "item": "cooked white rice"}], "steps": ["Pack **rice** into bento box and allow to cool while prepping remaining ingredients.", "Make tiny cuts along the inside of each **shrimp** (opposite site to where the vein was) and gently pull the shrimp straight. This is an optional step, but it does make the shrimp look much bigger.", "Pat the shrimps dry, and season with a little salt and pepper.", "Put the **potato starch** in one plate, the **beaten egg** in a small bowl, and the **panko bread crumbs** on another plate. Have another plate ready, lined with a couple of paper towels.", "Heat 1/2 inch of vegetable oil in a small frying pan over high heat. The oil is hot enough when a panko bread crumb dropped into it turns light brown right away.", "Working rapidly, coat the shrimps in the cornstarch, dip in the egg,then roll in the bread crumbs.", "Try to do this with one hand, leaving the other hand clean to hold a pair of chopsticks or tongs to turn the shrimps.", "Gently put the shrimps one by one into the hot oil.", "Turn after a minute, and cook for another 30 seconds to a minute on the other side.", "The shrimps should feel firm when lightly tapped with the chopsticks.", "As soon as each shrimp is cooked, remove from the oil and drain on the paper towels. Sprinkle with salt while still hot. Leave the shrimps to cool thoroughly before packing into a bento box.", "Ahead of time note: Bread the shrimps and freeze in a single layer, ideally on a metal baking sheet. Once the shrimps are frozen stiff, pack them in freezer bags or containers. Frozen breaded shrimps should be cooked for 2-3 minutes longer than fresh.", "For **broccoli**, cook or blanch to desired doneness, then let cool. Combine the rest of the ingredients, then mix with the cooled broccoli.", "To pack bento:", "Put the **dipping sauce** of your choice in the sauce cup, to tuck into a corner of the bento box. Pack **carrot and celeriac salad** and **dressed broccoli**. Place shrimp on top of rice, if possible."]}, {"name": "Restaurant Style Butter Chicken in Slow Cooker", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "1/4", "unit": "cup", "item": "slivered almonds"}, {"amount": "2", "unit": "", "item": "Tomatoes"}, {"amount": "1 1/2", "unit": "tbsp", "item": "Tomato Paste"}, {"amount": "1", "unit": "tsp", "item": "garam masala"}, {"amount": "1", "unit": "tsp", "item": "Chili Powder (or 1/2 tsp cayenne (add more if like spicy))"}, {"amount": "1", "unit": "tsp", "item": "Cumin Powder"}, {"amount": "1 2", "unit": "", "item": "-inch piece Ginger"}, {"amount": "3", "unit": "clove", "item": "Garlic, peeled"}, {"amount": "1/2", "unit": "tsp", "item": "Salt"}, {"amount": "1/3", "unit": "cup", "item": "non-fat Greek yogurt"}, {"amount": "1 1/2", "unit": "lb", "item": "Chicken (boneless chicken thigh), cut into 2-\u00ad3 inch cubes"}, {"amount": "1/2", "unit": "tsp", "item": "garam masala"}, {"amount": "2", "unit": "tbsp", "item": "Cilantro, chopped, for garnish"}, {"amount": "1", "unit": "tbsp", "item": "Honey"}, {"amount": "3", "unit": "tbsp", "item": "Heavy Cream (adjust per taste; I add up to 1/3 cup based on tartness of tomatoes)"}, {"amount": "3", "unit": "tbsp", "item": "Unsalted Butter"}, {"amount": "1/2", "unit": "cup", "item": "Red Onion, sliced to thin half\u00admoon slices"}], "steps": ["Marinade: In a food processor jar, add all the chicken marinade ingredients except yogurt, then process to make a fine puree. (if mixture is hard to blend, add 1 tbsp water)", "Transfer marinade to a wide bowl, and mix in yogurt. Then add cubed chicken meat and coat into the marinade. Set aside for 15\u00ad-20 minutes", "Infuse Flavors: In meantime, heat 2 tbsp butter in a wide pan. Saute onion in butter on medium heat until soft and fragrant (2-\u00ad3 minutes). Now, add remaining 1/2 tsp garam masala and continue saute for 1 more minute.", "Transfer the marinated chicken with all marinade and remaining 1 tbsp butter and honey into the saute pan. Cook chicken in pan for 5 minutes on medium\u00ad-high heat or until curry looks darker color.", "Slow Cooker: Transfer everything in slow cooker with 1/4 cup water (or chicken stock for more flavor). Cook on high for 1.25 hours Or on slow for 3-\u00ad4 hours.", "Before serving, after the cooker timer is up, add heavy cream and mix well. Taste and adjust salt. Leave on warm until ready to serve."], "timeMinutes": 195}, {"name": "Smoky Seared Cod with Roasted Potatoes & Dates", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "", "item": "Cod Fillets"}, {"amount": "2", "unit": "cloves", "item": "Garlic"}, {"amount": "2", "unit": "ounces", "item": "Baby Greens"}, {"amount": "1", "unit": "", "item": "Pink Lemon"}, {"amount": "1", "unit": "pound", "item": "Russet Potatoes"}, {"amount": "2", "unit": "tablespoons", "item": "Butter"}, {"amount": "2", "unit": "tablespoons", "item": "Red Wine Vinegar"}, {"amount": "1", "unit": "", "item": "Shallot"}, {"amount": "1", "unit": "tablespoon", "item": "Sugar"}, {"amount": "3", "unit": "tablespoons", "item": "Roasted Almonds"}, {"amount": "1/2", "unit": "ounce", "item": "Deglet Noor Dates"}, {"amount": "1 1/2", "unit": "tablespoons", "item": "Smoky Cod Spice Blend (Rice Flour or potato starch & Smoked Paprika)"}], "steps": ["Preheat the oven to 450\u00b0F. Wash and dry the fresh produce. Cut the potatoes into 1/4-inch-thick rounds. Peel and thinly slice the shallot. Peel and roughly chop the garlic. Roughly chop the dates. Quarter and deseed the lemon. Roughly chop the baby greens. Roughly chop the almonds.", "Place the potatoes on a sheet pan.", "Drizzle with 2 teaspoons of olive oil and season with salt and pepper; toss to thoroughly coat.", "Arrange in a single, even layer and roast, flipping halfway through, 18 to 20 minutes, or until lightly browned and tender when pierced with a fork.", "Remove from the oven and carefully transfer to a large bowl.", "Set aside in a warm place.", "While the potatoes roast, in a small pot, combine the shallot, sugar, vinegar and \u00bc cup of water; season with salt and pepper. Heat to boiling on high. Once boiling, cook, stirring occasionally, 1 to 2 minutes, or until the sugar has dissolved. Set aside to cool, stirring occasionally, for at least 10 minutes. Season with salt and pepper to taste.", "While the shallot cools, place the spice blend on a plate.", "Pat the cod fillets dry with paper towels; season with salt and pepper on both sides.", "Coat 1 side of each seasoned fillet in the spice blend (tapping off any excess).", "In a medium pan (nonstick, if you have one), heat 2 teaspoons of olive oil on medium-high until hot.", "Add the fillets, coated sides down, and cook 3 to 5 minutes on the first side, or until browned.", "Flip the fillets and cook 1 to 2 minutes, or until lightly browned.", "Add the butter, garlic, dates and 1/4 cup of water to the pan; season with salt and pepper. Cook, occasionally spooning the sauce over the fillets, 2 to 3 minutes, or until the cod is coated and cooked through. Turn off the heat and top with the juice of 2 lemon wedges. Season with salt and pepper to taste.", "Reserving 2 tablespoons of the shallot pickling liquid, drain the pickled shallot.", "To the bowl of roasted potatoes, add the baby greens, pickled shallot, reserved pickling liquid, the juice of the remaining lemon wedges and a drizzle of olive oil.", "Gently toss to combine and season with salt and pepper to taste.", "Divide the finished vegetables between 2 dishes.", "Top with the finished cod fillets and sauce.", "Garnish with the almonds.", "Enjoy!"], "timeMinutes": 50}, {"name": "Vadouvan curry spice blend", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "pound", "item": "onions, cut into 1-inch pieces"}, {"amount": "1", "unit": "pound", "item": "shallots, halved"}, {"amount": "12", "unit": "", "item": "garlic cloves, peeled"}, {"amount": "1/4", "unit": "cup", "item": "vegetable oil"}, {"amount": "1", "unit": "teaspoon", "item": "fenugreek seeds"}, {"amount": "1", "unit": "tablespoon", "item": "thinly sliced fresh curry leaves (optional)"}, {"amount": "1", "unit": "tablespoon", "item": "ground cumin"}, {"amount": "1", "unit": "teaspoon", "item": "ground cardamom"}, {"amount": "1", "unit": "teaspoon", "item": "brown mustard seeds"}, {"amount": "3/4", "unit": "teaspoon", "item": "turmeric"}, {"amount": "1/2", "unit": "teaspoon", "item": "grated nutmeg"}, {"amount": "1/2", "unit": "teaspoon", "item": "hot red-pepper flakes"}, {"amount": "1/4", "unit": "teaspoon", "item": "ground cloves"}, {"amount": "1", "unit": "tablespoon", "item": "salt"}, {"amount": "1", "unit": "teaspoon", "item": "black pepper"}], "steps": ["Preheat oven to 350\u00b0F with rack in middle.", "Pulse onions in 3 batches in a food processor until very coarsely chopped (there may be a few large pieces remaining), transferring to a bowl. Repeat with shallots, then garlic.", "Heat oil in a deep 12-inch heavy nonstick skillet over high heat until it shimmers, then saut\u00e9 onions, shallots, and garlic (stir often) until golden and browned in spots, 25 to 30 minutes", "Grind fenugreek seeds in grinder or with mortar and pestle. Add to onion mixture along with remaining ingredients, and stir until combined.", "Transfer to a parchment-paper-lined large 4-sided sheet pan and spread as thinly and evenly as possible. Bake, stirring occasionally with a skewer to separate onions, until well browned and barely moist, 1 to 1 1/4 hours."]}, {"name": "Spicy salmon onigirazu", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "1", "unit": "cup", "item": "cooked sushi rice"}, {"amount": "1", "unit": "tbsp", "item": "rice vinegar"}, {"amount": "2", "unit": "tsp", "item": "sugar"}, {"amount": "1/2", "unit": "tsp", "item": "salt"}, {"amount": "1", "unit": "tbsp", "item": "mayonnaise"}, {"amount": "1", "unit": "tsp", "item": "chili sauce, such as Sriracha, sambal olek, etc"}, {"amount": "1", "unit": "tsp", "item": "toasted sesame oil"}, {"amount": "1", "unit": "can", "item": "salmon, drained"}, {"amount": "", "unit": "", "item": "lettuce"}, {"amount": "2", "unit": "", "item": "radishes, thinly sliced"}, {"amount": "1", "unit": "", "item": "sheet nori"}], "steps": ["In a small bowl, microwave vinegar, sugar, and salt on high for 20-30 seconds. Stir until salt and sugar have dissolved. While rice is still warm, add vinegar and stir for a minute or two to combine.", "In a medium bowl, stir together mayo, chili sauce, and sesame oil until combined. Season with salt to taste. Break up salmon into small pieces and add to sauce. Mix well.", "To assemble, place a piece of plastic wrap on a cutting board. Place nori sheet on top, shiny side down.", "Start by wetting your hands and taking half the rice and shaping into a dense square-shaped patty. Place in the middle of the nori, then layer lettuce, radish, salmon, lettuce, and finally top with remaining rice.", "Bring one corner of the nori to the center of the filling, then bring up the opposite corner. Be firm so that the nori closes well around the filling, but don't be so rough that the nori breaks. Repeat with remaining corners until they all meet in the center.", "Wrap plastic wrap tightly around onigirazu. Refrigerate for a few minutes to soften the nori. Wet a sharp knife and cut onigirazu in half. Unwrap and enjoy."], "timeMinutes": 15}, {"name": "Carrot soboro", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "1", "unit": "", "item": "large carrot, finely shredded or cut into matchsticks"}, {"amount": "1/4", "unit": "cup", "item": "dashi stock"}, {"amount": "1", "unit": "tsp", "item": "mirin"}, {"amount": "1", "unit": "pinch", "item": "salt"}, {"amount": "1", "unit": "tsp", "item": "soy sauce"}, {"amount": "1/2", "unit": "tsp", "item": "sugar"}], "steps": ["Put all the ingredients in a small pan and boil over high heat. Lower the heat and simmer for 4-5 minutes or until the carrot is tender. Drain and cool before packing."]}, {"name": "Tonkatsu sauce", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/2", "unit": "cup", "item": "ketchup"}, {"amount": "2", "unit": "tablespoon", "item": "soy sauce"}, {"amount": "1", "unit": "tablespoon", "item": "brown sugar"}, {"amount": "1", "unit": "tablespoon", "item": "mirin (Japanese sweet wine)"}, {"amount": "1 1/2", "unit": "teaspoon", "item": "Worcestershire sauce"}, {"amount": "1", "unit": "teaspoon", "item": "grated fresh ginger"}, {"amount": "1", "unit": "clove", "item": "garlic, minced"}], "steps": ["Mix all ingredients together and allow to sit for at least 30 minutes. Refrigerate leftovers."]}, {"name": "Kaeshi", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "3/4", "unit": "cup", "item": "mirin"}, {"amount": "3/4", "unit": "cup", "item": "granulated sugar"}, {"amount": "4 1/4", "unit": "cup", "item": "soy sauce (dark)"}], "steps": ["Put the mirin in a saucepan over high heat and bring to a boil. Lower the heat and simmer for 5-6 minutes.", "Add the sugar and stir until melted. Add the soy sauce and heat up slowly over medium-low heat, stirring several times, until the surface is barely bubbling. It should not boil vigorously or the flavor of the soy sauce will dissipate. Simmer gently for 5 minutes, skimming off any white scum that forms on the surface.", "Let cool and store in a glass jar or other nonreactive, airtight container. The kaeshi can be used immediately but is better if rested for at least a day. Store in the refrigerator or other cool, dark, place. It will keep for several months."], "timeMinutes": 15}, {"name": "Scallops over Truffled Mushroom Risotto", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "3 1/2", "unit": "cup", "item": "chicken stock"}, {"amount": "1", "unit": "clove", "item": "garlic, peeled and thinly sliced"}, {"amount": "1", "unit": "", "item": "shallot, minced"}, {"amount": "3/4", "unit": "cup", "item": "arborio rice"}, {"amount": "1/4", "unit": "cup", "item": "dry white wine"}, {"amount": "8", "unit": "oz", "item": "cremini mushrooms, sliced into 1/4-inch thick pieces"}, {"amount": "1", "unit": "", "item": "lemon, zested and juiced"}, {"amount": "1/4", "unit": "oz", "item": "fresh parsley, chopped"}, {"amount": "8", "unit": "oz", "item": "scallops, tough muscle removed if needed"}, {"amount": "2", "unit": "tbsp", "item": "butter"}, {"amount": "1/4", "unit": "cup", "item": "parmesan cheese, grated"}, {"amount": "1", "unit": "tbsp", "item": "butter"}, {"amount": "5", "unit": "tsp", "item": "truffle oil"}, {"amount": "", "unit": "", "item": "vegetable oil"}, {"amount": "", "unit": "", "item": "salt"}, {"amount": "", "unit": "", "item": "pepper"}], "steps": ["Bring stock to a boil in a medium pot. Once boiling, reduce to a low simmer. Meanwhile, prep remaining ingredients.", "Heat a drizzle of oil in a large pan over medium-high heat.", "Add mushrooms and season with salt and pepper.", "Cook, stirring occasionally, until browned and crisp, 6-8 minutes.", "Add garlic and shallot.", "Cook, stirring, until softened, 1 minute.", "Add rice; stir until translucent, 1-2 minutes.", "Add wine; stir until liquid has mostly absorbed.", "Add stock 1/2 cup at a time and stirring until liquid has mostly absorbed\u2014until rice is al dente and mixture is creamy, 25-30 minutes.", "TIP: Depending on the size of your pan, you may need a little more or a little less liquid.", "After about half of stock is used in risotto, pat scallops* dry with paper towels and season generously all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add scallops and cook until browned and cooked through, 3-5 minutes per side. Turn off heat; remove from pan and set aside, covered. Wipe out pan.", "Melt 2 tbsp butter in same pan over medium heat.", "Cook, stirring, until foamy and flecked with amber brown bits, 2-4 minutes.", "Stir in half the chopped parsley and a squeeze of lemon juice.", "Immediately transfer to a small bowl.", "Once risotto is done, stir in Parmesan, 1 tbsp plain butter, a squeeze of lemon juice, and lemon zest and truffle oil to taste.", "Season risotto with salt, pepper, and more lemon juice to taste. \u2022 Divide between bowls; top with scallops. Drizzle with as much brown butter as you like and any remaining truffle oil to taste. Garnish with remaining chopped parsley. Serve with any remaining lemon wedges on the side."], "timeMinutes": 60}, {"name": "Ancho chile paste", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "", "item": "dried ancho chilis, stems and seeds removed"}, {"amount": "4", "unit": "cup", "item": "water"}, {"amount": "1", "unit": "teaspoon", "item": "cumin"}, {"amount": "1", "unit": "teaspoon", "item": "minced garlic"}, {"amount": "1/8", "unit": "teaspoon", "item": "salt"}, {"amount": "", "unit": "", "item": "dash of pepper"}], "steps": ["Bring water to a boil either in a kettle or in the microwave. Tear dried peppers and place in a 2 cup pyrex measuring cup. Pour boiling water over peppers to cover and allow to sit 30 minutes or until softened.", "(original recipe missing a step, so I'm guessing) Place softened peppers in the bowl of a food processor. Process until a paste consistency.", "Add a bit of reserved liquid one tablespoon at a time to thin paste if necessary. Add cumin, garlic, salt, and pepper. Pulse to combine. Store in the refrigerator in a covered container for 5 days . May freeze in an ice cube tray for longer storage."]}, {"name": "Cold soba and shrimp fritter bento", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "3", "unit": "oz", "item": "dried soba noodles"}, {"amount": "1", "unit": "tbsp", "item": "kaeshi"}, {"amount": "1/4", "unit": "cup", "item": "dashi"}, {"amount": "6", "unit": "", "item": "medium size frozen shrimp, peeled and deveined"}, {"amount": "2", "unit": "", "item": "green onions, roughly chopped"}, {"amount": "1", "unit": "pinch", "item": "salt"}, {"amount": "1/8", "unit": "tsp", "item": "ground cayenne (or hot paprika), optional"}, {"amount": "1", "unit": "tbsp", "item": "furikake"}, {"amount": "2", "unit": "tbsp", "item": "tempura mix (or equal parts flour and potato starch)"}, {"amount": "1", "unit": "tbsp", "item": "water"}, {"amount": "3", "unit": "", "item": "cherry tomatoes"}, {"amount": "1/2", "unit": "", "item": "green onion, chopped"}], "steps": ["Cook soba noodles according to package directions. Rinse very well under cold water until cool and excess starch is removed. Pack into larger compartment of bento.", "Meanwhile, in a small pot, combine the kaeshi and dashi. Bring to a gentle simmer. Simmer for 2 minutes, then let cool.", "To make the shrimp fritters, roughly chop up the frozen shrimp into small pieces. Combine with the green onion, salt, cayenne, and furikake. Add the tempura mix and add just a little water so that everything is coated.", "Place a paper towel on a plate. Heat up a thin layer of olive oil in a frying pan. Drop the fritter mixture onto the hot oil with a tablespoon. Fry until crispy on both sides. Remove to paper towel-lined plate and sprinkle with salt immediately. Drain well and cool completely before packing in bento.", "(Note: you can make these fritters ahead of time and freeze them. Heat and crisp them up in a toaster oven before putting into your bento).", "Pack cooled shrimp fritters, cherry tomatoes, and chopped green onion garnish into separate compartment from the noodles. Place dipping sauce in a leak-proof container.", "To eat, you can either dip the noodles in the sauce or dump sauce over noodles. You can dip the fritters in the sauce, too."], "timeMinutes": 25}, {"name": "Seared tilapia and lemon-caper sauce", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "4", "unit": "oz", "item": "orzo pasta, dried"}, {"amount": "2", "unit": "tsp", "item": "olive oil"}, {"amount": "1", "unit": "", "item": "zucchini, quartered and cut crosswise into 1/2-inch pieces"}, {"amount": "4", "unit": "oz", "item": "sweet peppers, cut off and discard stems, remove cores, then thinly slice lengthwise"}, {"amount": "2", "unit": "clove", "item": "garlic, peeled and roughly chopped"}, {"amount": "2", "unit": "", "item": "fillets tilapia"}, {"amount": "1", "unit": "tbsp", "item": "weeknight hero spice blend"}, {"amount": "2", "unit": "tsp", "item": "olive oil"}, {"amount": "2", "unit": "tbsp", "item": "butter"}, {"amount": "1", "unit": "tbsp", "item": "capers"}, {"amount": "1", "unit": "", "item": "lemon, halved"}, {"amount": "2", "unit": "tbsp", "item": "fromage blanc, or Greek yogurt"}, {"amount": "1", "unit": "tbsp", "item": "fresh parsley, roughly chopped"}], "steps": ["Fill a medium pot with salted water; cover and heat to boiling on high. Add the **pasta** to the pot of boiling water and cook, uncovered, 7 to 9 minutes, or until tender. Turn off the heat. Drain thoroughly and return to the pot.", "While the pasta cooks in a medium pan (nonstick, if you have one), heat **2 tsp olive oil** over medium-high until hot. Add the **zucchini** in an even layer. Cook, without stirring, 2 to 3 minutes or until lightly browned.", "Add the **peppers** and **garlic**; season with salt and pepper. Cook, stirring occasionally, 2 to 3 minutes, or until the vegetables are slightly softened. Transfer to the pot of cooked pasta and stir to combine. Cover to keep warm. Wipe out the pan.", "Pat the **fish** dry with paper towels; season both sides well with salt, pepper and enough of the spice blend to coat (you may not need the full amount). In the same pan, heat **2 tsp olive oil** on medium-high until hot. Add the seasoned fish and cook 3 to 4 minutes, or until browned. Flip and cook 2 minutes.", "To the pan, add the **butter**, **capers**, and **the juice of half the lemon** (carefully, as the liquid may splatter). Cook, constantly spooning the sauce over the fish, 1 to 2 minutes, or until the fish is coated and cooked through. Turn off the heat.", "To the pot of **cooked pasta and vegetables**, add the **fromage blanc** and **the juice of the remaining lemon half**; stir to combine. Taste, then season with salt and pepper if desired.", "Serve the finished pasta topped with the cooked fish and pan sauce. Garnish with **parsley**. Enjoy!"], "timeMinutes": 35}, {"name": "Gyoza bento", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "3", "unit": "", "item": "gyoza (or other small dumpling)"}, {"amount": "1/2", "unit": "cup", "item": "sushi rice, cooked"}, {"amount": "1", "unit": "", "item": "large eggs"}, {"amount": "3/4", "unit": "tsp", "item": "sugar"}, {"amount": "1/4", "unit": "tsp", "item": "mirin"}, {"amount": "1", "unit": "pinch", "item": "salt"}, {"amount": "1/8", "unit": "tsp", "item": "soy sauce"}, {"amount": "1", "unit": "", "item": "chikuwa, thawed"}, {"amount": "1/4", "unit": "", "item": "Persian cucumbers, see instructions for prep note"}, {"amount": "1/4", "unit": "cup", "item": "broccoli, blanched"}, {"amount": "3", "unit": "", "item": "grape tomatoes"}, {"amount": "", "unit": "", "item": "soy sauce, or other dipping sauce"}, {"amount": "", "unit": "", "item": "furikake"}], "steps": ["Fill up half of the bento box with Japanese rice. Let it cool so that hot/warm rice will not warm up other cool food.", "Pan fry leftover gyoza or bake in a toaster oven until it's warm. Allow to cool.", "Mix together tamagoyaki ingredients until combined. See for cooking instructions: https://www.xanthir.com/recipes/showrecipe.php?id=id451", "Slice cucumber lengthwise into thin sticks to fit inside chikuwa. Put cucumber inside chikuwa then slice at an angle into 3-4 pieces.", "Pack cooled gyoza, tamagoyaki, and chikuwa cucumber. Fill empty spaces with blanched broccoli and tomatoes.", "Sprinkle furikake on top of slightly cooled rice.", "Pack soy sauce or other dipping sauce in a sauce container.", "Cool down completely before closing the bento box."], "timeMinutes": 35}, {"name": "Yakiniku sauce", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "1/4", "unit": "", "item": "medium yellow onion, 75 g; grated, with juice"}, {"amount": "3", "unit": "clove", "item": "garlic, pressed"}, {"amount": "1/8", "unit": "tsp", "item": "ginger, grated"}, {"amount": "1/4", "unit": "tsp", "item": "gochujang"}, {"amount": "1/4", "unit": "cup", "item": "soy sauce"}, {"amount": "2", "unit": "tbsp", "item": "sugar"}, {"amount": "1/2", "unit": "tbsp", "item": "toasted white sesame seeds"}, {"amount": "1", "unit": "tsp", "item": "toasted sesame oil"}], "steps": ["Transfer the **grated onion and all of its juice** to a mason jar or microwave-safe container.", "Add the **pressed garlic**, **grated ginger**, **gochujang**, **soy sauce**, **sugar**, and **sesame seeds**.", "Microwave the sauce for 30\u201335 seconds until it's hot enough to dissolve the sugar.", "Add **toasted sesame oil** and mix well.", "The Yakiniku Sauce is now ready to use.", "Full recipe yield about 1/3 cup."], "timeMinutes": 10}, {"name": "Okra with ginger soy sauce", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "9", "unit": "oz", "item": "okra"}, {"amount": "1", "unit": "tsp", "item": "kosher salt"}, {"amount": "2", "unit": "tbsp", "item": "soy sauce"}, {"amount": "1/2", "unit": "tsp", "item": "ginger, grated or minced with juice"}], "steps": ["Gather all the ingredients. Bring a medium pot of water to a boil over medium-high heat.", "To Make the Ginger Soy Sauce\nIn a large bowl, combine **soy sauce** and the **grated ginger**. Taste it and add more grated ginger or ginger juice (which has a milder taste than the ginger bits) if desired. Set aside.", "To Prepare the Okra\nWith a knife, cut off the stems of the **okra** but **don\u2018t remove the entire top**. Then, peel off the tough calyx around the top of the okra.", "Sprinkle **kosher salt** over the okra and rub them between your hands and the cutting board (or tray) for 15\u201320 seconds. You don\u2018t need to rinse the salt.", "The water should be boiling by now. Blanch the okra in the boiling water for 2\u20133 minutes. If the okra are small, blanch them for 1\u20132 minutes. If they are big, blanch for 3\u20134 minutes. Drain the okra in a sieve as soon as they are tender. Be careful not to overcook.", "To Dress the Okra\nCut the **okra** diagonally in half or thirds depending on their length. They should be bite-sized pieces. Transfer the okra to the bowl with the **ginger soy sauce**.", "Dress the okra with the sauce. You can serve them chilled or at room temperature. Serve the okra on individual plates.", "To Store\nYou can keep the leftovers in an airtight container and store in the refrigerator for up to 2 days."], "timeMinutes": 7}, {"name": "Weeknight Hero spice blend", "category": "Main Dish", "dietary": ["vegetarian"], "ingredients": [{"amount": "2", "unit": "tbsp", "item": "garlic powder"}, {"amount": "2", "unit": "tbsp", "item": "onion powder"}, {"amount": "2", "unit": "tbsp", "item": "smoked paprika"}, {"amount": "2", "unit": "tbsp", "item": "dried parsley"}], "steps": ["In a small bowl, mix all ingredients. Use a funnel to transfer to a spice jar for storage."]}, {"name": "Aguachile Rojo", "category": "Main Dish", "dietary": [], "ingredients": [{"amount": "1", "unit": "lb", "item": "large shrimp, peeled & deveined"}, {"amount": "1 1/2", "unit": "cup", "item": "fresh lime juice"}, {"amount": "2", "unit": "", "item": "red Fresno peppers (or jalapeno), stems removed but seeds/vanes kept"}, {"amount": "1", "u // ── State ──────────────────────────────────────────────────────────────────
let favorites       = new Set();
let activeTab       = 'home';
let favLayout       = 'grid';
let searchMode      = 'name';
let nameQuery       = '';
let activeDietFilter = '';    // '' | 'vegetarian'
let activeTimeFilter = '';    // '' | '30' | '60'
let selectedIngredients = [];
let ingredientResults   = null;
let modalIdx = null;

// ── Filter logic ───────────────────────────────────────────────────────────
function applyFilters(list) {
  // list: array of { r, i }
  return list.filter(({ r }) => {
    if (activeDietFilter && !(r.dietary || []).includes(activeDietFilter)) return false;
    if (activeTimeFilter) {
      if (!r.timeMinutes) return false;         // skip unknowns when time filter on
      if (r.timeMinutes > Number(activeTimeFilter)) return false;
    }
    return true;
  });
}

// ── Helpers ────────────────────────────────────────────────────────────────
function tagClass(cat) {
  return 'tag tag-' + cat.replace(/\s+/g, '-').replace(/[&]/g, '-');
}
function ingredientLabel(ing) {
  return { measure: [ing.amount, ing.unit].filter(Boolean).join(' '), item: ing.item };
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(idx) {
  const recipe = RECIPES[idx];
  modalIdx = idx;
  document.getElementById('modalName').textContent = recipe.name;
  const tagEl = document.getElementById('modalTag');
  tagEl.className = tagClass(recipe.category);
  tagEl.textContent = recipe.category;
  const timeEl = document.getElementById('modalTime');
  if (recipe.timeMinutes) { timeEl.textContent = recipe.timeMinutes + ' min'; timeEl.style.display = ''; }
  else { timeEl.style.display = 'none'; }
  document.getElementById('modalHeart').classList.toggle('loved', favorites.has(idx));

  const ingList = document.getElementById('modalIngredients');
  ingList.innerHTML = recipe.ingredients.map((ing, i) => {
    const { measure, item } = ingredientLabel(ing);
    return `<li class="ingredient-item"><input type="checkbox" id="mchk-${idx}-${i}"><span class="ingredient-amount">${measure}</span><span class="ingredient-item-name">${item}</span></li>`;
  }).join('');
  ingList.querySelectorAll('.ingredient-item').forEach(li => {
    li.addEventListener('click', e => {
      const cb = li.querySelector('input');
      if (e.target !== cb) cb.checked = !cb.checked;
      li.classList.toggle('checked', cb.checked);
    });
  });
  ingList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', () => cb.closest('.ingredient-item').classList.toggle('checked', cb.checked));
  });
  document.getElementById('modalSteps').innerHTML = recipe.steps.map((step, i) =>
    `<li class="step-item"><span class="step-num">${i + 1}</span><span>${step}</span></li>`
  ).join('');
  document.getElementById('modalBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  document.body.style.overflow = '';
  modalIdx = null;
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBackdrop')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('modalHeart').addEventListener('click', () => {
  if (modalIdx === null) return;
  const heartEl = document.getElementById('modalHeart');
  if (favorites.has(modalIdx)) { favorites.delete(modalIdx); heartEl.classList.remove('loved'); }
  else { favorites.add(modalIdx); heartEl.classList.add('loved'); }
  syncCardHeart(modalIdx);
  if (activeTab === 'saved') renderSaved();
});

// ── Cards ──────────────────────────────────────────────────────────────────
function buildCard(recipe, idx) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.idx = idx;
  const timeStr  = recipe.timeMinutes ? `<span class="card-time">&#9201; ${recipe.timeMinutes} min</span>` : '';
  const dietBadge = (recipe.dietary || []).includes('vegetarian')
    ? '<span style="font-size:0.72rem;color:#2a6035">&#127807;</span>' : '';
  card.innerHTML = `
    <div class="card-header">
      <div class="card-header-text">
        <div class="card-name">${recipe.name}</div>
        <div class="card-meta">
          <span class="${tagClass(recipe.category)}">${recipe.category}</span>
          ${timeStr} ${dietBadge}
        </div>
      </div>
      <button class="heart-btn ${favorites.has(idx) ? 'loved' : ''}" title="Save">&#9829;</button>
    </div>
    <div class="open-hint">Tap to open &rarr;</div>`;
  card.addEventListener('click', e => { if (!e.target.closest('.heart-btn')) openModal(idx); });
  card.querySelector('.heart-btn').addEventListener('click', e => {
    e.stopPropagation();
    toggleFav(idx, e.currentTarget);
  });
  return card;
}
function buildListItem(recipe, idx) {
  const item = document.createElement('div');
  item.className = 'list-item';
  const dietBadge = (recipe.dietary || []).includes('vegetarian') ? ' &#127807;' : '';
  item.innerHTML = `
    <div class="list-item-text">
      <div class="list-item-name">${recipe.name}${dietBadge}</div>
      <div class="list-item-meta">
        <span class="${tagClass(recipe.category)}">${recipe.category}</span>
        ${recipe.timeMinutes ? `<span class="list-item-time">&#9201; ${recipe.timeMinutes} min</span>` : ''}
      </div>
    </div>
    <button class="list-item-heart ${favorites.has(idx) ? 'loved' : ''}" title="Save">&#9829;</button>
    <span class="list-item-arrow">&#8250;</span>`;
  item.addEventListener('click', e => { if (!e.target.closest('.list-item-heart')) openModal(idx); });
  item.querySelector('.list-item-heart').addEventListener('click', e => {
    e.stopPropagation();
    toggleFav(idx, e.currentTarget);
    if (activeTab === 'saved') renderSaved();
  });
  return item;
}
function toggleFav(idx, btn) {
  if (favorites.has(idx)) { favorites.delete(idx); btn.classList.remove('loved'); }
  else { favorites.add(idx); btn.classList.add('loved'); }
  syncCardHeart(idx);
}
function syncCardHeart(idx) {
  document.querySelectorAll(`.card[data-idx="${idx}"] .heart-btn`).forEach(b =>
    b.classList.toggle('loved', favorites.has(idx))
  );
}

// ── Tab switching ──────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
  document.querySelectorAll('.tab-view').forEach(v => v.classList.toggle('active', v.dataset.tab === tab));
  if (tab === 'home')   renderHome();
  if (tab === 'saved')  renderSaved();
  if (tab === 'search') renderSearchResults();
}
document.querySelector('.bottom-nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (item) switchTab(item.dataset.tab);
});

// ── Home tab ───────────────────────────────────────────────────────────────
const CATEGORY_ORDER = [
  'Breakfast','Quick Meal','Main Dish','Pasta & Noodles','Side Dish',
  'Soup & Stew','Salad','Vegetarian','Snack & Appetizer',
  'Bread & Baking','Dessert','Drink'
];

function renderHome() {
  const container = document.getElementById('homeContent');
  container.innerHTML = '';
  const allIndexed = RECIPES.map((r, i) => ({ r, i }));
  const filtered   = applyFilters(allIndexed);

  const cats = CATEGORY_ORDER.filter(c => filtered.some(({ r }) => r.category === c));
  if (!cats.length) {
    container.innerHTML = `<div class="empty-msg">No recipes match these filters — try adjusting them.</div>`;
    return;
  }

  cats.forEach((cat, ci) => {
    const recipes = filtered.filter(({ r }) => r.category === cat);
    const section = document.createElement('div');
    section.className = 'cat-section';
    section.innerHTML = `<div class="cat-header"><span class="cat-title">${cat}</span><span class="cat-count">${recipes.length} recipe${recipes.length !== 1 ? 's' : ''}</span></div>`;
    const row = document.createElement('div');
    row.className = 'cat-row';
    recipes.forEach(({ r, i }) => row.appendChild(buildCard(r, i)));
    section.appendChild(row);
    if (ci < cats.length - 1) {
      const d = document.createElement('div'); d.className = 'cat-section-divider'; section.appendChild(d);
    }
    container.appendChild(section);
  });
}

// ── Home filter bar events ─────────────────────────────────────────────────
document.getElementById('homeFilterBar').addEventListener('click', e => {
  const pill = e.target.closest('.filter-pill');
  if (pill) {
    if ('diet' in pill.dataset) {
      activeDietFilter = pill.dataset.diet;
      document.querySelectorAll('[data-diet]').forEach(p => p.classList.toggle('active', p.dataset.diet === activeDietFilter));
    } else if ('time' in pill.dataset) {
      activeTimeFilter = pill.dataset.time;
      document.querySelectorAll('[data-time]').forEach(p => p.classList.toggle('active', p.dataset.time === activeTimeFilter));
    }
    if (activeTab === 'home') renderHome();
  }
});

// ── Surprise me ────────────────────────────────────────────────────────────
document.getElementById('surpriseBtn').addEventListener('click', () => {
  const pool = applyFilters(RECIPES.map((r, i) => ({ r, i })));
  if (!pool.length) return;
  const { i } = pool[Math.floor(Math.random() * pool.length)];
  openModal(i);
});

// ── Saved tab ──────────────────────────────────────────────────────────────
function renderSaved() {
  const container = document.getElementById('favContent');
  container.innerHTML = '';
  const favList = [...favorites];
  if (!favList.length) {
    container.innerHTML = `<div class="empty-msg">No saved recipes yet — tap &#9829; on any recipe to save it here.</div>`;
    return;
  }
  if (favLayout === 'grid') {
    const grid = document.createElement('div');
    grid.className = 'grid';
    favList.forEach(i => grid.appendChild(buildCard(RECIPES[i], i)));
    container.appendChild(grid);
  } else {
    const list = document.createElement('div');
    list.className = 'list-view';
    favList.forEach(i => list.appendChild(buildListItem(RECIPES[i], i)));
    container.appendChild(list);
  }
}
document.querySelector('.layout-toggle').addEventListener('click', e => {
  const btn = e.target.closest('.layout-btn');
  if (!btn) return;
  favLayout = btn.dataset.layout;
  document.querySelectorAll('.layout-btn').forEach(b => b.classList.toggle('active', b.dataset.layout === favLayout));
  renderSaved();
});

// ── Search tab ─────────────────────────────────────────────────────────────
function renderSearchResults() {
  const grid = document.getElementById('searchGrid');
  grid.innerHTML = '';
  if (searchMode === 'name') {
    if (!nameQuery) {
      grid.innerHTML = `<div class="empty-msg" style="font-style:normal;font-size:1rem">Type a recipe name above &#x1F373;</div>`;
      return;
    }
    const q = nameQuery.toLowerCase();
    const matches = RECIPES.map((r, i) => ({ r, i })).filter(({ r }) => r.name.toLowerCase().includes(q));
    if (!matches.length) { grid.innerHTML = `<div class="empty-msg">No recipes matching "${nameQuery}"</div>`; return; }
    matches.forEach(({ r, i }) => grid.appendChild(buildCard(r, i)));
  } else {
    if (!ingredientResults) {
      grid.innerHTML = `<div class="empty-msg" style="font-style:normal;font-size:1rem">Pick ingredients above, then tap <strong>Find Recipes</strong> &#x1F373;</div>`;
      return;
    }
    const results = ingredientResults.filter(r => r.matchCount > 0);
    if (!results.length) { grid.innerHTML = `<div class="empty-msg">No matches — try fewer ingredients.</div>`; return; }
    results.forEach(({ r, i, matchCount, total }) => {
      const card = buildCard(r, i);
      const badge = document.createElement('div');
      badge.className = 'match-badge';
      badge.textContent = `✓ matches ${matchCount} of ${total} ingredient${total !== 1 ? 's' : ''} you have`;
      card.appendChild(badge);
      grid.appendChild(card);
    });
  }
}
document.getElementById('nameInput').addEventListener('input', e => {
  nameQuery = e.target.value.trim();
  renderSearchResults();
});
document.querySelector('.search-mode-pills').addEventListener('click', e => {
  const pill = e.target.closest('.mode-pill');
  if (!pill) return;
  searchMode = pill.dataset.mode;
  document.querySelectorAll('.mode-pill').forEach(p => p.classList.toggle('active', p.dataset.mode === searchMode));
  const ingPicker = document.getElementById('ingPickerSection');
  const nameInput = document.getElementById('nameInput');
  if (searchMode === 'ingredient') {
    ingPicker.style.display = '';
    nameInput.placeholder = 'Ingredient search active below ↓';
    nameInput.disabled = true;
  } else {
    ingPicker.style.display = 'none';
    nameInput.placeholder = 'Search recipes by name…';
    nameInput.disabled = false;
  }
  renderSearchResults();
});

// ── Ingredient picker ──────────────────────────────────────────────────────
const ALL_INGREDIENTS = (() => {
  const seen = new Set();
  RECIPES.forEach(recipe => {
    recipe.ingredients.forEach(ing => {
      if (!ing.item) return;
      const core = ing.item.toLowerCase().replace(/,.*/, '').replace(/\(.*\)/, '').trim();
      if (core.length > 1) seen.add(core);
    });
  });
  return [...seen].sort();
})();

function scoreRecipe(recipe, selected) {
  let count = 0;
  selected.forEach(sel => {
    if (recipe.ingredients.some(ing => ing.item.toLowerCase().includes(sel.toLowerCase()))) count++;
  });
  return count;
}
function highlight(text, query) {
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + '<em>' + text.slice(idx, idx + query.length) + '</em>' + text.slice(idx + query.length);
}
const ingInput    = document.getElementById('ingInput');
const ingDropdown = document.getElementById('ingDropdown');
const ingPills    = document.getElementById('ingPills');
const ingFindBtn  = document.getElementById('ingFindBtn');

function renderPills() {
  ingPills.innerHTML = '';
  selectedIngredients.forEach((name, idx) => {
    const pill = document.createElement('span');
    pill.className = 'ing-pill';
    pill.innerHTML = `${name} <button class="ing-pill-remove" data-idx="${idx}">&#10005;</button>`;
    ingPills.appendChild(pill);
  });
  ingFindBtn.disabled = selectedIngredients.length === 0;
}
function showSuggestions(query) {
  if (!query) { ingDropdown.classList.remove('open'); return; }
  const matches = ALL_INGREDIENTS.filter(n => n.includes(query.toLowerCase()) && !selectedIngredients.includes(n)).slice(0, 12);
  if (!matches.length) { ingDropdown.classList.remove('open'); return; }
  ingDropdown.innerHTML = matches.map(n => `<div class="ing-suggestion" data-name="${n}">${highlight(n, query)}</div>`).join('');
  ingDropdown.classList.add('open');
}
function addIngredient(name) {
  if (!selectedIngredients.includes(name)) { selectedIngredients.push(name); ingredientResults = null; renderPills(); }
  ingInput.value = ''; ingDropdown.classList.remove('open'); ingInput.focus();
}
ingInput.addEventListener('input', () => showSuggestions(ingInput.value.trim()));
ingInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const f = ingDropdown.querySelector('.ing-suggestion'); if (f) addIngredient(f.dataset.name); }
  if (e.key === 'Escape') ingDropdown.classList.remove('open');
});
ingDropdown.addEventListener('click', e => { const s = e.target.closest('.ing-suggestion'); if (s) addIngredient(s.dataset.name); });
ingPills.addEventListener('click', e => {
  const btn = e.target.closest('.ing-pill-remove');
  if (btn) { selectedIngredients.splice(Number(btn.dataset.idx), 1); ingredientResults = null; renderPills(); renderSearchResults(); }
});
ingFindBtn.addEventListener('click', () => {
  if (!selectedIngredients.length) return;
  const total = selectedIngredients.length;
  ingredientResults = RECIPES
    .map((r, i) => ({ r, i, matchCount: scoreRecipe(r, selectedIngredients), total }))
    .filter(x => x.matchCount > 0)
    .sort((a, b) => b.matchCount - a.matchCount);
  renderSearchResults();
});
document.addEventListener('click', e => {
  if (!ingInput.contains(e.target) && !ingDropdown.contains(e.target)) ingDropdown.classList.remove('open');
});

// ── Init ───────────────────────────────────────────────────────────────────
renderHome();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/ate/sw.js').catch(() => {}));
}
</script>

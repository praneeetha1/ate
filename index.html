<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeToCook</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:     #FDF6E3;
      --paper:     #FAF0D7;
      --card:      #FFFDF7;
      --warm-tan:  #E8D5B0;
      --border:    #D9C99A;
      --accent:    #C2885A;
      --accent-dk: #A0673B;
      --text:      #3D2B1F;
      --muted:     #7A6047;
      --heart:     #C0392B;
      --shadow:    rgba(100, 70, 30, 0.12);
    }

    body {
      background-color: var(--cream);
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180,150,90,0.07) 28px),
        repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(180,150,90,0.04) 28px);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--paper);
      border-bottom: 2px solid var(--border);
      padding: 28px 24px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 600;
      color: var(--accent-dk);
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .logo span {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    .tagline {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 18px 20px 14px;
      background: var(--cream);
      border-bottom: 1px solid var(--warm-tan);
      position: sticky;
      top: 102px;
      z-index: 90;
    }
    .filter-btn {
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-family: 'Lato', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent-dk); }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .filter-btn.fav-btn { border-color: var(--heart); color: var(--heart); }
    .filter-btn.fav-btn.active { background: var(--heart); border-color: var(--heart); color: #fff; }

    /* ── Main grid ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .count-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
      margin-bottom: 16px;
      letter-spacing: 0.06em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--muted);
    }

    /* ── Category tag colors ── */
    .tag { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; border-radius: 12px; }
    .tag-Breakfast      { background: #FDE9C5; color: #8B5C00; }
    .tag-Dessert        { background: #F9D8E0; color: #8B2040; }
    .tag-Main-Dish      { background: #D5EBD8; color: #2A6035; }
    .tag-Side-Dish      { background: #D8EDF5; color: #1A5470; }
    .tag-Soup--Stew     { background: #F5E2CB; color: #7A3D10; }
    .tag-Salad          { background: #DFF2DA; color: #2A5E30; }
    .tag-Quick-Meal     { background: #EDE2F5; color: #5A2A80; }
    .tag-Vegetarian     { background: #D8F0E5; color: #1A6040; }
    .tag-Snack--Appetizer { background: #FFF0C5; color: #7A5A00; }
    .tag-Drink          { background: #D8E8FF; color: #1A3A80; }

    /* ── Recipe card (preview only — details open in modal) ── */
    .card {
      background: var(--card);
      border: 1.5px solid var(--warm-tan);
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.22s, border-color 0.22s, transform 0.18s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .card:hover {
      box-shadow: 0 8px 24px var(--shadow);
      border-color: var(--accent);
      transform: translateY(-3px);
    }
    .card-header {
      padding: 18px 18px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      user-select: none;
    }
    .card-header-text { flex: 1; min-width: 0; }
    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 8px;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-time {
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .card-time::before { content: "\2023"; margin-right: 2px; font-size: 0.9em; }
    .open-hint {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      padding: 10px 18px 14px;
      border-top: 1px dashed var(--warm-tan);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .card:hover .open-hint { opacity: 1; }
    .heart-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--warm-tan);
      transition: color 0.2s, transform 0.15s;
      padding: 2px 4px;
      flex-shrink: 0;
    }
    .heart-btn:hover { transform: scale(1.2); color: #e8a0a0; }
    .heart-btn.loved { color: var(--heart); }

    /* ── Modal overlay ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(60, 35, 15, 0.55);
      backdrop-filter: blur(3px);
      z-index: 500;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px 32px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(60, 35, 15, 0.35);
      width: 100%;
      max-width: 640px;
      margin: auto;
      animation: modalIn 0.25s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(16px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }
    .modal-top {
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--warm-tan);
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .modal-title-block { flex: 1; }
    .modal-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: 10px;
    }
    .modal-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .modal-time {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .modal-time::before { content: "\23F1  "; }
    .modal-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-heart {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--warm-tan);
      cursor: pointer;
      transition: color 0.2s, transform 0.15s;
      padding: 4px;
    }
    .modal-heart:hover { transform: scale(1.15); color: #e8a0a0; }
    .modal-heart.loved { color: var(--heart); }
    .modal-close {
      background: var(--paper);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .modal-close:hover { background: var(--warm-tan); color: var(--text); }
    .modal-body { padding: 22px 22px 26px; }

    /* ── Ingredients ── */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-dk);
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border);
    }
    .ingredients-list {
      list-style: none;
      margin-bottom: 20px;
    }
    .ingredient-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(200, 180, 130, 0.25);
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .ingredient-item:last-child { border-bottom: none; }
    .ingredient-item.checked { opacity: 0.45; }
    .ingredient-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-top: 1px;
      cursor: pointer;
    }
    .ingredient-amount {
      color: var(--accent-dk);
      font-weight: 700;
      min-width: 60px;
      flex-shrink: 0;
    }
    .ingredient-item-name { color: var(--text); }

    /* ── Steps ── */
    .steps-list { list-style: none; }
    .step-item {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 0.88rem;
      line-height: 1.6;
    }
    .step-num {
      background: var(--accent);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .logo { font-size: 1.9rem; }
      .filter-bar { top: 90px; }
      .grid { grid-template-columns: 1fr; }
    }
  
    /* ── Ingredient search panel ── */
    .ing-search-panel {
      display: none;
      background: var(--paper);
      border-bottom: 2px solid var(--warm-tan);
      padding: 18px 20px 16px;
    }
    .ing-search-panel.visible { display: block; }

    .ing-search-wrap {
      max-width: 560px;
      margin: 0 auto;
      position: relative;
    }
    .ing-search-label {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-dk);
      margin-bottom: 10px;
      display: block;
    }
    .ing-input-row {
      display: flex;
      gap: 8px;
    }
    .ing-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      font-family: 'Lato', sans-serif;
      font-size: 0.92rem;
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border-color 0.18s;
    }
    .ing-input:focus { border-color: var(--accent); }
    .ing-input::placeholder { color: var(--muted); }

    .ing-find-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-family: 'Lato', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.18s;
      white-space: nowrap;
    }
    .ing-find-btn:hover { background: var(--accent-dk); }
    .ing-find-btn:disabled { opacity: 0.45; cursor: default; }

    /* Autocomplete dropdown */
    .ing-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 60px; /* don't cover the Find button */
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px var(--shadow);
      max-height: 200px;
      overflow-y: auto;
      z-index: 200;
    }
    .ing-dropdown.open { display: block; }
    .ing-suggestion {
      padding: 9px 14px;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text);
      border-bottom: 1px solid rgba(200,180,130,0.2);
      transition: background 0.12s;
    }
    .ing-suggestion:last-child { border-bottom: none; }
    .ing-suggestion:hover, .ing-suggestion.active { background: var(--paper); }
    .ing-suggestion em {
      color: var(--accent-dk);
      font-style: normal;
      font-weight: 700;
    }

    /* Selected ingredient pills */
    .ing-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
      min-height: 0;
    }
    .ing-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--warm-tan);
      color: var(--accent-dk);
      border-radius: 20px;
      padding: 4px 10px 4px 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .ing-pill-remove {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .ing-pill-remove:hover { color: var(--heart); }

    /* Clear link */
    .ing-clear-row {
      text-align: center;
      margin-top: 10px;
    }
    .ing-clear-btn {
      background: none;
      border: none;
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      font-family: 'Lato', sans-serif;
      transition: color 0.15s;
    }
    .ing-clear-btn:hover { color: var(--accent-dk); }

    /* Match badge on results */
    .match-badge {
      font-size: 0.72rem;
      color: var(--accent-dk);
      background: var(--paper);
      border-top: 1px dashed var(--border);
      padding: 6px 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Time<span>To</span>Cook</div>
  <div class="tagline">Your cozy recipe companion</div>
</header>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all">All Recipes</button>
  <button class="filter-btn fav-btn" data-filter="favorites">♥ Favorites</button>
  <button class="filter-btn" data-filter="ingredient-search" id="ingSearchTab">🔍 What can I make?</button>
</div>

<div class="ing-search-panel" id="ingSearchPanel">
  <div class="ing-search-wrap">
    <label class="ing-search-label" for="ingInput">What ingredients do you have?</label>
    <div class="ing-input-row" style="position:relative">
      <input class="ing-input" id="ingInput" type="text"
             placeholder="e.g. garlic, eggs, butter…" autocomplete="off">
      <button class="ing-find-btn" id="ingFindBtn">Find Recipes</button>
      <div class="ing-dropdown" id="ingDropdown"></div>
    </div>
    <div class="ing-pills" id="ingPills"></div>
    <div class="ing-clear-row">
      <button class="ing-clear-btn" id="ingClearBtn">✕ Clear search &amp; go back</button>
    </div>
  </div>
</div>

<main>
  <div class="count-label" id="countLabel"></div>
  <div class="grid" id="grid"></div>
</main>


<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-top">
      <div class="modal-title-block">
        <div class="modal-name" id="modalName"></div>
        <div class="modal-meta">
          <span id="modalTag"></span>
          <span class="modal-time" id="modalTime" style="display:none"></span>
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-heart" id="modalHeart" title="Favorite">&#9829;</button>
        <button class="modal-close" id="modalClose" title="Close">&times;</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="section-title">Ingredients</div>
      <ul class="ingredients-list" id="modalIngredients"></ul>
      <div class="section-title">Steps</div>
      <ol class="steps-list" id="modalSteps"></ol>
    </div>
  </div>
</div>

ff any excess, and into the breadcrumbs, patting them over both sides and pressing down quite firmly.", "Gently shake off any excess and put the meat on a board or clean plate ready to be cooked.", "Heat a heavy frying pan, add a couple of good glugs of olive oil and, when it's good and hot, put both pieces of pork into the pan.", "Cook for 2 minutes or so, then carefully start to shake and agitate the pan to cover them in the hot oil.", "Turn the pork over and continue to cook for a couple of minutes until both sides are crisp and golden brown.", "Remove to a tray line with paper towels and season with salt and pepper.", "Put a schnitzel on to each of your serving plates.", "Put a little pile of cornichon matchsticks and some watercress leaves on top and serve with a big lob of apple sauce, a squeeze of lemon juice and a drizzle of extra virgin olive oil."], "timeMinutes": 25}, {"name": "Oregano Marinated Chicken", "category": "Main Dish", "ingredients": [{"amount": "4", "unit": "", "item": "(6 to 7-ounce) boneless skinless chicken breasts"}, {"amount": "10", "unit": "", "item": "grinds black pepper"}, {"amount": "1/2", "unit": "tsp", "item": "salt"}, {"amount": "2", "unit": "tablespoon", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "teaspoon", "item": "dried oregano"}, {"amount": "1", "unit": "", "item": "lemon, juiced"}], "steps": ["To marinate the chicken: In a non-reactive dish, combine the lemon juice, olive oil, oregano, salt, and pepper and mix together.", "Add the chicken breasts to the dish and rub both sides in the mixture.", "Cover the dish with plastic wrap and let marinate in the refrigerator for at least 30 minutes and up to 4 hours.", "To cook the chicken: Heat a nonstick skillet or grill pan over high heat. Add the chicken breasts and cook, turning once, until well browned, about 4 to 5 minutes on each side or until cooked through. Let the chicken rest on a cutting board for a few minutes before slicing it into thin strips."], "timeMin bake until toasted 7 to 10 minutes.", "Let cool, then finely chop and transfer to a bowl.", "Add the cayenne, lemon juice, honey, roasted red pepper, walnut oil, olive oil and parsley.", "Add salt and black pepper to taste and toss to combine. (The relish can be made up to 1 day ahead; cover and refrigerate.)", "Make the salmon: Raise the oven temperature to 425.", "Combine the remaining olive oil and parsley, the chives, lemon zest, salt and black pepper to taste in a bowl.", "Rub the herb mixture *all* over the salmon.", "Lay skin-side down in a baking dish and roast until just cooking through, 12 to 14 minutes (for 3 lbs).", "Let rest 5 minutes, then transfer to a platter and top with the relish."], "timeMinutes": 35}, {"name": "Strawberries Romanov (La Madeleine copycat)", "category": "Dessert", "ingredients": [{"amount": "2", "unit": "tbsp", "item": "powdered sugar"}, {"amount": "1/2", "unit": "pt", "item": "heavy whipping cream"}, {"amount": "1", "unit": "lb", "item": "strawberries, (2 pints)"}, {"amount": "4", "unit": "tbsp", "item": "brandy"}], "steps": ["Wash strawberries and cut the tops off. Let strawberries drain.  Mix together heavy whipping cream, powdered sugar, and the brandy. Beat with a mixer till this becomes thick.  Place strawberries into glasses and spoon over the sauce."]}, {"name": "John Thorne's Pecan Pie", "category": "Dessert", "ingredients": [{"amount": "1/4", "unit": "tsp", "item": "salt"}, {"amount": "3", "unit": "", "item": "eggs"}, {"amount": "4", "unit": "tbsp", "item": "butter"}, {"amount": "2", "unit": "tbsp", "item": "dark rum"}, {"amount": "2/3", "unit": "cup", "item": "golden syrup"}, {"amount": "1", "unit": "cup", "item": "dark brown sugar, well-packed"}, {"amount": "2", "unit": "cup", "item": "pecans, chopped"}, {"amount": "9", "unit": "", "item": "-inch unbaked pie shell"}], "steps": ["Preheat oven to 350F.", "In a large saucepan, heat the brown sugar, golden syrup and butter to the boiling point.", "Stirring constantly and scraping back any foam that clings to the side of the pan, let this mixture boil for about 1 minute.", "Remove from the heat and let cool while, in a separate bowl, you beat the eggs until creamy.", "When the boiled syrup has cooled, beat in the eggs, salt and pecans. Pour into the unbaked pie shell and bake for about 50 minutes.", "Notes:", "* A little cream (about 1/4 to 1/2 cup) mixed into a pecan pie filling before baking gives it a richer, lighter texture.", "* For a sweeter, lighter pie: add more sugar and use fewer pecans; for a denser, less sweet pie: add more pecans and use less sugar.", "* The buttery flavour and the lard-induced flakiness of a butter and lard crust make it the perfect one for a perfect pecan pie.", "And a Southern pecan pie authority I know suggests that you roll out the dough a little thicker than usual; a thick, richly shortened crust provides an appetizing balance to the sweetness of the filling."]}, {"name": "Godiva Angel Pie", "category": "Dessert", "ingredients": [{"amount": "4", "unit": "", "item": "(1 oz.) squares Godiva cooking chocolate or 4 oz. Baker's German sweet chocolate"}, {"amount": "1/2", "unit": "tsp", "item": "vanilla"}, {"amount": "1", "unit": "cup", "item": "pecans, finely chopped"}, {"amount": "1/2", "unit": "cup", "item": "sugar"}, {"amount": "1/8", "unit": "tsp", "item": "cream of tartar"}, {"amount": "1/8", "unit": "tsp", "item": "salt"}, {"amount": "2", "unit": "", "item": "egg whites, at room temperature"}, {"amount": "3", "unit": "tbsp", "item": "water"}, {"amount": "1", "unit": "tsp", "item": "vanilla"}, {"amount": "1", "unit": "cup", "item": "heavy cream, whipped"}], "steps": ["TO MAKE SHELL: Preheat oven to 300 degrees.", "In mixer bowl, beat egg whites until foamy.", "Beat in salt and cream of tartar and beat until soft peaks form.", "Add sugar, a tablespoon at a time, beating after each addition.", "Continue until very stiff peaks form.", "Fold in nuts and vanilla.", "Lightly butter a metal 8-inch pie plate. (Do NOT use glass.) Spoon meringue into pan lightly, building up the edges to come at least 1/2 inch above the side of the pan.", "Bake in preheated 300 degree oven for 35 to 40 minutes until light brown.", "Cool completely before adding filling.", "TO MAKE FILLING: Melt chocolate and water in a pan over hot, but not boiling, water, stirring occasionally, to blend.", "Add vanilla and chocolate mixture (cooled) to whipped cream and pile into meringue shell, swirling top with spatula.", "Be sure to cool the chocolate mixture before adding to the whipped cream.", "If it is too warm, the mixture will thin out.", "If this happens, chill until it is thick enough to put in shell."]}, {"name": "Onion Pie", "category": "Dessert", "ingredients": [{"amount": "1/2", "unit": "cup", "item": "grated Parmesan cheese"}, {"amount": "1/2", "unit": "", "item": "stack Keebler Club Crackers, crushed"}, {"amount": "2", "unit": "", "item": "eggs"}, {"amount": "1", "unit": "cup", "item": "milk"}, {"amount": "1/2", "unit": "teaspoon", "item": "crushed red pepper flakes, or to taste"}, {"amount": "1/2", "unit": "cup", "item": "butter, divided use"}, {"amount": "3", "unit": "", "item": "large onions"}], "steps": ["Preheat the oven to 400 degrees halfway through onion cooking.", "Slice the onions and saute in 4 tablespoons butter over medium-low heat; the longer you cook them - as long as 35 minutes - the sweeter they will be.  Sprinkle in crushed red pepper.", "Melt the remaining 4 tablespoons butter.  Mix with the crushed crackers, then press the mixture into the bottom and sides of a glass pie plate to form a crust.  Prebake crust for 10 minutes.", "Lightly beat the eggs and milk together in a small bowl.", "Spoon the onions into the crust, then pour the egg mixture over them.  Sprinkle with Parmesan.", "Bake for 30-40 minutes until set and golden."]}, {"name": "Godiva Dark Chocolate Cheesecake", "category": "Dessert", "ingredients": [{"amount": "2 1/2", "unit": "cup", "item": "cream cheese, room temperature"}, {"amount": "1/2", "unit": "cup", "item": "sugar"}, {"amount": "1 3/4", "unit": "tablespoon", "item": "cocoa powder"}, {"amount": "5", "unit": "tablespoon", "item": "Godiva 85% Dark Chocolate Callets"}, {"amount": "2", "unit": "", "item": "eggs"}, {"amount": "2", "unit": "", "item": "egg yolks"}, {"amount": "1 3/4", "unit": "tablespoon", "item": "cr\u00e8me faiche"}], "steps": ["In a food processor with a blade attachment, cream the cheese until smooth and then add in sugar.", "Pulse a couple times to incorporate sugar and cocoa powder.", "Add in eggs and yolks pulsing a couple times again and scrape down to ensure all is smooth and uniform.", "With machine running, pour in melted Godiva Chocolate in a steady stream until all in, and finish by pulsing in the cr\u00e8me fraiche.", "Pour batter into a 10\" x 10\" baking pan and bake at 325 for 30, minutes or until custard is set and a toothpick inserted in center can be removed cleanly.", "The top may caramelize or brown slightly, which is not an issue.", "Once set, remove from oven and allow cheesecake to cool completely.", "Wrap the pan with plastic and reserve in cooler to set and chill completely.", "Once the cheesecake is cold and firm, remove it from the pan and place in a mixer bowl with a paddle attachment.", "Beat the cake for a few moments to soften and smooth out the custard.", "Place smoothed custard into a piping bag with a plain tip and pipe into the bottom of a plastic lined half cylinder mold.", "Tap the mold to ensure the custard is solid and then flatten out to top.", "Freeze the mold to harden the custard for unmolding.", "Once the cake can be unmolded, remove from the pan and cut into 1\u00bd\" sections.", "Brush some tempered Godiva Dark Chocolate onto a strip of acetate and, while it is still fluid, smooth over the top of the molded cheesecake.", "Once the chocolate has cooled and completely crystallized, remove the acetate, revealing a shiny and textured chocolate finish." auce, water, and salt and pepper to taste.", "Bring to a simmer, then add the beans, plus the liquid from one of the cans.", "Cook until the beans are soft, about 5 more minutes.", "Make indentations in the bean mixture and crack an egg into each.", "Sprinkle with salt and pepper, then cover and cook until the egg whites are set, 3 minutes or so. (Whites should still be slightly \"jiggly\" when you remove from heat, as they'll continue cooking for a bit and you want the yolks runny.)", "Meanwhile, make toast. Butter it when it comes out. (Or make skillet toast with butter over high heat, 1 minute per side or until browned.)", "Toss the tomatoes, parsley and remaining olive oil, and salt and pepper to taste in a bowl. Serve the beans and eggs topped with tomato salad, and toast on the side."]}, {"name": "Broccoli soup with cheddar toasts", "category": "Breakfast", "ingredients": [{"amount": "1 1/2", "unit": "tablespoon", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "", "item": "medium onion, coarsely chopped"}, {"amount": "2", "unit": "", "item": "garlic cloves, coarsely chopped"}, {"amount": "2", "unit": "bunches", "item": "broccoli (1 bunch \u2248 11/2lbs), stems and florets chopped separately into 1/2-inch pieces"}, {"amount": "7", "unit": "cup", "item": "low-sodium chicken stock"}, {"amount": "1", "unit": "teaspoon", "item": "coarse salt"}, {"amount": "1", "unit": "cup", "item": "skim milk"}, {"amount": "1/8", "unit": "teaspoon", "item": "cayenne pepper"}, {"amount": "2", "unit": "ounce", "item": "extra-sharp cheddar cheese, grated or crumbled (about 1/2 cup)"}, {"amount": "8", "unit": "", "item": "thin slices crusty baguette"}], "steps": ["Heat oil in a large pot over medium heat until hot but not smoking.", "Add onion, garlic, and broccoli stems; cover, and cook, stirring occasionally, until vegetables are soft, about 15 minutes.", "Add stock and salt; cover, raise heat to medium-high, and bring to a boil.", "Add broccoli florets; reduce heat, and simmer, uncovered, until florets are just tender, about 10 minutes.", "Remove soup from heat, and let cool, about 10 minutes. Fill a blender no more than halfway to puree soup in batches until smooth. Return soup to pot; stir in milk and cayenne. Cook over medium heat until heated through (do not boil).", "Heat broiler. Divide cheese among bread slices; toast under broiler until melted and golden brown, 45 to 60 seconds. Divide soup among bowls. Top each bowl with a cheese toast, and serve."]}, {"name": "Pasta with asparagus and egg", "category": "Breakfast", "ingredients": [{"amount": "3/4", "unit": "lb", "item": "angel hair pasta"}, {"amount": "3", "unit": "tbsp", "item": "unsalted butter"}, {"amount": "1/4", "unit": "cup", "item": "parmesan, grated, about 1/2 oz=1/4 cup"}, {"amount": "1", "unit": "bunch", "item": "thin asparagus (about 1 pound=1 bunch), trimmed to bite-size"}, {"amount": "4", "unit": "", "item": "large eggs"}], "steps": ["Cook pasta. Meanwhile, toss chopped asparagus with oil, salt, pepper, and whatever other seasoning you desire. Roast at 450F for 8 minutes.", "When pasta is done, drain it, reserving some pasta water. Return it to the pot, and add butter, parmesan, and enough pasta water to make a thin sauce. Also add asparagus.", "Fry eggs over easy. Dish the pasta, and top with egg and a little more parmesan."], "timeMinutes": 30}, {"name": "Spaetzle", "category": "Side Dish", "ingredients": [{"amount": "2", "unit": "teaspoon", "item": "fresh parsley, chopped"}, {"amount": "1", "unit": "teaspoon", "item": "garlic, minced"}, {"amount": "3", "unit": "tablespoon", "item": "butter"}, {"amount": "1", "unit": "pinch", "item": "nutmeg"}, {"amount": "1/4", "unit": "teaspoon", "item": "baking powder"}, {"amount": "1", "unit": "teaspoon", "item": "salt"}, {"amount": "1/2", "unit": "cup", "item": "milk"}, {"amount": "1 1/2", "unit": "cup", "item": "flour, sifted"}, {"amount": "2", "unit": "", "item": "eggs, slightly beaten"}, {"amount": "2", "unit": "tablespoon", "item": "finely grated Parmesan, plus extra for garnish"}, {"amount": "", "unit": "", "item": "Salt and freshly ground black pepper"}], "steps": ["Bring a saucepan of salted water it a boil, reduce the heat, and maintain a simmer.", "In a bowl, stir all the ingredients together (eggs, flour, milk, salt, baking powder, and nutmeg).", "Place a colander over the pan, pour about1/4 of the batter into the colander, and press through the holes with a plastic spatula into the hot water.", "When the spatzle starts to float to the surface, cover the pan and keep covered until the spatzle appears to swell and is fluffy.", "Remove the dumplings and repeat the procedure with the remaining batter.", "In a medium saute pan, add butter, and melt over medium heat until butter turns a light brown. Add garlic and cook until it becomes lightly colored. Add spaetzle to the pan to heat through. Add parsley, cheese, salt and pepper, to taste."]}, {"name": "Flaky Buttermilk Biscuits", "category": "Side Dish", "ingredients": [{"amount": "8", "unit": "tablespoon", "item": "unsalted butter, cold, lightly floured and cut into 1/8-inch slices"}, {"amount": "2", "unit": "tablespoon", "item": "vegetable shortening, cut into 1/2-inch chunks"}, {"amount": "1", "unit": "teaspoon", "item": "salt"}, {"amount": "1", "unit": "tablespoon", "item": "baking powder"}, {"amount": "1/2", "unit": "teaspoon", "item": "baking soda"}, {"amount": "2 1/2", "unit": "cup", "item": "unbleached all-purpose flour"}, {"amount": "2", "unit": "tablespoon", "item": "butter, melted"}, {"amount": "1 1/4", "unit": "cup", "item": "buttermilk, cold"}], "steps": ["Adjust oven rack to lower-middle position; heat oven to 450 degrees.", "Whisk flour, baking power, baking soda, and salt in large bowl.", "Add shortening to flour mixture; break up chunks with fingertips until only pea-sized pieces remain.", "Working in batches, drop butter slices into flour mixture and toss to coat; pick up each slice of butter and press between floured fingertips into flat, nickel-sized pieces.", "Repeat until all butter is incorporated; toss to combine.", "Freeze mixture (in bowl) until chilled, about 15 minutes.", "Spray 24-square-inch work surface with nonstick cooking spray; spread spray evenly across surface with kitchen towel or paper towel.", "Sprinkle 1/3 cup of extra flour across sprayed area; gently spread flour across work surface with palm to form thin, even coating.", "Add all but 2 tablespoons of buttermilk to flour mixture; stir briskly with fork until ball forms and no dry bits of flour are visible, adding remaining buttermilk as needed (dough will be sticky and shaggy but should clear sides of bowl).", "With rubber spatula, transfer dough onto center of prepared work surface, dust surface lightly with flour, and, with floured hands, bring dough together into cohesive ball.", "Pat dough into approximate 10-inch square; roll into 18- by 14-inch rectangle about 1/4 inch thick, dusting dough and rolling pin with flour as needed.", "Using bench scraper or thin metal spatula, fold dough into thirds, brushing any excess flour from surface; lift short end of dough and fold in thirds again to form approximate 6- by 4-inch rectangle.", "Rotate dough 90 degrees, dusting work surface underneath with flour; roll and fold dough again, dusting with flour as needed.", "Roll dough into 10-inch square about 1/2 inch thick; flip dough and cut nine 3-inch rounds with floured biscuit cutter, dipping cutter back into flour after each cut.", "Carefully invert and transfer rounds to ungreased baking sheet, spaced 1 inch apart.", "Gather dough scraps into ball; roll and fold once or twice until scraps form smooth dough.", "Roll dough into 1/2-inch-thick round; cut 3 more 3-inch rounds and transfer to baking sheet.", "Discard excess dough.", "Brush biscuit tops with melted butter.  Bake, without opening oven door, until tops are golden brown and crisp, 15 to 17 minutes.  Let cool on baking sheet 5 to 10 minut  and orzo. Cook about 5 minutes or until al dente.", "Add frozen peas and water to the skillet; simmer until tender (about 5 minutes). Drain and return to skillet.", "Stir in pesto, orzo, pancetta, and parmesan, and heat through."]}, {"name": "Roasted potatoes and tomatoes", "category": "Side Dish", "ingredients": [{"amount": "1 1/2", "unit": "pound", "item": "red potatoes"}, {"amount": "2", "unit": "tbsp", "item": "olive oil"}, {"amount": "1", "unit": "pint", "item": "grape tomatoes"}, {"amount": "3", "unit": "sprig", "item": "rosemary"}, {"amount": "3", "unit": "", "item": "garlic cloves, smashed"}, {"amount": "", "unit": "", "item": "salt and pepper"}], "steps": ["Put a baking sheet in the oven and preheat to 450.", "Cut potatoes lengthwise into eighths. Toss with olive oil, tomatoes, rosemary, garlic cloves, salt and pepper. Put cut-side down on the hot baking sheet and roast 15 minutes. Flip the mixture and roast 10 more minutes."], "timeMinutes": 35}, {"name": "Spiced Apple Sauce", "category": "Side Dish", "ingredients": [{"amount": "1", "unit": "tbsp", "item": "unsalted butter"}, {"amount": "1/2", "unit": "", "item": "orange, zested and juiced"}, {"amount": "2", "unit": "tbsp", "item": "sugar"}, {"amount": "1/4", "unit": "tsp", "item": "ground cinnamon"}, {"amount": "1/4", "unit": "", "item": "nutmeg, grated"}, {"amount": "1/4", "unit": "tsp", "item": "ground cloves"}, {"amount": "2", "unit": "", "item": "good eating apples, peeled, cored and chopped into 1 inch dice"}, {"amount": "1", "unit": "", "item": "cooking apple, peeled, cored and chopped into 1 inch dice"}], "steps": ["In a small saucepan gently melt the butter for a minute with the orange zest and juice, the sugar, cinnamon, grated nutmeg and cloves.", "Stir until the butter foams, then stir in the apples.", "Place a lid on top and cook for 15-20 minutes on a medium to low heat until you have a soft, sludgy sauce.", "Taste and add a bit more sugar if you want.", "Serve warm or room temperature."]}, , "steps": ["http://www.xanthir.com/recipes/showrecipe.php?id=id436 Asparagus pesto can be made in large batches ahead of time, and frozen in servings.", "Bring a large pot of water to a rolling boil.", "Meanwhile, make asparagus pesto.", "Salt the pasta water well and cook the pasta until just tender.", "Drain and toss immediately with the asparagus pesto (1/4 cup per serving), stirring in more afterward depending on how heavily coated you like your pasta.", "Serve sprinkled with the remaining toasted pine nuts, a dusting of Parmesan, and a quick drizzle of extra-virgin olive oil."], "timeMinutes": 30}, {"name": "Green-packed Stir Fry with Fresh Herbs", "category": "Vegetarian", "ingredients": [{"amount": "1", "unit": "cup", "item": "cooked rice"}, {"amount": "1", "unit": "tbsp", "item": "safflower oil"}, {"amount": "8", "unit": "oz", "item": "extra-firm tofu, cut into slices 1-inch long and as thick as a pencil"}, {"amount": "4", "unit": "clove", "item": "garlic, minced"}, {"amount": "5", "unit": "", "item": "green onions, chopped with white and green parts separated"}, {"amount": "1", "unit": "tbsp", "item": "fresh ginger, peeled and minced"}, {"amount": "1/2", "unit": "", "item": "jalapeno, deseeded and chopped"}, {"amount": "1/2", "unit": "bunch", "item": "thin asparagus (about 1/2 pound), trimmed and cut diagonally into 1-inch slices"}, {"amount": "1/2", "unit": "cup", "item": "cashews, coarsely chopped"}, {"amount": "2 1/2", "unit": "cup", "item": "spinach leaves, stemmed"}, {"amount": "2", "unit": "tablespoon", "item": "fresh mint, slivered"}, {"amount": "2", "unit": "tablespoon", "item": "fresh basil, slivered"}, {"amount": "2", "unit": "servings", "item": "stir-fry sauce"}], "steps": ["Cook the rice, if it is not already.", "When you have all your ingredients prepped, arrange them within arm's reach of the stove.", "Heat a small splash of safflower oil in a wok or large nonstick pan over medium-high heat.", "When the oil is hot, add the tofu and cook for a enos"}, {"amount": "3", "unit": "", "item": "garlic cloves, unpeeled"}, {"amount": "3", "unit": "tbsp", "item": "fresh lime juice"}, {"amount": "", "unit": "", "item": "salt and freshly ground pepper"}, {"amount": "1/4", "unit": "cup", "item": "fresh cilantro, chopped"}], "steps": ["Heat broiler, with rack in top position. Place tomatoes, onion halves, jalapenos, and garlic in a single layer on a rimmed baking sheet.", "Broil until vegetables are blistered and slightly softened, rotating sheet and flipping vegetables frequently, 6 to 8 minutes (garlic may need to be removed earlier if it is browning too quickly.)", "Discard garlic skins. In a food processor, pulse garlic and vegetables until coarsely pureed. Add lime juice, season with salt and pepper, and pulse to combine.", "Transfer salsa to a bowl and stir in cilantro.", "Yields 3 cups. Refrigerate up to 3 days or freeze up to 3 months.", "For green salsa, use 1 1/2 lbs tomatillos and omit lime juice."], "timeMinutes": 23}, {"name": "Avocado feta dip", "category": "Snack & Appetizer", "ingredients": [{"amount": "1/2", "unit": "", "item": "red onion, diced"}, {"amount": "1", "unit": "", "item": "jalapeno, seeded and diced"}, {"amount": "", "unit": "", "item": "extra-virgin olive oil"}, {"amount": "1", "unit": "", "item": "avocado, diced"}, {"amount": "1", "unit": "cup", "item": "cilantro"}, {"amount": "3/4", "unit": "cup", "item": "feta, crumbled"}, {"amount": "1/4", "unit": "cup", "item": "lemon juice"}, {"amount": "3", "unit": "tbsp", "item": "vegetable oil"}, {"amount": "", "unit": "", "item": "salt"}], "steps": ["Cook onion and jalapeno in olive oil 6 minutes. Puree with remaining ingredients and season with salt to taste.", "Serve with toasted bread and vegetable sticks."], "timeMinutes": 16}, {"name": "Salsa fresca", "category": "Snack & Appetizer", "ingredients": [{"amount": "4", "unit": "", "item": "tomatoes, chopped"}, {"amount": "1/4", "unit": "", "item": "red onion, chopped"}, {"amount": "1", "unit": " // ── State ──────────────────────────────────────────────────────────────────
let favorites = new Set();
let activeFilter = "all";

// ── Category CSS class helper ──────────────────────────────────────────────
function tagClass(cat) {
  return "tag tag-" + cat.replace(/\s+/g, "-").replace(/&/g, "-");
}

// ── Ingredient display ─────────────────────────────────────────────────────
function ingredientLabel(ing) {
  const parts = [ing.amount, ing.unit].filter(Boolean);
  return { measure: parts.join(" "), item: ing.item };
}

// ── Modal state ────────────────────────────────────────────────────────────
let modalIdx = null;

function openModal(idx) {
  const recipe = RECIPES[idx];
  modalIdx = idx;

  document.getElementById("modalName").textContent = recipe.name;
  document.getElementById("modalTag").className = tagClass(recipe.category);
  document.getElementById("modalTag").textContent = recipe.category;

  const timeEl = document.getElementById("modalTime");
  if (recipe.timeMinutes) {
    timeEl.textContent = recipe.timeMinutes + " min";
    timeEl.style.display = "";
  } else {
    timeEl.style.display = "none";
  }

  const heartEl = document.getElementById("modalHeart");
  heartEl.classList.toggle("loved", favorites.has(idx));

  // Ingredients
  const ingList = document.getElementById("modalIngredients");
  ingList.innerHTML = recipe.ingredients.map((ing, i) => {
    const { measure, item } = ingredientLabel(ing);
    return `<li class="ingredient-item" data-i="${i}">
      <input type="checkbox" id="mchk-${idx}-${i}">
      <span class="ingredient-amount">${measure}</span>
      <span class="ingredient-item-name">${item}</span>
    </li>`;
  }).join("");

  ingList.querySelectorAll(".ingredient-item").forEach(li => {
    li.addEventListener("click", (e) => {
      const cb = li.querySelector("input");
      if (e.target !== cb) cb.checked = !cb.checked;
      li.classList.toggle("checked", cb.checked);
    });
  });
  ingList.querySelectorAll("input[type='checkbox']").forEach(cb => {
    cb.addEventListener("click", e => e.stopPropagation());
    cb.addEventListener("change", () => cb.closest(".ingredient-item").classList.toggle("checked", cb.checked));
  });

  // Steps
  document.getElementById("modalSteps").innerHTML = recipe.steps.map((step, i) => `
    <li class="step-item">
      <span class="step-num">${i + 1}</span>
      <span>${step}</span>
    </li>`).join("");

  document.getElementById("modalBackdrop").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
  document.body.style.overflow = "";
  modalIdx = null;
}

// Modal event listeners
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalBackdrop").addEventListener("click", (e) => {
  if (e.target === document.getElementById("modalBackdrop")) closeModal();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

document.getElementById("modalHeart").addEventListener("click", () => {
  if (modalIdx === null) return;
  const heartEl = document.getElementById("modalHeart");
  if (favorites.has(modalIdx)) {
    favorites.delete(modalIdx);
    heartEl.classList.remove("loved");
  } else {
    favorites.add(modalIdx);
    heartEl.classList.add("loved");
  }
  // Also update the card in the grid if visible
  const gridCard = document.querySelector(`.card[data-idx="${modalIdx}"] .heart-btn`);
  if (gridCard) gridCard.classList.toggle("loved", favorites.has(modalIdx));
  if (activeFilter === "favorites") { closeModal(); renderGrid(); }
});

// ── Build a single card (preview only) ─────────────────────────────────────
function buildCard(recipe, idx) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.idx = idx;

  const timeStr = recipe.timeMinutes
    ? `<span class="card-time">${recipe.timeMinutes} min</span>` : "";
  const isFav = favorites.has(idx);

  card.innerHTML = `
    <div class="card-header">
      <div class="card-header-text">
        <div class="card-name">${recipe.name}</div>
        <div class="card-meta">
          <span class="${tagClass(recipe.category)}">${recipe.category}</span>
          ${timeStr}
        </div>
      </div>
      <button class="heart-btn ${isFav ? "loved" : ""}" title="Favorite" aria-label="Toggle favorite">&#9829;</button>
    </div>
    <div class="open-hint">Tap to open recipe &rarr;</div>
  `;

  // Click card body → open modal
  card.addEventListener("click", (e) => {
    if (e.target.closest(".heart-btn")) return;
    openModal(idx);
  });

  // Heart button on card
  card.querySelector(".heart-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    if (favorites.has(idx)) {
      favorites.delete(idx);
      btn.classList.remove("loved");
    } else {
      favorites.add(idx);
      btn.classList.add("loved");
    }
    if (activeFilter === "favorites") renderGrid();
  });

  return card;
}

// ── Build filter bar categories ────────────────────────────────────────────
function buildCategoryFilters() {
  const bar = document.getElementById("filterBar");
  const cats = [...new Set(RECIPES.map(r => r.category))].sort();
  cats.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.dataset.filter = cat;
    btn.textContent = cat;
    bar.appendChild(btn);
  });
}

// ── Render grid ────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const label = document.getElementById("countLabel");

  if (activeFilter === "ingredient-search") {
    if (!ingredientResults) {
      label.textContent = "";
      grid.innerHTML = `<div class="empty-msg" style="font-style:normal;font-size:1rem">Pick ingredients above, then click <strong>Find Recipes</strong> &#x1F373;</div>`;
      return;
    }
    const results = ingredientResults.filter(({ matchCount }) => matchCount > 0);
    label.textContent = `${results.length} recipe${results.length !== 1 ? "s" : ""} found`;
    if (results.length === 0) {
      grid.innerHTML = `<div class="empty-msg">No recipes found. Try removing an ingredient or two.</div>`;
      return;
    }
    results.forEach(({ r, i, matchCount, total }) => {
      const card = buildCard(r, i);
      const badge = document.createElement("div");
      badge.className = "match-badge";
      badge.textContent = `\u2713 matches ${matchCount} of ${total} ingredient${total !== 1 ? "s" : ""} you have`;
      card.appendChild(badge);
      grid.appendChild(card);
    });
    return;
  }

  let shown = [];
  if (activeFilter === "all") {
    shown = RECIPES.map((r, i) => ({ r, i }));
  } else if (activeFilter === "favorites") {
    shown = [...favorites].map(i => ({ r: RECIPES[i], i }));
  } else {
    shown = RECIPES.map((r, i) => ({ r, i })).filter(({ r }) => r.category === activeFilter);
  }

  label.textContent = `${shown.length} recipe${shown.length !== 1 ? "s" : ""}`;
  if (shown.length === 0) {
    grid.innerHTML = `<div class="empty-msg">No recipes here yet — add some favorites first! ♥</div>`;
    return;
  }
  shown.forEach(({ r, i }) => grid.appendChild(buildCard(r, i)));
}

// ── Ingredient search feature ──────────────────────────────────────────────

// Build a deduplicated list of all ingredient names from every recipe.
// We strip everything after the first comma so "garlic, minced" → "garlic".
// That way the suggestions stay clean, but matching is still fuzzy (see scoreRecipe).
const ALL_INGREDIENTS = (() => {
  const seen = new Set();
  RECIPES.forEach(recipe => {
    recipe.ingredients.forEach(ing => {
      if (!ing.item) return;
      const core = ing.item.toLowerCase().replace(/,.*/, '').replace(/\(.*\)/, '').trim();
      if (core.length > 1) seen.add(core);
    });
  });
  return [...seen].sort();
})();

let selectedIngredients = [];   // the pills the user has added
let ingredientResults = null;   // null = not searched yet; array = results

// Score a single recipe: count how many selectedIngredients appear in it.
// We check if the selected term is contained anywhere in the ingredient item string,
// so "garlic" matches "garlic, minced" and "garlic powder".
function scoreRecipe(recipe, selected) {
  let count = 0;
  selected.forEach(sel => {
    const hit = recipe.ingredients.some(ing =>
      ing.item.toLowerCase().includes(sel.toLowerCase())
    );
    if (hit) count++;
  });
  return count;
}

// Highlight the matching part of a suggestion string in bold.
function highlight(text, query) {
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + '<em>' + text.slice(idx, idx + query.length) + '</em>' + text.slice(idx + query.length);
}

// ── DOM refs for ingredient search ──
const ingInput    = document.getElementById("ingInput");
const ingDropdown = document.getElementById("ingDropdown");
const ingPills    = document.getElementById("ingPills");
const ingFindBtn  = document.getElementById("ingFindBtn");
const ingPanel    = document.getElementById("ingSearchPanel");
const ingClearBtn = document.getElementById("ingClearBtn");

// Rebuild the pills row from selectedIngredients.
function renderPills() {
  ingPills.innerHTML = "";
  selectedIngredients.forEach((name, idx) => {
    const pill = document.createElement("span");
    pill.className = "ing-pill";
    pill.innerHTML = `${name} <button class="ing-pill-remove" data-idx="${idx}" title="Remove">&#10005;</button>`;
    ingPills.appendChild(pill);
  });
  ingFindBtn.disabled = selectedIngredients.length === 0;
}

// Show autocomplete suggestions for whatever is in the input.
function showSuggestions(query) {
  if (!query) { ingDropdown.classList.remove("open"); return; }
  const matches = ALL_INGREDIENTS.filter(name =>
    name.includes(query.toLowerCase()) && !selectedIngredients.includes(name)
  ).slice(0, 12);

  if (matches.length === 0) { ingDropdown.classList.remove("open"); return; }
  ingDropdown.innerHTML = matches
    .map(name => `<div class="ing-suggestion" data-name="${name}">${highlight(name, query)}</div>`)
    .join("");
  ingDropdown.classList.add("open");
}

// Add an ingredient pill (called when user clicks a suggestion).
function addIngredient(name) {
  if (!selectedIngredients.includes(name)) {
    selectedIngredients.push(name);
    renderPills();
    // Reset any previous results so "Find Recipes" is needed again.
    ingredientResults = null;
  }
  ingInput.value = "";
  ingDropdown.classList.remove("open");
  ingInput.focus();
}

// Remove a pill by its index in selectedIngredients.
function removeIngredient(idx) {
  selectedIngredients.splice(idx, 1);
  ingredientResults = null;
  renderPills();
  if (activeFilter === "ingredient-search") renderGrid();
}

// Run the search: score every recipe and sort highest-match-count first.
function runIngredientSearch() {
  if (selectedIngredients.length === 0) return;
  const total = selectedIngredients.length;
  ingredientResults = RECIPES
    .map((r, i) => ({ r, i, matchCount: scoreRecipe(r, selectedIngredients), total }))
    .filter(({ matchCount }) => matchCount > 0)
    .sort((a, b) => b.matchCount - a.matchCount);
  renderGrid();
}

// Reset everything and go back to normal browsing.
function clearIngredientSearch() {
  selectedIngredients = [];
  ingredientResults = null;
  ingInput.value = "";
  ingDropdown.classList.remove("open");
  renderPills();
  ingPanel.classList.remove("visible");
  // Switch back to "All Recipes" tab
  activeFilter = "all";
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.querySelector('[data-filter="all"]').classList.add("active");
  renderGrid();
}

// ── Ingredient search event wiring ──

// Typing in the input → show suggestions
ingInput.addEventListener("input", () => showSuggestions(ingInput.value.trim()));

// Click a suggestion → add pill
ingDropdown.addEventListener("click", (e) => {
  const s = e.target.closest(".ing-suggestion");
  if (s) addIngredient(s.dataset.name);
});

// Pressing Enter in the input → add top suggestion or exact match
ingInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const first = ingDropdown.querySelector(".ing-suggestion");
    if (first) addIngredient(first.dataset.name);
  }
  if (e.key === "Escape") ingDropdown.classList.remove("open");
});

// Click a pill's ✕ button → remove that ingredient
ingPills.addEventListener("click", (e) => {
  const btn = e.target.closest(".ing-pill-remove");
  if (btn) removeIngredient(Number(btn.dataset.idx));
});

// "Find Recipes" button
ingFindBtn.addEventListener("click", runIngredientSearch);

// "Clear search" link
ingClearBtn.addEventListener("click", clearIngredientSearch);

// Close dropdown when clicking outside
document.addEventListener("click", (e) => {
  if (!ingInput.contains(e.target) && !ingDropdown.contains(e.target)) {
    ingDropdown.classList.remove("open");
  }
});

// ── Filter button events ───────────────────────────────────────────────────
document.getElementById("filterBar").addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  activeFilter = btn.dataset.filter;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  // Show or hide the ingredient search panel depending on which tab is active.
  ingPanel.classList.toggle("visible", activeFilter === "ingredient-search");
  renderGrid();
});
